<!doctype html>
<!-- Card shapes (0.15.0): each shape in each notation (box, c4, uml), drawn inside its card's box with its ports on its
     outline and its text in its face; a change of notation that draws the cards again and lays nothing out; the notation in
     render(), handle.shapes, MapState, the state event, <umlimator-map shapes>, the page's toggle, link and memory; exports,
     the minimap, rings and the legend. tests/embed.py opens this in headless Chrome under reduced motion and reads
     <pre id="result">; tests/motion.html checks the shapes' motion with motion on. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>umlimator shapes test</title>
<body style="margin:0">
<div id="a" style="width:1300px;height:760px"></div>
<div id="page" style="width:1200px;height:800px"></div>
<umlimator-map id="el" src="../examples/shapes.json" shapes="uml" height="420"></umlimator-map>
<script type="module">
import { render, mountPage, validate } from '../lib/umlimator.js';
import '../lib/umlimator-element.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const until = async (f, ms = 4000) => { const t = Date.now(); while (!f() && Date.now() - t < ms) await wait(20); return f(); };
const errors = [], onError = e => errors.push(String(e.message || e.error)); addEventListener('error', onError);
const warned = [], warn0 = console.warn; console.warn = (...a) => { warned.push(a.join(' ')); warn0(...a); };
const SHAPES = await (await fetch('../examples/shapes.json')).json(), BOOK = await (await fetch('../examples/bookshop.json')).json();
const el = document.getElementById('a');
let h = null, sr = null;
const mount = (model, opts = {}) => { if (h) h.destroy(); el.innerHTML = ''; h = render(el, model, opts); sr = el.querySelector('.umlimator').shadowRoot; return h; };
const inner = x => x[Object.getOwnPropertySymbols(x)[0]];
const drawn = () => Object.fromEntries([...sr.querySelectorAll('.node')].map(g => [g.dataset.id, g.dataset.shape || 'box']));
// what each notation draws in shapes.json (docs/module-api.md, 0.15.0): the box notation's only shape is the desk's own
const WANT = {
  box: { desk: 'window' },
  c4: { shoppers: 'person', staff: 'person', storefront: 'browser', app: 'mobile', desk: 'window', cli: 'terminal', agent: 'robot', orders: 'cylinder', queue: 'pipe', policies: 'document', fraud: 'hexagon' },
  uml: { shoppers: 'person', staff: 'person', desk: 'window', agent: 'robot', orders: 'cylinder', policies: 'document', pricing: 'folder', hosts: 'node', fraud: 'hexagon' },
};
const pt = (svg, x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p; };
try {
  // ---- each shape in each notation: inside its box, ports on its outline, text in its face
  const seen = new Set();
  for (const nt of ['box', 'c4', 'uml']) {
    mount(SHAPES, { shapes: nt });
    const want = Object.fromEntries(SHAPES.nodes.map(n => [n.id, WANT[nt][n.id] || 'box'])), got = drawn();
    const sorted = o => JSON.stringify(Object.entries(o).sort());
    check(`${nt}: each card is the shape the notation draws for it`, sorted(got) === sorted(want), got);
    check(`${nt}: handle.shapes and MapState say the notation`, h.shapes === nt && h.state.shapes === nt, [h.shapes, h.state.shapes]);
    Object.values(got).forEach(s => seen.add(s));
    const geo = inner(h).geo(), svg = sr.querySelector('svg.map-svg'), shaped = [...sr.querySelectorAll('.node[data-shape]')];
    const outside = shaped.filter(g => { const n = geo.byId[g.dataset.id], b = g.querySelector('.n-mask').getBBox();
      return b.x < n.x - .5 || b.y < n.y - .5 || b.x + b.width > n.x + n.w + .5 || b.y + b.height > n.y + n.h + .5; }).map(g => g.dataset.id);
    check(`${nt}: every shape is drawn inside its card's own box`, shaped.length === Object.values(want).filter(s => s !== 'box').length && !outside.length, outside);
    const off = [];
    shaped.forEach(g => { const body = g.querySelector('.n-body'), w0 = body.style.strokeWidth; body.style.strokeWidth = '3px';
      g.querySelectorAll('.n-port').forEach(c => { if (!body.isPointInStroke(pt(svg, +c.getAttribute('cx'), +c.getAttribute('cy')))) off.push(`${g.dataset.id}@${c.getAttribute('cx')},${c.getAttribute('cy')}`); });
      body.style.strokeWidth = w0; });
    check(`${nt}: every port of a shape sits on its outline`, shaped.some(g => g.querySelector('.n-port')) && !off.length, off);
    const spill = [];
    shaped.forEach(g => { const [t, b] = g.dataset.face.split(' ').map(Number);
      g.querySelectorAll('text[data-o]').forEach(x => { const r = x.getBBox(); if (r.y < t - 1 || r.y + r.height > b + 1) spill.push(`${g.dataset.id}: ${x.textContent}`); }); });
    check(`${nt}: a shape's name and sub-line keep to its face`, !spill.length, spill);
    const lines = [...sr.querySelectorAll('.edge-g')].filter(e => { const d = e.querySelector('.edge').getAttribute('d'), m = d.match(/^M ([\d.]+) ([\d.]+)/);
      const s = sr.querySelector(`.node[data-id="${CSS.escape(e.dataset.from)}"][data-shape] .n-body`); if (!s || !m) return false;
      s.style.strokeWidth = '3px'; const on = s.isPointInStroke(pt(svg, +m[1], +m[2])); s.style.strokeWidth = ''; return !on; }).map(e => e.dataset.from + '>' + e.dataset.to);
    check(`${nt}: a line leaves a shape from its outline`, !lines.length, lines);
  }
  check('the three notations draw all 13 shapes between them', ['box', 'person', 'browser', 'mobile', 'cylinder', 'pipe', 'document', 'hexagon', 'robot', 'terminal', 'window', 'folder', 'node'].every(s => seen.has(s)), [...seen]);
  check('uml marks a box with the component icon; c4 keeps the kind\'s own mark', (() => { mount(SHAPES, { shapes: 'uml' }); const u = sr.querySelector('.node[data-id="api"] .n-sigil').innerHTML;
    mount(SHAPES, { shapes: 'c4' }); return u.includes('M4.5 4.5') && !sr.querySelector('.node[data-id="api"] .n-sigil').innerHTML.includes('M4.5 4.5'); })());
  check('c4 and uml dash an external card; box draws it as before, solid',
    (() => { mount(SHAPES, { shapes: 'c4' }); const c = !!sr.querySelector('.node[data-id="payments"] .n-body[stroke-dasharray]'); mount(SHAPES, { shapes: 'box' }); return c && !sr.querySelector('.node[data-id="payments"] .n-body[stroke-dasharray]'); })());

  // ---- the notation changes: the cards are drawn again from the same geometry, the camera, selection and marks kept
  const states = [];
  mount(SHAPES, { shapes: 'c4', minimap: true, on: { state: e => states.push(e) } });
  h.select({ type: 'node', id: 'orders', view: 'shapes' }); h.overlay('t', { nodes: { orders: { tone: 'rose' } } });
  await wait(60); states.length = 0;
  const g0 = inner(h).geo(), cam0 = JSON.stringify(h.state.camera), svg0 = sr.querySelector('svg.map-svg');
  h.shapes = 'uml'; await wait(60);
  check('handle.shapes = uml draws the cards again with nothing laid out: the same geometry, camera and selection',
    inner(h).geo() === g0 && JSON.stringify(h.state.camera) === cam0 && h.selection && h.selection.id === 'orders' && sr.querySelector('svg.map-svg') !== svg0 && drawn().pricing === 'folder',
    [inner(h).geo() === g0, h.state.camera, h.selection]);
  check('…and says so: the state event names shapes, with MapState.shapes uml', states.some(e => e.changed.includes('shapes') && e.state.shapes === 'uml'), states.map(e => e.changed));
  check('…a ring follows the shape\'s outline, 5 px out', sr.querySelector('.um-rings path.um-ring') && !sr.querySelector('.um-rings rect.um-ring'));
  check('…and the minimap draws each shape\'s outline', sr.querySelectorAll('.minimap path').length === sr.querySelectorAll('.node[data-shape]').length);
  h.shapes = null; await wait(30);
  check('handle.shapes = null: each view\'s own again (the model\'s c4)', h.shapes === 'c4' && drawn().storefront === 'browser' && inner(h).geo() === g0);
  warned.length = 0; h.shapes = 'sketch';
  check('a notation that is not one changes nothing, and warns with the three', h.shapes === 'c4' && warned.some(w => /box, c4, uml/.test(w)), warned);
  warned.length = 0; mount(SHAPES, { shapes: 'blocks' });
  check('render(…, { shapes }) that is not a notation warns, and each view draws its own', h.shapes === 'c4' && warned.some(w => /blocks/.test(w)), warned);
  const places = () => JSON.stringify(inner(h).geo().nodes.map(n => [n.id, n.x, n.y, n.w, n.h]));
  const M2 = structuredClone(SHAPES); M2.shapes = 'uml'; const p1 = places(); h.update(M2); await wait(30);
  check('update() with the model\'s notation changed draws it, every card where it was', h.shapes === 'uml' && drawn().hosts === 'node' && places() === p1);
  const M3 = structuredClone(M2); M3.views[0].shapes = 'box'; const g1 = inner(h).geo(); h.update(M3); await wait(30);
  check('…and a view\'s own notation wins over the model\'s, drawn from the same geometry', h.shapes === 'box' && drawn().hosts === 'box' && inner(h).geo() === g1);

  // ---- exports draw the shapes, at rest
  mount(SHAPES, { shapes: 'c4' });
  const file = h.toSVG(), png = await h.toPNG();
  check('toSVG() draws the shapes, their outlines and details', /data-shape="cylinder"/.test(file) && /class="n-body"/.test(file) && /n-accent/.test(file) && !/n-floor[^>]*animation/.test(file));
  check('toPNG() draws them too', png instanceof Blob && png.size > 1000, png && png.size);
  check('another view\'s export draws in that view\'s notation', (() => { const m = structuredClone(SHAPES); m.views.push({ ...m.views[0], id: 'boxes', shapes: 'box' }); mount(m, { view: 'shapes' }); return /data-shape/.test(h.toSVG({ view: 'shapes' })) && !/data-shape="person"/.test(h.toSVG({ view: 'boxes' })); })());

  // ---- the legend shows the shapes in use; an external card's key is dashed only where the cards are
  const names = () => [...sr.querySelectorAll('.lgi b')].map(b => b.textContent), dashedExt = () => [...sr.querySelectorAll('.lgi')].some(l => l.querySelector('b').textContent === 'External' && l.querySelector('i.d, svg [stroke-dasharray]'));
  mount(SHAPES, { shapes: 'c4', legend: true });
  const keyed = name => [...sr.querySelectorAll('.lgi')].some(l => l.querySelector('b').textContent === name && l.querySelector('svg.lgs'));
  check('c4: the legend names the shapes the kinds\' keys don\'t show (a person, a browser app, a phone, a terminal, a window)', ['Person', 'Browser app', 'Mobile app', 'Command line', 'Desktop app'].every(n => names().includes(n)) && !names().includes('Agent'), names());
  check('c4: a kind drawn in one shape has that shape as its key (data stores, queues, agents, files)', ['Data store', 'Queue / Event', 'Agent / AI', 'File / Doc'].every(keyed));
  check('c4: the External key is dashed, as its cards are', dashedExt());
  h.shapes = 'box'; await wait(30);
  check('box: no shape keys, and the External key is solid, as its cards are (it was dashed while they were solid)', !names().includes('Person') && !dashedExt(), names());
  h.shapes = 'uml'; await wait(30);
  check('uml: the legend names the folder and UML\'s component, and the hosts\' key is a node', ['Package', 'Component'].every(n => names().includes(n)) && keyed('Infra / Cloud'), names());
  mount(BOOK, { legend: true });
  check('a model without a notation draws as before: no shapes, the same legend', !sr.querySelector('.node[data-shape]') && h.shapes === 'box' && !names().includes('Person'), names());

  // ---- reduced motion: no accent flash, no moving floor (tests/motion.html has them moving)
  mount(SHAPES, { shapes: 'c4', flow: true });
  inner(h).flash('orders'); await wait(30);
  const acc = sr.querySelector('.node[data-id="orders"] .n-accent'), floor = sr.querySelector('.node[data-id="queue"] .n-floor');
  check('under reduced motion an arriving card\'s accent does not move, and a queue\'s floor is still', getComputedStyle(acc).animationName === 'none' && getComputedStyle(floor).animationName === 'none' && getComputedStyle(floor).opacity === '0',
    [getComputedStyle(acc).animationName, getComputedStyle(floor).animationName, getComputedStyle(floor).opacity]);

  // ---- validate(): unknown shapes and notations, and the hint for a person drawn as a browser
  const V = validate({ shapes: 'c4', nodes: [{ id: 'r', label: 'Riders', kind: 'frontend', icon: 'users' }, { id: 'x', shape: 'blob' }], views: [{ id: 'v', shapes: 'nope', nodeIds: ['r', 'x'] }] });
  check('validate() warns about an unknown shape and notation, and hints that c4 draws a frontend card with a person\'s icon as a browser',
    ['nodes[1].shape', 'views[0].shapes', 'nodes[0].kind'].every(p => V.some(x => x.path === p && x.level === 'warning')) && /kind "person"/.test((V.find(x => x.path === 'nodes[0].kind') || {}).message), V);

  // ---- <umlimator-map shapes>: the notation from the attribute, and a new one without a new draw
  const me = document.getElementById('el');
  await until(() => me.map && me.map.view);
  const em = me.map, eg = inner(em).geo();
  check('<umlimator-map shapes="uml"> draws in uml', em.shapes === 'uml' && em.state.shapes === 'uml');
  me.setAttribute('shapes', 'c4'); await wait(60);
  check('…and shapes="c4" draws its cards again in the same map: nothing loads or lays out again', me.map === em && em.shapes === 'c4' && inner(em).geo() === eg);
  me.removeAttribute('shapes'); await wait(60);
  check('…and no attribute: the model\'s own notation', me.map === em && em.shapes === 'c4');

  // ---- the standalone page: its toggle, the link and the reader's choice kept
  const box = document.getElementById('page'), key = 'visual-shapes:' + location.pathname;
  try { localStorage.removeItem(key); } catch (_) {}
  history.replaceState(null, '', location.pathname + '#view=shapes&shapes=uml');
  let pg = mountPage(box, SHAPES, { instant: true });
  await until(() => pg.view && document.querySelector('#m-canvas .umlimator')); await wait(60);
  const btn = () => document.getElementById('m-shapes'), link = () => new URLSearchParams(location.hash.slice(1));
  check('the page draws the link\'s notation, and its toggle says it', pg.shapes === 'uml' && /uml/.test(btn().textContent) && /Card shapes: uml/.test(btn().getAttribute('aria-label')), [pg.shapes, btn().textContent]);
  btn().click(); await wait(80);
  check('the toggle goes on to the next notation, writes it into the link and keeps it for this page', pg.shapes === 'box' && link().get('shapes') === 'box' && localStorage.getItem(key) === 'box' && /box/.test(btn().textContent), [pg.shapes, location.hash, localStorage.getItem(key)]);
  btn().click(); await wait(80);
  check('…and again: c4', pg.shapes === 'c4' && link().get('shapes') === 'c4');
  pg.destroy(); box.innerHTML = '';
  history.replaceState(null, '', location.pathname + '#view=shapes');
  pg = mountPage(box, SHAPES, { instant: true });
  await until(() => pg.view && document.querySelector('#m-canvas .umlimator')); await wait(60);
  check('a page opened again draws the notation the reader kept for it', pg.shapes === 'c4' && pg.state.shapes === 'c4');
  history.pushState(null, '', location.pathname + '#view=shapes&shapes=uml'); dispatchEvent(new PopStateEvent('popstate'));
  await until(() => pg.shapes === 'uml' && /uml/.test(btn().textContent), 3000);
  check('an edited link (or Back) takes the map to the link\'s notation', pg.shapes === 'uml' && /uml/.test(btn().textContent));
  pg.destroy(); box.innerHTML = ''; try { localStorage.removeItem(key); } catch (_) {}
  history.replaceState(null, '', location.pathname);

  // ---- what sits on a shape's top, and what meets its outline (the 0.15.0 review's fixes)
  const FIX = { nodes: [{ id: 'p', label: 'Person', kind: 'person', badges: ['beta'] }, { id: 'r', label: 'Robot', kind: 'agent' }, { id: 'f', label: 'Pricing', kind: 'module', badges: ['v2'] },
    { id: 'api', label: 'API', kind: 'backend' }, { id: 'sa', label: 'Job A', kind: 'backend' }, { id: 'sb', label: 'Job B', kind: 'backend' }, { id: 'rs', label: 'Bot script', kind: 'script', shape: 'robot' }],
    edges: [{ from: 'p', to: 'api' }, { from: 'r', to: 'api' }, { from: 'f', to: 'api' }, { from: 'sa', to: 'rs' }, { from: 'sb', to: 'rs' }],
    views: [{ id: 'v', nodeIds: ['p', 'r', 'f', 'api', 'sa', 'sb', 'rs'], intake: [{ to: 'p', label: 'one' }, { to: 'p', label: 'two' }, { to: 'p', label: 'three' }] },
      { id: 'steps', render: 'process', nodeIds: ['p', 'r', 'api'] }] };
  const rectOf = r => r ? ['x', 'y', 'width', 'height'].map(k => +r.getAttribute(k)) : [];
  const onOutline = (id, x, y) => { const b = sr.querySelector(`.node[data-id="${id}"] .n-body`); b.style.strokeWidth = '3px'; const on = b.isPointInStroke(pt(sr.querySelector('svg.map-svg'), x, y)); b.style.strokeWidth = ''; return on; };
  mount(FIX, { shapes: 'uml', on: { click() {} } }); await wait(60);
  const fg = inner(h).geo().byId;
  h.overlay('m', { nodes: { p: { badge: 'hot' }, r: { badge: 'new' }, f: { badge: 'xx' } } });
  const otab = t => rectOf(([...sr.querySelectorAll('.um-tab')].find(g => g.textContent === t) || {}).firstChild), own = id => rectOf(sr.querySelector(`.node[data-id="${id}"] .pub-tab rect`));
  check('an overlay\'s tab sits on a person\'s, robot\'s and folder\'s tab line, as the card\'s own tabs do', otab('hot')[1] === own('p')[1] && otab('xx')[1] === own('f')[1] && otab('new')[1] === fg.r.y + 14 - 8,
    [otab('hot'), own('p'), otab('new'), fg.r.y, otab('xx'), own('f')]);
  const ftab = sr.querySelector('.node[data-id="f"] .n-det.n-accent').getBBox();
  check('…and after a folder\'s own tab, not over it', otab('xx')[0] >= ftab.x + ftab.width, [otab('xx'), ftab.x + ftab.width]);
  const ring = id => rectOf(sr.querySelector(`.tab-key[data-node="${id}"] rect`));
  check('a badge\'s keyboard focus ring is round its tab on a person and a folder', ['p', 'f'].every(id => ring(id)[1] <= own(id)[1] && ring(id)[1] + ring(id)[3] >= own(id)[1] + own(id)[3]), ['p', 'f'].map(id => [ring(id), own(id)]));
  const rsPorts = [...sr.querySelectorAll('.node[data-id="rs"] .n-port')].map(c => [+c.getAttribute('cx'), +c.getAttribute('cy')]);
  check('a robot on a 42 px script card takes both its left ports on its outline', fg.rs.h === 42 && rsPorts.length === 2 && rsPorts.every(([x, y]) => onOutline('rs', x, y)), [fg.rs.h, rsPorts]);
  const feeds = [...sr.querySelectorAll('.intake > path.edge')].map(p => { const q = p.getPointAtLength(p.getTotalLength()); return [q.x, q.y]; });
  check('a feeds line ends on a person\'s outline, as a line does', feeds.length === 3 && feeds.every(([x, y]) => onOutline('p', x, y)), feeds);
  await h.setView('steps'); await wait(60);
  const pill = id => { const g = sr.querySelector(`.node[data-id="${id}"]`), r = rectOf(g.querySelector('.step rect')), b = g.querySelector('.n-body'), svg = sr.querySelector('svg.map-svg'); let hit = 0;
    for (let i = 0; i <= 20; i++) for (let j = 0; j <= 20; j++) if (b.isPointInFill(pt(svg, r[0] + r[2] * i / 20, r[1] + r[3] * j / 20))) hit++; return hit; };
  check('a step\'s number sits on a person\'s and a robot\'s shoulder, not in the air above it', pill('p') > 0 && pill('r') > 0, [pill('p'), pill('r')]);
  mount(BOOK, { shapes: 'uml', legend: true });
  check('uml: the legend names UML\'s component where a card\'s icon is not in the icon table, so the card shows the component mark', sr.querySelector('.node .n-sigil path[d^="M4.5 4.5"]') && names().includes('Component'), names());
  const OWN = structuredClone(SHAPES); OWN.nodes.find(n => n.id === 'orders').shape = 'cylinder';
  mount(OWN, { shapes: 'box', minimap: true }); h.overlay('t', { nodes: { orders: { tone: 'rose' } } }); await wait(30);
  check('box: a card\'s own shape has its ring on its outline, and the minimap draws it', sr.querySelector('.um-rings path.um-ring') && !sr.querySelector('.um-rings rect.um-ring') && sr.querySelectorAll('.minimap path').length === 2, sr.querySelectorAll('.minimap path').length);

  check('no errors on the way', !errors.length, errors);
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
if (h) h.destroy();
removeEventListener('error', onError); console.warn = warn0;
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
