<!-- The map's moves with motion on (0.14.0): tests/embed.py opens this without --force-prefers-reduced-motion. Headless
     virtual time runs one animation frame only, so frames here are 16 ms timers, which it does run. A press during a
     glide, a second setView(), an update() or destroy() mid-move, a selection mid-ease: each finishes or settles. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>umlimator motion test</title>
<body style="margin:0">
<div id="a" style="width:1000px;height:700px"></div>
<div id="b" style="width:1000px;height:700px"></div>
<div id="page" style="width:1200px;height:800px"></div>
<script type="module">

const wait = ms => new Promise(r => setTimeout(r, ms));

const el = document.getElementById('a');
let h = null, sr = null, ev = [];

  check('motion is on for this page (tests/embed.py runs it without --force-prefers-reduced-motion)', motionOn);

  // a press as the drill-down zoom starts settled nothing: the map stayed on the old view, busy, until a later camera move
  await mount();
  sr.querySelector('.node[data-id="bikeshare"]').dispatchEvent(new MouseEvent('dblclick', { bubbles: true, composed: true, detail: 2 }));
  press(); // the same task: before the zoom's first frame

  check('a press on the map as a drill-down zooms in lets the move finish: the view shows and viewchange comes', h.view === 'system' && ev.includes('system'), [h.view, ev]);
  check('…and the next setView() is not dropped', await h.setView('trips') === true && h.view === 'trips', h.view);

  const p1 = h.setView('system'); await wait(60);
  const p2 = h.setView('fleet');

  const m2 = structuredClone(BIKE); m2.views = m2.views.filter(v => v.id !== 'fleet'); h.update(m2);

  check('…and the next setView() works', await h.setView('trips') === true && h.view === 'trips', h.view);

  const p4 = h.setView('system');

  const p5 = h.setView('system'); await wait(60);
  const t5 = h.tour(['riders', 'bikeshare', 'payments']); const h5 = h; h = null; h5.destroy();
  await wait(0);
  check("destroy() during a move: setView()'s promise resolves false", JSON.stringify(await state(p5)) === '["settled",false]');
  check("…and a tour's resolves false at once, not on a later frame", JSON.stringify(await state(t5)) === '["settled",false]');

  await mount({ view: 'system' });

  await mount({ on: { state: e => ce.push(e) } }); ce.length = 0;
  const z0 = h.state.camera.zoom; zoomKey('+'); // a 220 ms glide
  await wait(100); const mid = h.state.camera.zoom, during = camEv().length;
  await wait(600);

    && camEv()[0].state.camera.zoom === h.state.camera.zoom && h.state.camera.zoom !== mid, [z0, mid, during, camEv().map(e => e.state.camera.zoom), h.state.camera.zoom]);
  ce.length = 0; zoomKey('+'); await wait(60); zoomKey('+'); await wait(60); zoomKey('-'); await wait(700);

  await mount({ view: 'trips' });
  const X = h[Object.getOwnPropertySymbols(h)[0]], dot = () => +(sr.querySelector('.um-trip circle') || { getAttribute: () => NaN }).getAttribute('cx');
  const tp = h.tour(['rider-app', 'trip-api', 'unlock', 'stations']); await wait(150);

  check("the page's Pause holds a tour's dot where it is, and Play lets it ride on", Number.isFinite(d0) && d0 === d1 && d2 !== d1, [d0, d1, d2]);
  stage().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
  check('Esc ends a tour: its promise is false, the dot goes, and the map stays where it is', JSON.stringify(await state(tp)) === '["settled",false]' && !sr.querySelector('.um-trip') && h.state.tour === false && h.view === 'trips', [h.view, h.state.tour]);
  const T2 = { nodes: [{ id: 'a', label: 'A' }, { id: 'b', label: 'B' }], edges: [{ id: 'ab', from: 'a', to: 'b' }], views: [{ id: 'v', nodeIds: ['a', 'b'] }],
    stories: [{ id: 's', steps: [{ view: 'v', caption: 'one', duration: 600 }, { view: 'v', caption: 'two', duration: 600 }] }] };
  await mount({}, T2);
  const X2 = h[Object.getOwnPropertySymbols(h)[0]], sp = h.play('s'); await until(() => sp.state === 'playing', 2000);
  X2.pause(true); await wait(1500); const held = sp.step; X2.pause(false); await until(() => sp.step === 1, 3000);
  check("the page's Pause holds a playing story on its step; Play lets it go on", held === 0 && sp.step === 1, [held, sp.step]);
  sp.stop();
  // the story's own pause holds its step's tour too, and resume lets it ride on (M); a story opened with auto: false still rides it
  await mount({ view: 'trips' });
  const sm = h.play('ride', { step: 2 }), playBtn = () => sr.querySelector('.um-story [data-s="play"]');
  await until(() => sr.querySelector('.um-trip circle'), 4000); await wait(150);
  sm.pause(); const q0 = dot(); await wait(400); const q1 = dot(); sm.resume(); await wait(200); const q2 = dot();
  playBtn().click(); const q3 = dot(); await wait(400); const q4 = dot(); playBtn().click(); await wait(200); const q5 = dot();
  check("the story's pause() and its bar's ❚❚ hold its step's tour where it is; resume() and ▶ let it ride on", Number.isFinite(q0) && q0 === q1 && q2 !== q1 && q3 === q4 && q5 !== q4, [q0, q1, q2, q3, q4, q5]);
  sm.stop();
  const sa = h.play('ride', { step: 2, auto: false }); await until(() => sr.querySelector('.um-trip circle'), 4000); const a0 = dot(); await wait(300);
  check("…and a story opened with auto: false, which nobody paused, still rides its step's tour", Number.isFinite(a0) && dot() !== a0, [a0, dot()]);
  sa.stop();
  // the page's ❚❚ is in the state (#131): paused, one state event each way, none for the same value again; under it a story,

  const se = []; await mount({ view: 'trips', on: { state: e => se.push(e) } });
  const X3 = h[Object.getOwnPropertySymbols(h)[0]], said = () => se.filter(e => e.changed.includes('paused')).map(e => e.state.paused).join();
  const sq = h.play('ride', { step: 2 }); await until(() => sr.querySelector('.um-trip circle') && sq.state === 'playing', 4000);
  X3.pause(true); X3.pause(true); await wait(100); const on = [h.state.paused, h.state.story && h.state.story.playing, h.state.tour, sq.state, said()];
  X3.pause(false); await wait(100); const off = [h.state.paused, said()];
  sq.pause(); const own = [h.state.paused, h.state.story.playing, h.state.tour]; sq.stop();
  check("the page's ❚❚ is in the state: paused, one state event each way; the story still playing, and its step's tour held on the map",
    on.join() === 'true,true,true,playing,true' && off.join() === 'false,true,false' && own.join() === 'false,false,true', [on, off, own]);
  se.length = 0; const rq = h.replay(otlpSpans(T), { match: M }); await wait(100);
  X3.pause(true); await wait(100); const ron = [h.state.paused, JSON.stringify(h.state.replay), said()];
  X3.pause(false); await wait(100); const roff = [h.state.paused, JSON.stringify(h.state.replay), said()]; rq.stop();
  check("…and over a replay: paused, one state event each way, the replay still playing", ron.join() === 'true,{"playing":true},true'
    && roff.join() === 'false,{"playing":true},true,false', [ron, roff]);
  // an update() as a step's camera glides in: the step still gets its framing (rider-app at 75%)
  await mount({ view: 'context' });
  let cut = false; h.on('select', e => { if (cut || !e.target || e.target.id !== 'trips') return; cut = true; const m = structuredClone(BIKE); m.nodes.find(n => n.id === 'accounts').label = 'Accounts and sign-in'; h.update(m); });
  const s2 = h.play('ride', { step: 1, auto: false });

  check("an update() as a step's camera glides in: the camera still comes to the step's framing", cut && Math.abs(h.state.camera.zoom - 0.75) < 0.01, [cut, h.state.camera]);
  s2.stop();
  // the reader opens another view while a step's move is under way: the step leaves that view alone, and resume() shows it again
  await mount({ view: 'context' });
  const s3 = h.play('ride', { step: 1 }); await until(() => h.navigating === 'system', 2000);
  await h.setView('fleet'); await wait(600);

  s3.resume(); await until(() => h.view === 'system' && h.selection && h.selection.id === 'trips', 4000);
  check("a view the reader opens during a step's move: the step leaves it alone, paused; resume() shows the step again", left.join() === 'fleet,0,false,paused' && h.view === 'system' && s3.step === 1, [left, h.view, s3.step]);

  check("…and stops where its arrowhead begins (shorter than the line by the arrowhead)", eg && fl <= el - 8 && fl >= el - 20, [fl, el]);
  h.select({ type: 'node', id: 'trips', view: 'system' }); await wait(300);
  const hot = sr.querySelector('svg .edge-g.hot');

  if (h) { h.destroy(); h = null; }

  await hp.setView('system'); await wait(200);

  check('on the page, Back while a view zooms in takes the map where the link went: the map and the link agree', hp.view === back && back !== 'trips', [hp.view, location.hash, pe]);

</script>
