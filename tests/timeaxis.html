    check(`${tagX}: the lifeline, frame, operand and use are named`, pick('.node[data-id="api"]').getAttribute('aria-label') === 'Lifeline api : ShopApi'
      && pick('.node[data-id="shopper"]').getAttribute('aria-label') === 'Lifeline shopper : Shopper (actor)' && pick('.node[data-id="f1"]').getAttribute('aria-label') === 'Combined fragment alt'
      && pick('.node[data-id="f1-paid"]').getAttribute('aria-label') === 'Operand payment accepted' && pick('.node[data-id="f3"]').getAttribute('aria-label') === 'Interaction use Send receipt email',
      all('.node').map(g => g.getAttribute('aria-label')));
    h.destroy();
  }
  check('the three fonts measure differently, and a long head is cut at 320 px in each', new Set(Object.values(headW)).size === 3 && Object.values(widths).every(w => w <= 320.5 && w > 300), [headW, widths]);
} catch (x) { out.fail.push('threw: ' + (x && x.stack || x)); }
document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
