<!doctype html>
<!-- The standalone page at a phone's width (audit 61): the details panel's header keeps the selected card's name in view, and
     its buttons (Open, the light buttons, What if, Close) inside the screen, with no sideways scroll in the panel, at 375 and
     414 px (and 700, inside the phone rule), for a card that opens a view and one that does not; and at 1200 px the header stays one row. Each width is
     tests/fixtures/integration.html (the integration fixture's page) in a frame of that width, so the page's own media
     queries apply. tests/embed.py opens this in headless Chrome and reads <pre id="result">. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>umlimator phone width test</title>
<body style="margin:0">
<script type="module">
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function header(width, view, node) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${width}px;height:740px;border:0;display:block`;
  f.src = `fixtures/integration.html#view=${view}&node=${node}`;
  const loaded = new Promise(r => f.addEventListener('load', r, { once: true }));
  document.body.appendChild(f);
  await loaded;
  let ph = null;
  for (let i = 0; i < 600 && !ph; i++) { // up to 30 s: a loaded CI runner opens the integration page slowly
    await wait(50);
    const find = r => { for (const e of r.querySelectorAll('*')) { const p = e.matches('.panel:not([hidden]) .ph') ? e : e.shadowRoot && find(e.shadowRoot); if (p) return p; } return null; };
    ph = f.contentDocument && f.contentDocument.body && find(f.contentDocument);
  }
  await wait(100);
  if (!ph) { f.remove(); return null; }
  const vw = f.contentWindow.innerWidth, h2 = ph.querySelector('h2'), panel = ph.closest('.panel'), acts = [...ph.querySelectorAll('.acts button')];
  const r = {
    vw, title: h2.textContent, titleWidth: Math.round(h2.getBoundingClientRect().width), titleFits: h2.scrollWidth <= h2.clientWidth + 1,
    out: acts.filter(b => { const x = b.getBoundingClientRect(); return x.left < -1 || x.right > vw + 1; }).map(b => b.getAttribute('aria-label') || b.textContent.trim()),
    open: !!ph.querySelector('[data-open]'), close: !!ph.querySelector('[data-close]'),
    scroll: [panel.scrollWidth, panel.clientWidth], oneRow: (({ top, bottom }, x) => x.top < bottom && x.bottom > top)(h2.getBoundingClientRect(), ph.querySelector('[data-close]').getBoundingClientRect()),
  };
  f.remove();
  return r;
}
try {
  const cases = [375, 414, 700].flatMap(w => [['overview', 'api', true], ['overview', 'db', false], ['system', 'trips', true]].map(c => [w, ...c]));
  const got = await Promise.all(cases.map(([w, view, node]) => header(w, view, node))); // side by side: each frame is a whole page
  for (const [[w, view, node, opens], r] of cases.map((c, i) => [c, got[i]])) {
    check(`at ${w} px the details header of ${node} (${opens ? 'it opens a view' : 'no view to open'}) shows the card's name whole, every button inside the screen, and the panel does not scroll sideways (audit 61)`,
      !!r && r.close && r.open === opens && r.titleWidth > 0 && r.titleFits && !r.out.length && r.scroll[0] <= r.scroll[1], r);
  }
  const wide = await header(1200, 'overview', 'api');
  check('at 1200 px the details header stays one row: the name and the buttons side by side', !!wide && wide.open && wide.titleFits && !wide.out.length && wide.oneRow, wide);
} catch (err) {
  out.fail.push('threw: ' + (err && err.stack || err));
}
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
