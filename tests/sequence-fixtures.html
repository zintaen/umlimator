<!doctype html>
<!-- The sequence diagram's fixtures (3.8, notes/stage-3.md §9) in headless Chrome (tests/embed.py), from
     lib/umlimator-all.js: tests/sequence-minimal.json and both views of tests/sequence-stress.json (edge-cases, every T case;
     all, 20 lifelines, 200 messages and 10 nested fragments), each drawn by render() in both themes and three fonts: every
     piece drawn, no overlap of heads, labels, tags, guards and uses, every text in its face or backing, no label on a bar, no
     line through a head, every piece named, texts at 4.5:1 and lines at 3:1. tests/sequence-fixtures.test.mjs holds the same
     in Node, with P1's budget; tests/communication.html draws the communication fixtures. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator sequence fixtures test</title>
<body style="margin:0">
<div id="m" style="width:1180px;height:1000px"></div>
<script type="module">
import { render } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const el = document.getElementById('m');
let sr;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const bb = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b, k = 0) => a.x + k < b.x + b.w && b.x + k < a.x + a.w && a.y + k < b.y + b.h && b.y + k < a.y + a.h;
const inside = (a, b, k = .5) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const FIX = {};
for (const f of ['sequence-minimal', 'sequence-stress']) FIX[f] = await (await fetch(f + '.json')).json();
try {
  for (const [fx, MODEL] of Object.entries(FIX)) for (const v of MODEL.views) for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) {
    document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
    el.innerHTML = ''; const h = render(el, MODEL, { view: v.id }); sr = el.querySelector('.umlimator').shadowRoot;
    const tag = `${fx} ${v.id}, ${theme}, ${fname}`, stage = pick('.stage'), svg = pick('.stage svg'), bad = [];
    // text measured unhinted: a view fit into the page is drawn small, and Linux's hinting at that pixel size grows a text's
    // getBBox past its backing, a spill no reader at any zoom sees (as tests/package-object.html found)
    svg.style.textRendering = 'geometricPrecision';
    const heads = all('.node.lifeline'), body = g => bb(g.querySelector('.n-body'));
    heads.forEach(g => { const B = body(g); g.querySelectorAll('text').forEach(t => { if (!inside(bb(t), B, -1)) bad.push(`${g.dataset.id}: "${t.textContent}" out of its head`); }); });
    all('.e-lab').forEach(g => { if (!inside(bb(g.querySelector('text')), bb(g.querySelector('rect')))) bad.push(`label "${g.textContent}" out of its backing`); });
    all('.node.frame').forEach(g => { const t = g.querySelector('.f-tag + text'); if (!inside(bb(t), bb(g.querySelector('.f-tag')))) bad.push(`${g.dataset.id}: tag "${t.textContent}" out of its tag`); });
    all('.node.operand').forEach(g => { const t = g.querySelector('text'); if (t && !inside(bb(t), bb(g.querySelector('.f-guard')))) bad.push(`${g.dataset.id}: guard "${t.textContent}" out of its backing`); });
    all('.node.use').forEach(g => { const t = g.querySelector('.f-name + text'); if (!inside(bb(t), bb(g.querySelector('.f-name'))) || !inside(bb(t), bb(g.querySelector('.f-hit')))) bad.push(`${g.dataset.id}: its name out of its box`); });
    const solid = [...heads.map(g => [g.dataset.id, body(g)]), ...all('.e-lab rect').map(r => ['label ' + r.parentNode.textContent, bb(r)]),
      ...all('.f-tag').map(t => ['tag of ' + t.closest('.node').dataset.id, bb(t)]), ...all('.node.operand').filter(g => g.querySelector('text')).map(g => ['guard of ' + g.dataset.id, bb(g.querySelector('.f-guard'))]),
      ...all('.f-name').map(t => ['name of ' + t.closest('.node').dataset.id, bb(t)])];
    solid.forEach(([a, p], i) => solid.slice(i + 1).forEach(([b, q]) => { if (meets(p, q, .5)) bad.push(`${a} meets ${b}`); }));
    const bars = all('.seq-bar').map(bb);
    all('.e-lab rect').forEach(r => { if (bars.some(b => meets(bb(r), b, .5))) bad.push(`label "${r.parentNode.textContent}" on a bar`); });
    all('.edge-g path.edge').forEach(p => { const n = p.getAttribute('d').match(/-?\d+(\.\d+)?/g).map(Number), g = p.closest('.edge-g');
      for (let k = 2; k < n.length; k += 2) { const s = { x: Math.min(n[k - 2], n[k]), y: Math.min(n[k - 1], n[k + 1]), w: Math.abs(n[k] - n[k - 2]) || .01, h: Math.abs(n[k + 1] - n[k - 1]) || .01 };
        heads.forEach(hd => { const B = body(hd); if (meets(s, { x: B.x + 1, y: B.y + 1, w: B.w - 2, h: B.h - 2 })) bad.push(`line ${g.dataset.from}>${g.dataset.to} through ${hd.dataset.id}`); }); } });
    // every piece named (A1): heads, frames, operands and uses by aria-label, messages by their title
    all('.node').forEach(g => { if (!(g.getAttribute('aria-label') || '').trim()) bad.push(`${g.dataset.id} has no name`); });
    all('.edge-g').forEach(g => { if (!(g.querySelector(':scope > title') || {}).textContent) bad.push(`a message from ${g.dataset.from} has no name`); });
    const bg = rgba(getComputedStyle(stage).backgroundColor);
    all('.node.frame text, .node.operand text, .node.use text, .node.lifeline text, .e-lab text').forEach(t => { const r = ratio(rgba(getComputedStyle(t).fill), bg); if (r < 4.5) bad.push(`"${t.textContent}" at ${r}:1`); });
    all('.frame-box rect, .frame-box path, .seq-stem, .seq-bar, .edge-g path.edge').forEach(x => { const r = ratio(rgba(getComputedStyle(x).stroke), bg); if (r < 3) bad.push(`${x.getAttribute('class')} at ${r}:1`); });
    const frags = v.fragments || [], ops = frags.reduce((a, f) => a + f.members.length, 0), msgs = v.edges.filter(e => e.type === 'uml.Message').length, uses = v.edges.length - msgs;
    const counts = [heads.length, all('.seq-stem').length, all('.edge-g').length, all('.node.frame').length, all('.node.operand').length, all('.node.use').length];
    check(`${tag}: ${v.nodeIds.length} heads and stems, ${msgs} messages, ${frags.length} frames, ${ops} operands, ${uses} uses drawn; no overlap, every text in its face, no label on a bar, no line through a head, every piece named, contrast`,
      JSON.stringify(counts) === JSON.stringify([v.nodeIds.length, v.nodeIds.length, msgs, frags.length, ops, uses]) && !bad.length, [counts, bad.slice(0, 10)]);
    h.destroy();
  }
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
