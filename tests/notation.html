<!-- Notation (1.5): a classifier, every line end and end labels, drawn by svgOf from hand-built geometry (no diagram type
     registers a class view until 1.9), in both themes and three fonts. Text stays inside its face and its compartment,
     line ends meet the outlines, end labels keep to their boxes clear of the nodes and the line, hollow ends are the
     stage's background and filled ends the line's colour. And stage 4's open arrowheads (4.10, D1): every flow of the
     activity and interaction overview examples, every transition of the state machine example, and the use case example's
     includes and extends end in an open arrowhead whose tip is the line's end, on the outline of the shape it points to (a
     circle, a diamond, a bar, a rounded box, an ellipse, a state's frame), with its generalizations' triangles. And stage 5's
     line ends (5.8, notes/stage-5.md §9.4): on the component, deployment and composite structure examples and the stress
     fixtures' edge cases, each line kind ends as the table says (the socket, the delegation's open arrow, the
     manifestation's and the «deploy» line's, a realization's triangle or a ball's plain stem, the role binding's none),
     dashed where it says, an arrowhead's tip on the outline or the port it points to. And stage 6's (6.6, notes/stage-6.md
     §4.1, §11): on the profile example and the stress fixture's edge cases, an extension ends in a filled triangle the
     line's colour, solid; a profile application in an open arrowhead, dashed, labelled «apply»; a generalization's hollow
     triangle and a dependency's open arrow as the class type's; each tip on the outline it points to. tests/embed.py
     opens this in headless Chrome and reads <pre id="result">. -->
