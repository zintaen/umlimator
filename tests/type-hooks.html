<!-- A type's definition on the canvas (notes/spike-sequence.md §1, tests/embed.py): a relationship picker entry's `props`
     are copied onto the new line, a type's `edits.connect` gives the commands a new line emits, and a type's `layout.run`
     and `draw` layers reach the picture. The canvas hooks (3.4, notes/stage-3.md §5.1), with src/typed/edit.js loaded: on a
     stand-in sequence type with a palette, slots and geo.order, each of connect, moveTo, wrap, add and remove is called by
     pointer and by keyboard, with the slot the gesture names, and the edit event carries what it returns; { error } emits
     nothing and is said; a line to itself is drawn; a fragment shows its properties and members. Imports src/ to register
     test types. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator type hooks test</title>
<body style="margin:0">
<div id="m" style="width:1100px;height:680px"></div>
<script type="module">
import { render } from '../src/canvas/render.js';
import { registerDiagramType } from '../src/core/registry.js';
import { apply } from '../src/core/apply.js';
import '../src/uml/frame.js'; // SHAPE.lifeline and SHAPE.frame, the stand-in's heads and fragments
import '../src/typed/edit.js'; // TYPED.edit: the type's hooks on the canvas (3.4)
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
registerDiagramType('test.props', { elements: [{ type: 'test.Box', label: 'Box' }],
  lines: [{ type: 'test.Msg', label: 'Call', props: { sort: 'call' } }, { type: 'test.Msg', label: 'Reply', props: { sort: 'reply' } }] });
let asked = null;
registerDiagramType('test.hooks', { elements: [{ type: 'test.Box', label: 'Box' }], lines: [{ type: 'test.Msg', label: 'Call', props: { sort: 'call' } }],
  edits: { connect(model, view, from, to, at, line) { asked = { views: model.views.length, view: view.id, from, to, at, line: line.label };
    return [{ op: 'add', element: { id: 'msg1', type: line.type, from, to, props: { ...line.props } }, view: view.id, index: 0, in: 'view' }]; } },
  layout: { run(model, view) { const nodes = view.nodeIds.map((id, i) => ({ id, label: id.toUpperCase(), x: 40 + i * 200, y: 40, w: 120, h: 40, k: 'file' }));
    return { nodes, edges: [], groups: [], bounds: { x: 0, y: 0, w: 500, h: 300 }, byId: Object.fromEntries(nodes.map(n => [n.id, n])), map: false }; } },
  draw: () => ({ under: '<g class="t-under"><rect x="0" y="0" width="10" height="10"/></g>', over: '<g class="t-over"><text x="5" y="5">over</text></g>' }) });
const MODEL = { schemaVersion: 2, nodes: [{ id: 'a', type: 'test.Box', label: 'Alpha' }, { id: 'b', type: 'test.Box', label: 'Beta' }], edges: [],
  views: [{ id: 'p', diagram: 'test.props', nodeIds: ['a', 'b'], layout: { a: [0, 0], b: [1, 0] } }, { id: 'h', diagram: 'test.hooks', nodeIds: ['a', 'b'], edges: [] }] };
// 3.4's stand-in sequence: lifelines whose stems hold a 24 px hit strip (SHAPE.lifeline), messages one row each, a slot
// between every two rows and at each end, a fragment beside them (SHAPE.frame), geo.order, and every hook of §5.1
const calls = [], R0 = 160, RW = 70;
registerDiagramType('test.seq', { title: 'stand-in sequence', elements: [{ type: 'test.Use', label: 'Use' }, { type: 'test.Head', label: 'Lifeline' }],
  lines: [{ type: 'test.Msg', label: 'Call', props: { sort: 'call' } }, { type: 'test.Msg', label: 'Reply', props: { sort: 'reply' } }], wraps: ['alt', 'opt'],
  layout: { pins: false, run(model, view) {
    const rows = view.edges, heads = view.nodeIds.map((id, i) => { const x = 40 + i * 260;
      return { id, label: model.nodes.find(n => n.id === id).label, type: 'test.Head', shape: 'lifeline', k: 'file', x, y: 40, w: 140, h: 44, col: i, row: 0,
        stem: { x: x + 70, y1: 84, y2: R0 + rows.length * RW, gaps: rows.map((e, k) => ({ y1: R0 + k * RW - 12, y2: R0 + k * RW + (e.from === e.to ? 36 : 12) })) } }; });
    const frags = (view.fragments || []).map((f, k) => ({ id: f.id, label: f.label, type: f.type, shape: 'frame', k: 'file', x: 40 + heads.length * 260, y: R0 + k * 90, w: 120, h: 60, col: heads.length, row: 1 + k }));
    const byId = Object.fromEntries([...heads, ...frags].map(n => [n.id, n])), cx = id => byId[id].x + 70;
    const edges = rows.map((e, k) => { const y = R0 + k * RW, a = cx(e.from), b = cx(e.to);
      return { id: e.id, _id: e.id, type: e.type, from: e.from, to: e.to, s: byId[e.from], t: byId[e.to], pts: e.from === e.to ? [[a, y], [a + 40, y], [a + 40, y + 24], [a, y + 24]] : [[a, y], [b, y]], aria: `Message ${k + 1} of ${rows.length}: ${e.label}` }; });
    const slots = [...rows.keys(), rows.length].map(k => ({ index: k, y: R0 + k * RW - RW / 2, parent: null, after: k ? rows[k - 1].id : null }));
    return { nodes: [...heads, ...frags], edges, groups: [], byId, bounds: { x: 0, y: 0, w: 40 + (heads.length + 1) * 260, h: R0 + rows.length * RW + 40 }, map: false, slots,
      order: [...heads, ...frags, ...edges].map(x => x.id) }; } },
  edits: {
    connect(model, view, from, to, at, line) { calls.push(['connect', from, to, at && at.index, line.label]);
      return [{ op: 'add', element: { id: 'n1', type: line.type, from, to, props: { ...line.props } }, view: view.id, index: at.index, in: 'view' }]; },
    moveTo(model, view, id, at) { calls.push(['moveTo', id, at && (at.by || at.index)]);
      if (id === 'f1') return { error: 'A fragment moves with what it holds' };
      if (view.nodeIds.includes(id)) return null;
      const i = view.edges.findIndex(e => e.id === id), to = at.by ? i + at.by[1] : at.index > i ? at.index - 1 : at.index;
      return [{ op: 'move', id, view: view.id, index: to }]; },
    wrap(model, view, ids, kind) { calls.push(['wrap', ids, kind]); return [{ op: 'add', element: { id: 'f2', type: 'test.Frag', label: kind }, view: view.id }, ...ids.map(id => ({ op: 'reparent', id, parent: 'f2' }))]; },
    add(model, view, entry, label, at) { calls.push(['add', entry.type, label, at && at.index]); return entry.type === 'test.Head' ? null : [{ op: 'add', element: { id: 'u1', type: entry.type, label }, view: view.id, index: at.index, in: 'view' }]; },
    remove(model, view, ids, fromModel) { calls.push(['remove', ids, fromModel]); return ids.includes('a') && !fromModel ? { error: 'A lifeline goes with its messages: Shift + Delete' } : ids.map(id => ({ op: 'delete', id })); } } });
const SEQ = { schemaVersion: 2, nodes: [['a', 'Alpha'], ['b', 'Beta'], ['c', 'Gamma']].map(([id, label]) => ({ id, type: 'test.Head', label })), edges: [],
  views: [{ id: 's', diagram: 'test.seq', nodeIds: ['a', 'b', 'c'],
    edges: [{ id: 'm1', type: 'test.Msg', from: 'a', to: 'b', label: 'ask' }, { id: 'm2', type: 'test.Msg', from: 'b', to: 'c', label: 'pass' }, { id: 'm3', type: 'test.Msg', from: 'c', to: 'a', label: 'tell' }],
    fragments: [{ id: 'f1', type: 'test.Frag', label: 'loop', members: [{ id: 'f1-a', type: 'test.Op', label: 'each' }] }] }] };
const el = document.getElementById('m');
let sr, stage, ed = [], hh = null;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const key = (k, extra = {}, target = stage) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true, ...extra }));
const mount = (view, model = MODEL) => { el.innerHTML = ''; ed = []; const h = hh = render(el, model, { view, editable: true, on: { edit: e => ed.push(e) } }); sr = el.querySelector('.umlimator').shadowRoot; stage = pick('.stage'); return h; };
const last = () => ed[ed.length - 1], select = r => hh.select(r), ring = i => pick(`.line-key[data-i="${i}"]`);
const button = text => [...sr.querySelectorAll('.um-editor button')].find(b => b.textContent.trim() === text);
const ptr = (target, type, [x, y], extra = {}) => target.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, pointerId: 7, pointerType: 'mouse', bubbles: true, composed: true, ...extra }));
const mid = s => { const r = pick(s).getBoundingClientRect(); return [r.x + r.width / 2, r.y + r.height / 2]; };
const client = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(pick('svg').getScreenCTM()); return [p.x, p.y]; }; // a point of the picture, on the screen
const click = (g, extra = {}) => { const r = g.getBoundingClientRect(), at = [r.x + r.width / 2, r.y + r.height / 2]; ptr(g, 'pointerdown', at); ptr(g, 'pointerup', at); g.dispatchEvent(new MouseEvent('click', { clientX: at[0], clientY: at[1], bubbles: true, composed: true, ...extra })); };
const clickLine = (i, extra) => click(pick(`.edge-g[data-i="${i}"] .hitline`), extra);
const handleTo = (x, y) => { const c = pick('.um-handle circle'), to = client(x, y); ptr(c, 'pointerdown', mid('.um-handle circle')); ptr(stage, 'pointermove', to); ptr(stage, 'pointerup', to); };
const glide = (g, from, to) => { ptr(g, 'pointerdown', from); for (let i = 1; i <= 4; i++) ptr(stage, 'pointermove', [from[0] + (to[0] - from[0]) * i / 4, from[1] + (to[1] - from[1]) * i / 4]); ptr(stage, 'pointerup', to); };
const dragLine = (i, y) => { const s = `.edge-g[data-i="${i}"] .hitline`, from = mid(s), g = pick(s); glide(g, from, [from[0], client(0, y)[1]]); g.dispatchEvent(new MouseEvent('click', { clientX: from[0], clientY: client(0, y)[1], bubbles: true, composed: true })); };
const dragNode = (id, dx, dy) => { const g = pick(`.node[data-id="${id}"]`), r = g.querySelector('.n-body, .f-hit').getBoundingClientRect(), from = [r.x + r.width / 2, r.y + Math.min(r.height / 2, 20)], k = pick('svg').getScreenCTM().a;
  glide(g, from, [from[0] + dx * k, from[1] + dy * k]); };
const card = id => { const g = pick(`.node[data-id="${id}"]`), r = g.getBoundingClientRect(), at = { clientX: r.x + r.width / 2, clientY: r.y + r.height / 2, button: 0, pointerId: 7, pointerType: 'mouse', bubbles: true, composed: true };
  g.dispatchEvent(new PointerEvent('pointerdown', at)); g.dispatchEvent(new PointerEvent('pointerup', at)); g.dispatchEvent(new MouseEvent('click', at)); };
try {
  // ---- the picker copies an entry's props onto the new line
  let h = mount('p');
  card('a'); key('l'); key('b'); key('Enter');
  check('the picker offers both entries of one line type', same(all('.um-pick button').map(b => b.textContent), ['Call', 'Reply']));
  key('ArrowDown', {}, sr.activeElement); key('Enter', {}, sr.activeElement);
  const e = ed[ed.length - 1];
  check('the new line takes the entry\'s props', !!e && same(e.commands, [{ op: 'add', element: { id: 'msg1', type: 'test.Msg', from: 'a', to: 'b', props: { sort: 'reply' } }, view: 'p' }]), e);
  check('its commands apply', !!e && apply(MODEL, e.commands).edges[0].props.sort === 'reply');
  h.destroy();

  // ---- a type's layout.run and draw reach the picture; its edits.connect gives the new line's commands
  h = mount('h');
  check('the type\'s run lays the view out', pick('.node[data-id="b"]') && pick('.node[data-id="b"]').textContent.includes('B'));
  const svg = pick('svg').outerHTML;
  check('the type\'s layers: under before the lines, over after the nodes', svg.indexOf('t-under') < svg.indexOf('class="edges"') && svg.indexOf('class="nodes"') < svg.indexOf('t-over'), svg.slice(0, 400));
  card('a'); key('l'); key('b'); key('Enter');
  const c = ed[ed.length - 1];
  check('connect asks the type, with the model, the view, both ends, no slot (its geometry has none) and the picker\'s line', same(asked, { views: 2, view: 'h', from: 'a', to: 'b', at: null, line: 'Call' }), asked);
  check('and emits what it returns', !!c && same(c.commands, [{ op: 'add', element: { id: 'msg1', type: 'test.Msg', from: 'a', to: 'b', props: { sort: 'call' } }, view: 'h', index: 0, in: 'view' }]), c);
  check('which puts the line in the view, not the model', !!c && (m => !m.edges.length && m.views[1].edges[0].id === 'msg1')(apply(MODEL, c.commands)));
  h.destroy();

  // ---- 3.4: the stand-in sequence. Rows 70 px apart from y 160; a slot between each two, and one at each end
  h = mount('s', SEQ);
  check('3.4 geo.order: one key ring per id, in its order, after the cards; a line\'s named by its aria, a node\'s round it',
    same(all('.keys > .um-key').map(k => k.dataset.node ?? k.dataset.i), ['a', 'b', 'c', 'f1', '0', '1', '2']) && pick('.line-key[data-i="1"]').getAttribute('aria-label') === 'Message 2 of 3: pass'
    && pick('svg').innerHTML.indexOf('class="nodes"') < pick('svg').innerHTML.indexOf('class="keys"'), all('.keys > .um-key').map(k => k.outerHTML.slice(0, 90)));
  pick('.node-key[data-node="b"]').focus(); key('Enter', {}, sr.activeElement);
  check('Enter on a node\'s ring selects the node, and the ring says so', h.selection && h.selection.id === 'b' && pick('.node-key[data-node="b"]').getAttribute('aria-pressed') === 'true', h.selection);
  key('ArrowLeft', {}, sr.activeElement);
  check('an arrow from a node\'s ring goes to the nearest node\'s ring', sr.activeElement === pick('.node-key[data-node="a"]'), sr.activeElement && sr.activeElement.outerHTML.slice(0, 80));

  // connect, by pointer: the handle to another lifeline's stem, the slot nearest the release; to its own stem, a line to itself
  const n0 = () => ed.length;
  let n1 = n0(); calls.length = 0;
  card('a'); handleTo(370, 265); click(all('.um-pick button').find(b => b.textContent === 'Reply'));
  check('connect by pointer: the slot nearest the release (2)', same(calls, [['connect', 'a', 'b', 2, 'Reply']]), calls);
  check('…and its commands are the edit', ed.length === n1 + 1 && same(last().commands, [{ op: 'add', element: { id: 'n1', type: 'test.Msg', from: 'a', to: 'b', props: { sort: 'reply' } }, view: 's', index: 2, in: 'view' }]), last());
  check('…which apply() takes: the message in the view, at its slot', same(apply(SEQ, last().commands).views[0].edges.map(e => e.id), ['m1', 'm2', 'n1', 'm3']));
  calls.length = 0; card('b'); handleTo(370, 195); click(all('.um-pick button')[0]);
  check('a line to itself by pointer: the handle to its own stem', same(calls, [['connect', 'b', 'b', 1, 'Call']]) && last().commands[0].element.to === 'b', calls);
  // connect, by keyboard: L on a message starts at its receiver, and the new one goes in the slot after it
  calls.length = 0; clickLine(0); key('l');
  check('L on a message: a line from its receiver', h.state.gesture === 'connecting' && sr.querySelector('.um-live').textContent.startsWith('Line from Beta'), sr.querySelector('.um-live').textContent);
  key('g'); key('Enter'); key('Enter', {}, sr.activeElement);
  check('connect by keyboard: the slot after the message selected', same(calls, [['connect', 'b', 'c', 1, 'Call']]), calls);
  calls.length = 0; card('c'); key('l'); key('g'); key('a'); key('m'); key('Enter'); key('Enter', {}, sr.activeElement);
  check('a line to itself by keyboard: its own name typed; from a lifeline, the last slot', same(calls, [['connect', 'c', 'c', 3, 'Call']]), calls);

  // moveTo, by pointer: a message dragged to a slot; a lifeline dragged (null: the default, and no pin with pins false); a fragment
  calls.length = 0; n1 = n0();
  dragLine(2, 125);
  check('moveTo by pointer: a message dropped nearest slot 0', same(calls, [['moveTo', 'm3', 0]]) && ed.length === n1 + 1 && same(last().commands, [{ op: 'move', id: 'm3', view: 's', index: 0 }]), [calls, last()]);
  check('…which apply() takes', same(apply(SEQ, last().commands).views[0].edges.map(e => e.id), ['m3', 'm1', 'm2']));
  check('…and the click after the drag selects nothing', !h.selection || h.selection.type !== 'edge' || h.selection.ids[0] !== 'm3', h.selection);
  calls.length = 0; n1 = n0();
  dragNode('b', 260, 0);
  check('a lifeline dropped: moveTo asked; its null leaves the default, which pins nothing (layout.pins false)', calls.length === 1 && calls[0][1] === 'b' && ed.length === n1, [calls, ed.length - n1]);
  calls.length = 0; dragNode('f1', 0, 70);
  check('{ error }: no edit, and the error said', calls.length === 1 && ed.length === n1 && sr.querySelector('.um-live').textContent === 'A fragment moves with what it holds', sr.querySelector('.um-live').textContent);
  // by keyboard: Alt + arrows
  calls.length = 0; clickLine(1); key('ArrowUp', { altKey: true });
  check('moveTo by keyboard: Alt + ↑ on a message, { by: [0, -1] }', same(calls, [['moveTo', 'm2', [0, -1]]]) && same(last().commands, [{ op: 'move', id: 'm2', view: 's', index: 0 }]), [calls, last()]);
  calls.length = 0; n1 = n0(); card('a'); key('ArrowRight', { altKey: true });
  check('Alt + → on a lifeline whose moveTo gives null: no pin with pins false', same(calls, [['moveTo', 'a', [1, 0]]]) && ed.length === n1, calls);
  // Escape during a drag: nothing
  n1 = n0(); calls.length = 0; { const [x, y] = mid('.edge-g[data-i="0"] .hitline'); ptr(pick('.edge-g[data-i="0"] .hitline'), 'pointerdown', [x, y]); ptr(stage, 'pointermove', [x, y - 40]); key('Escape'); ptr(stage, 'pointerup', [x, y - 40]); }
  check('Escape during a message drag: no moveTo, no edit, no ghost', ed.length === n1 && !calls.length && !pick('.um-ghost'));

  // wrap: Shift + click two messages, W, the picker; by keyboard, Enter and Shift + Enter on their rings
  calls.length = 0; clickLine(0); clickLine(1, { shiftKey: true });
  check('Shift + click: two messages selected', same(h.selected.map(r => r.ids[0]), ['m1', 'm2']), h.selected);
  key('w');
  check('W: a picker of the type\'s wraps, named', same(all('.um-pick button').map(b => b.textContent), ['alt', 'opt']) && pick('.um-pick').getAttribute('aria-label') === 'Wrap in');
  click(all('.um-pick button')[1]);
  check('wrap by pointer: the ids selected and the kind picked', same(calls, [['wrap', ['m1', 'm2'], 'opt']]) && last().commands.length === 3, calls);
  calls.length = 0; select(null);
  ring(0).focus(); key('Enter', {}, ring(0)); ring(2).focus(); key('Enter', { shiftKey: true }, ring(2)); key('W', {}, ring(2)); key('Enter', {}, sr.activeElement);
  check('wrap by keyboard: Enter, Shift + Enter on another ring, W, Enter', same(calls, [['wrap', ['m1', 'm3'], 'alt']]), calls);

  // add: N with a message selected, at the slot after it; the palette, whose null leaves the default add
  calls.length = 0; clickLine(1); key('n'); pick('.um-rename').value = 'Audit'; key('Enter', {}, pick('.um-rename'));
  check('add by keyboard: N, a name, the slot after the message', same(calls, [['add', 'test.Use', 'Audit', 2]]) && same(last().commands, [{ op: 'add', element: { id: 'u1', type: 'test.Use', label: 'Audit' }, view: 's', index: 2, in: 'view' }]), [calls, last()]);
  calls.length = 0; select(null); button('Lifeline').click(); pick('.um-rename').value = 'Delta'; key('Enter', {}, pick('.um-rename'));
  check('add by pointer: the palette; null: the default add', same(calls, [['add', 'test.Head', 'Delta', 3]]) && same(last().commands, [{ op: 'add', element: { id: 'head1', type: 'test.Head', label: 'Delta' }, view: 's' }]), [calls, last()]);

  // remove: Delete, Shift + Delete, the panel's buttons and the outline's ✕
  calls.length = 0; clickLine(0); key('Delete');
  check('remove by keyboard: Delete', same(calls, [['remove', ['m1'], false]]) && same(last().commands, [{ op: 'delete', id: 'm1' }]), calls);
  calls.length = 0; n1 = n0(); card('a'); key('Delete');
  check('remove\'s { error }: no edit, said', same(calls, [['remove', ['a'], false]]) && ed.length === n1 && sr.querySelector('.um-live').textContent.startsWith('A lifeline goes'), calls);
  key('Delete', { shiftKey: true });

  calls.length = 0; clickLine(2); button('Remove from view').click();
  check('remove by pointer: the panel\'s Remove from view', same(calls, [['remove', ['m3'], false]]), calls);
  calls.length = 0; pick('.um-editor [data-del="b"]').click();

  // a fragment is an element: selected, its properties and its members (operands)
  card('f1');

  f('new').value = 'else'; key('Enter', {}, f('new'));
  check('…and a member added to it', same(last().commands, [{ op: 'add', element: { id: 'op1', type: 'test.Op', label: 'else' }, owner: 'f1' }]), last());
  h.destroy();

const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
