     stand-in sequence type with a palette, slots and geo.order, each of connect, moveTo, wrap, add and remove is called by
     pointer and by keyboard, with the slot the gesture names, and the edit event carries what it returns; { error } emits
     nothing and is said; a line to itself is drawn; a fragment shows its properties and members. 4.1's typed engine
     (notes/stage-4.md §4.2, §6.3, §12.1), on a stand-in type with an ellipse, a diamond, a bar, a 20 px circle and a state

     line calls edits.rename by key and by a double-click; F2 on a diamond opens a field 120 px wide at least; a region box

     geo. 5.2 (notes/stage-5.md §12.1, §6), on a stand-in type: edits.member on the panel's member rows by Enter and by a
