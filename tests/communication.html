<!doctype html>
<!-- The communication diagram (3.5, notes/stage-3.md §6) in headless Chrome (tests/embed.py), from lib/umlimator-all.js:
     examples/checkout-communication.json and the fixtures tests/communication-*.json (§9: the minimal view; the edge cases, two messages
     each way on one link, a self-message on a self connector, six messages on one link, a lifeline with no connector, every
     sort; 20 lifelines, 30 connectors and 200 messages) drawn by render() in both themes and three fonts: no overlap, every
     text in its face, no connector through another element, line ends on the lifelines, names, the reading order of the
     picture, the legend and contrast; then the gestures, by pointer and by keyboard, through the type's hooks as 3.4 calls them
     (src/typed/edit.js), each through the edit event and apply(): Tab's key rings in geo.order, the refused connect's reason
     on the hint line, N and the palette at an index, Delete and Shift + Delete of a connector taking its messages.
     tests/communication.test.mjs lays the same fixtures out in Node. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator communication diagram test</title>
<body style="margin:0">
<div id="m" style="width:1400px;height:900px"></div>
<script type="module">
import { render, apply, validate, describe } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const el = document.getElementById('m');
let sr, stage, ed = [], sel = [];
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const ptr = (target, type, [x, y]) => target.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, pointerId: 7, pointerType: 'mouse', bubbles: true, composed: true }));
const key = (k, extra = {}, target = stage) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true, ...extra }));
const client = (x, y) => { const p = new DOMPoint(x, y).matrixTransform(pick('svg').getScreenCTM()); return [p.x, p.y]; }; // a point of the picture, on the screen
const handleTo = (x, y) => { const c = pick('.um-handle circle'), r = c.getBoundingClientRect(), to = client(x, y); ptr(c, 'pointerdown', [r.x + r.width / 2, r.y + r.height / 2]); ptr(stage, 'pointermove', to); ptr(stage, 'pointerup', to); };
const click = s => { const g = pick(s), r = g.getBoundingClientRect(), at = [r.x + r.width / 2, r.y + r.height / 2]; ptr(g, 'pointerdown', at); ptr(g, 'pointerup', at); g.dispatchEvent(new MouseEvent('click', { clientX: at[0], clientY: at[1], bubbles: true, composed: true })); };
const mount = (model, opts = {}) => { el.innerHTML = ''; ed = []; sel = []; const h = render(el, model, { on: { edit: e => ed.push(e), select: e => sel.push(e) }, ...opts }); sr = el.querySelector('.umlimator').shadowRoot; stage = pick('.stage'); return h; };
const errors = m => validate(m).filter(p => p.level === 'error');
const bb = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b, k = 0) => a.x + k < b.x + b.w && b.x + k < a.x + a.w && a.y + k < b.y + b.h && b.y + k < a.y + a.h;
const inside = (a, b, k = .5) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const ptsOf = d => { const n = d.match(/-?\d+(\.\d+)?/g).map(Number), p = []; for (let i = 0; i < n.length; i += 2) p.push([n[i], n[i + 1]]); return p; };
const segs = p => p.slice(1).map((q, k) => ({ x: Math.min(p[k][0], q[0]), y: Math.min(p[k][1], q[1]), w: Math.abs(q[0] - p[k][0]) || .01, h: Math.abs(q[1] - p[k][1]) || .01 }));
const num = g => /, ([\d.]+):/.exec(g.getAttribute('aria-label'))[1].split('.').map(Number);
const byNum = (a, b) => { const p = num(a), q = num(b); for (let i = 0; i < Math.max(p.length, q.length); i++) { const d = (p[i] ?? -1) - (q[i] ?? -1); if (d) return d; } return 0; };
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
// contrast (DoD 8), as tests/contrast.html measures it: a computed colour as [r, g, b, a], blended over what is under it
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (x, k) => rgba(getComputedStyle(x)[k]);
const EX = await (await fetch('../examples/checkout-communication.json')).json();
const FIX = Object.fromEntries(await Promise.all(['minimal', 'stress'].map(async k => [k, await (await fetch(`communication-${k}.json`)).json()])));
const CASES = [['example 12', EX, 'checkout'], ['minimal', FIX.minimal, 'v'], ['edge cases', FIX.stress, 'edge-cases'], ['200 messages', FIX.stress, 'all']];
try {
  const widths = {};
  for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) for (const [name, M, vid] of CASES) {
    document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
    const tag = `${name}, ${theme}, ${fname}`, h = mount(M, { view: vid, legend: true }), svg = pick('.stage svg'), v = M.views.find(x => x.id === vid), bad = [];
    const E = new Map(M.edges.map(e => [e.id, e])), listed = v.edges.map(id => E.get(id)), cons = listed.filter(e => e.type === 'uml.Connector'), msgs = listed.filter(e => e.type === 'uml.Message');
    const heads = all('.node.lifeline'), rows = all('.node.message-row'), lines = all('.edge-g');
    const B = new Map([...heads.map(g => [g.dataset.id, bb(g.querySelector('.n-body'))]), ...rows.map(g => [g.dataset.id, bb(g.querySelector('.mr-back'))])]);
    if (name === 'example 12') widths[fname] = B.get('m6').w;
    const ids = [...B.keys()];
    ids.forEach((a, i) => ids.slice(i + 1).forEach(b => { if (meets(B.get(a), B.get(b), .5)) bad.push(`${a} and ${b} overlap`); }));
    heads.forEach(g => g.querySelectorAll('text').forEach(t => { if (!inside(bb(t), B.get(g.dataset.id), -1)) bad.push(`${g.dataset.id}: "${t.textContent}" out of its head`); }));
    rows.forEach(g => { const R = B.get(g.dataset.id); [g.querySelector('text'), g.querySelector('.mr-arrow')].forEach(t => { if (!inside(bb(t), R)) bad.push(`${g.dataset.id}: "${t.textContent}" out of its row`); }); });
    // a connector runs into its own stack of rows; never through another lifeline or another connector's rows. Its ends lie
    // on its lifelines' outlines
    const pair = (a, b) => [a, b].sort().join(' '), rides = new Map(cons.map(c => [c.id, new Set(msgs.filter(m => pair(m.from, m.to) === pair(c.from, c.to)).map(m => m.id))]));
    lines.forEach(g => { const c = cons.find(x => x.from === g.dataset.from && x.to === g.dataset.to), p = ptsOf(g.querySelector('path.edge').getAttribute('d'));
      if (!c) { bad.push(`a line ${g.dataset.from}>${g.dataset.to} that is no connector`); return; }
      segs(p).forEach(s => B.forEach((b, id) => { if (id !== c.from && id !== c.to && !rides.get(c.id).has(id) && meets(s, { x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 })) bad.push(`${c.id} runs through ${id}`); }));
      [[p[0], c.from], [p[p.length - 1], c.to]].forEach(([q, id]) => { const body = pick(`.node[data-id="${id}"] .n-body`); body.style.strokeWidth = '3px';
        const o = svg.createSVGPoint(); [o.x, o.y] = q; if (!body.isPointInStroke(o) && !(c.from === c.to)) bad.push(`${c.id} ends off ${id}`); body.style.strokeWidth = ''; }); });
    check(`${tag}: ${heads.length} lifelines, ${rows.length} message rows and ${lines.length} connectors drawn; no overlap, every text in its face, no connector through another element, every end on its lifeline`,
      heads.length === v.nodeIds.length && rows.length === msgs.length && lines.length === cons.length && !bad.length, bad.slice(0, 12));
    // the picture in reading order (S13): the lifelines left to right, then the messages by number
    const nodes = all('.node'), xs = heads.map(g => B.get(g.dataset.id)), sorted = rows.slice().sort(byNum);
    check(`${tag}: the picture reads in order, the lifelines left to right, then the messages by number`, same(nodes.map(g => g.dataset.id), [...heads, ...rows].map(g => g.dataset.id))
      && xs.every((b, i) => !i || b.x > xs[i - 1].x || (b.x === xs[i - 1].x && b.y > xs[i - 1].y)) && same(rows.map(g => g.dataset.id), sorted.map(g => g.dataset.id)), nodes.map(g => g.dataset.id).slice(0, 30));
    // contrast: texts 4.5:1 on what is under them, lines and arrows 3:1 on the stage
    const stageBg = css(pick('.stage'), 'backgroundColor'), low = [];
    heads.forEach(g => { const bg = blend(css(g.querySelector('.n-body'), 'fill'), blend(css(g.querySelector('.n-mask'), 'fill') || [0, 0, 0, 0], stageBg));
      g.querySelectorAll('text').forEach(x => { const r = ratio(css(x, 'fill'), bg); if (r < 4.5) low.push([g.dataset.id, x.textContent, r]); }); });
    rows.forEach(g => { const bg = blend(css(g.querySelector('.mr-back'), 'fill'), stageBg), r = ratio(css(g.querySelector('text'), 'fill'), bg), a = ratio(css(g.querySelector('.mr-arrow'), 'stroke'), bg);
      if (r < 4.5) low.push([g.dataset.id, 'text', r]); if (a < 3) low.push([g.dataset.id, 'arrow', a]); });
    lines.forEach(g => { const r = ratio(css(g.querySelector('path.edge'), 'stroke'), stageBg); if (r < 3) low.push(['line', g.dataset.from, r]); });
    const lgBg = blend(css(pick('.m-legend'), 'backgroundColor'), stageBg);
    all('.m-legend b, .m-legend .lgi > span').forEach(x => { const r = ratio(css(x, 'color'), lgBg); if (r < 4.5) low.push(['legend', x.textContent, r]); });
    check(`${tag}: contrast: texts 4.5:1, connectors and arrows 3:1`, !low.length, low.slice(0, 8));
    if (name === 'example 12') {
      const T = id => pick(`.node[data-id="${id}"] text`).textContent, aria = id => pick(`.node[data-id="${id}"]`).getAttribute('aria-label');
      check(`${tag}: the rows carry notes/stage-3.md §6.3's numbers`, same(['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9'].map(T), ['1: checkout()', '1.1: place(order)', '1.1.1: validate(order)', '1.1.2: charge(total)',
        '1.1.2.1: paid', '1.1.3: «create» new(order)', '1.1.4: orderPlaced', '1.1.5: result', '1.2: confirmation page']), rows.map(g => g.textContent));
      check(`${tag}: lifelines, messages and connectors have names a screen reader reads`, aria('api') === 'Lifeline api : ShopApi' && aria('shopper') === 'Lifeline shopper : Shopper (actor)'
        && aria('m4') === 'Message 4 of 9, 1.1.2: api to payments, charge(total), call' && aria('m5') === 'Message 5 of 9, 1.1.2.1: payments to api, paid, reply to 1.1.2'
        && pick('.edge-g[data-from="api"][data-to="payments"] title').textContent === 'Connector between api and payments, 2 messages'
        && pick('.edge-g[data-from="api"][data-to="api"] title').textContent === 'Connector from api to itself, 1 message', [aria('m4'), aria('m5')]);
      const turn = id => /rotate\((\d+)/.exec(pick(`.node[data-id="${id}"] .mr-arrow`).getAttribute('transform'))[1];
      check(`${tag}: each row's arrow points toward its receiver, a reply's dashed`, turn('m1') === '0' && turn('m9') === '180' && turn('m2') === '0' && turn('m8') === '180'
        && !!pick('.node[data-id="m5"] .mr-arrow path[stroke-dasharray]') && !pick('.node[data-id="m4"] .mr-arrow path[stroke-dasharray]'), ['m1', 'm9', 'm2', 'm8'].map(turn));
      const legend = all('.m-legend b').map(b => b.textContent);
      check(`${tag}: the legend keys the connector and the sorts the view draws`, same(legend, ['Connector', 'Call', 'Async', 'Reply', 'Create']), legend);
    }
    h.destroy();
  }
  check('the three fonts measure differently', new Set(Object.values(widths)).size === 3, widths);
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
  check('describe() writes the view in words', describe(EX, 'checkout').startsWith('Checkout: payment accepted: a communication diagram of 5 lifelines, 5 connectors and 9 messages.'));

  // ---- the gestures, through the type's hooks (3.4), each through the edit event and apply()
  let model = EX, h = mount(model, { view: 'checkout', editable: true });
  const ring = id => pick(`.node-key[data-node="${id}"]`), lineRing = name => all('.line-key').find(k => k.getAttribute('aria-label') === name);
  const hint = () => pick('.um-live').textContent;
  // Tab goes through the key rings, in geo.order: the lifelines left to right, the connectors, then the rows by number; the
  // cards themselves are out of the tab order
  { const keys = all('.keys > .um-key'), heads = all('.node.lifeline').map(g => g.dataset.id), rows = all('.node.message-row').map(g => g.dataset.id);
    check('Tab follows geo.order: a ring for each lifeline left to right, each connector, then each row by number; no card is a tab stop',
      same(keys.map(k => k.dataset.node ?? 'line'), [...heads, ...Array(5).fill('line'), ...rows]) && keys.every(k => k.tabIndex === 0)
      && all('.node').every(g => g.tabIndex === -1) && ring('m4').getAttribute('aria-label') === 'Message 4 of 9, 1.1.2: api to payments, charge(total), call'
      && !!lineRing('Connector between api and payments, 2 messages'), keys.map(k => k.dataset.node ?? k.getAttribute('aria-label'))); }
  const step = (what, want, then = () => true) => { const e = ed[ed.length - 1], next = e && apply(model, e.commands); if (next) h.update(next);
    check(what, ed.length === 1 && same(e.commands, want) && !errors(next).length && then(next), [ed.map(x => x.commands), next && errors(next)]); if (next) model = next; ed = []; };
  click('.node[data-id="m7"] .mr-back');
  check('a click on a message row selects the message', same(sel.at(-1).target, { type: 'node', id: 'm7', view: 'checkout' }), sel.at(-1));
  const f = k => pick(`.um-editor [data-f="p:${k}"]`);
  check('its properties are the message\'s: sort and reply to', f('sort') && f('sort').value === 'async' && !!f('replyTo'));
  f('sort').value = 'call'; f('sort').dispatchEvent(new Event('change', { bubbles: true }));
  step('the sort, set in the properties panel', [{ op: 'set', id: 'm7', path: 'props.sort', value: 'call' }], () => pick('.node[data-id="m7"]').dataset.sort === 'call');
  click('.node[data-id="m9"] .mr-back'); key('F2'); pick('.um-rename').value = 'confirmation'; key('Enter', {}, pick('.um-rename'));
  step('F2 renames a message', [{ op: 'set', id: 'm9', path: 'label', value: 'confirmation' }], () => pick('.node[data-id="m9"] text').textContent === '1.2: confirmation');
  // L from a lifeline, a name typed, Enter: the picker offers a connector and each sort; the type's connect hook writes the message
  click('.node[data-id="shopper"] .c-name'); key('l'); key('s'); key('t'); key('Enter');
  const items = all('.um-pick button').map(b => b.textContent);
  check('L, a name and Enter open the picker: a connector and the five sorts', same(items, ['Connector', 'Call', 'Async', 'Reply', 'Create', 'Delete']), items);
  all('.um-pick button')[1].click();
  step('picking Call adds a message after the last, on the connector there is', [{ op: 'add', element: { id: 'm10', type: 'uml.Message', from: 'shopper', to: 'storefront', props: { sort: 'call' } }, view: 'checkout', index: 14 }],
    () => pick('.node[data-id="m10"] text').textContent === '2' && pick('.node[data-id="m10"]').getAttribute('aria-label') === 'Message 10 of 10, 2: shopper to storefront, call' && all('.node.message-row').length === 10);
  click('.node[data-id="storefront"] .c-name'); key('l'); key('p'); key('Enter'); all('.um-pick button')[1].click();
  step('a call between lifelines no connector joins adds the connector in the same transaction', [{ op: 'add', element: { id: 'm11', type: 'uml.Message', from: 'storefront', to: 'payments', props: { sort: 'call' } }, view: 'checkout', index: 15 },
    { op: 'add', element: { id: 'storefront-payments', type: 'uml.Connector', from: 'storefront', to: 'payments' }, view: 'checkout', index: 5 }], () => all('.edge-g').length === 6 && !!pick('.node[data-id="m11"]'));
  click('.node[data-id="payments"] .c-name'); key('l'); key('s'); key('t'); key('Enter'); all('.um-pick button')[3].click();
  step('a reply answers the latest unanswered call from its receiver to its sender', [{ op: 'add', element: { id: 'm12', type: 'uml.Message', from: 'payments', to: 'storefront', props: { sort: 'reply', replyTo: 'm11' } }, view: 'checkout', index: 17 }]);
  click('.node[data-id="storefront"] .c-name'); key('l'); key('a'); key('Enter'); all('.um-pick button')[0].click();
  // the hook returns { error }, which 3.4 says on the hint line (src/typed/edit.js ran)
  check('a second connector between two lifelines is refused by keyboard: no event, and the reason said', ed.length === 0 && hint() === 'storefront and api are linked already', [ed, hint()]);
  { const a = pick('.node[data-id="api"] .n-body').getBBox(); click('.node[data-id="storefront"] .c-name'); handleTo(a.x + a.width / 2, a.y + a.height / 2); click('.um-pick button'); } // the picker's first entry, Connector
  check('…and by pointer, from the handle to the other lifeline', ed.length === 0 && hint() === 'storefront and api are linked already', [ed, hint()]);
  click('.node[data-id="receipt"] .c-name'); key('ArrowDown', { altKey: true });
  const pin = ed[0] && ed[0].commands[0];
  step('Alt + ↓ pins a lifeline a row down', pin ? [pin] : null, m => m.views[0].layout.receipt[1] === pin.value[1] && pin.path[1] === 'receipt');
  const B2 = all('.node').map(g => [g.dataset.id, bb(g.querySelector('.n-body, .mr-back'))]), over = [];
  B2.forEach(([a, p], i) => B2.slice(i + 1).forEach(([b, q]) => { if (meets(p, q, .5)) over.push(a + '/' + b); }));
  check('after the pin, nothing overlaps', !over.length, over);
  click('.node[data-id="m12"] .mr-back'); key('Delete');
  step('Delete hides a message from the view', [{ op: 'hide', id: 'm12', view: 'checkout' }], () => !pick('.node[data-id="m12"]'));
  click('.node[data-id="m2"] .mr-back'); key('Delete', { shiftKey: true });
  step('Shift + Delete deletes a call, and its reply with it', [{ op: 'delete', id: 'm2' }], m => !m.edges.some(e => e.id === 'm8') && !pick('.node[data-id="m8"]'));
  // N and the palette go through the type's add hook (3.4): the id from the name, after the selected lifeline (its slot),
  // else last. Before 3.4 the canvas's default added it, as "lifeline1"
  key('n'); pick('.um-rename').value = 'audit'; key('Enter', {}, pick('.um-rename'));
  step('N with no lifeline selected adds a lifeline last', [{ op: 'add', element: { id: 'audit', type: 'uml.Lifeline', label: 'audit' }, view: 'checkout' }], m => !!pick('.node.lifeline[data-id="audit"]') && m.views[0].nodeIds.at(-1) === 'audit');
  let at = model.views[0].nodeIds.indexOf('storefront') + 1;
  ring('storefront').focus(); key('Enter', {}, sr.activeElement); key('n'); pick('.um-rename').value = 'cache'; key('Enter', {}, pick('.um-rename'));
  step('N on a lifeline selected from its ring adds the new one after it', [{ op: 'add', element: { id: 'cache', type: 'uml.Lifeline', label: 'cache' }, view: 'checkout', index: at }], m => m.views[0].nodeIds[at] === 'cache');
  at = model.views[0].nodeIds.indexOf('api') + 1;
  click('.node[data-id="api"] .c-name'); pick('.um-pal [data-add="0"]').click(); pick('.um-rename').value = 'log'; key('Enter', {}, pick('.um-rename'));
  step('the palette, by pointer, adds a lifeline after the one clicked', [{ op: 'add', element: { id: 'log', type: 'uml.Lifeline', label: 'log' }, view: 'checkout', index: at }], m => m.views[0].nodeIds[at] === 'log');
  // a connector goes with the messages it carries: Delete hides them from the view, Shift + Delete deletes them
  click('.edge-g[data-from="api"][data-to="payments"] .hitline'); pick('.um-editor [data-hide]').click();
  step('a connector clicked, then Remove from view: it and its messages leave the view', [{ op: 'hide', id: 'api-payments', view: 'checkout' }, { op: 'hide', id: 'm4', view: 'checkout' }, { op: 'hide', id: 'm5', view: 'checkout' }],
    m => m.edges.some(e => e.id === 'm4') && !pick('.edge-g[data-from="api"][data-to="payments"]') && !pick('.node[data-id="m4"]') && !pick('.node[data-id="m5"]'));
  lineRing('Connector between storefront and payments, 1 message').focus(); key('Enter', {}, sr.activeElement); key('Delete', { shiftKey: true }, sr.activeElement);
  step('a connector\'s ring, Enter, Shift + Delete: it and its message are deleted from the model', [{ op: 'delete', id: 'storefront-payments' }, { op: 'delete', id: 'm11' }],
    m => !m.edges.some(e => ['storefront-payments', 'm11', 'm12'].includes(e.id)) && !pick('.node[data-id="m11"]'));
  // the keyboard reaches the messages: arrows go from a lifeline's ring to the ring of the nearest node, here a row. Before
  // 3.4 the focus went to the row's card; 3.4 gives a typed view key rings (svg.js) and the arrows move the focus from ring to ring
  const head = ring('shopper'); head.focus(); key('ArrowRight', {}, head);
  const to = sr.activeElement, toG = to && to.dataset.node && pick(`.node[data-id="${to.dataset.node}"]`);
  check('→ from a lifeline\'s ring moves focus to the ring of the nearest node to its right, a message row, named', !!toG && to.classList.contains('node-key') && toG.dataset.shape === 'message-row'
    && to.getAttribute('aria-label') === toG.getAttribute('aria-label') && /^Message \d+ of \d+, [\d.]+: \w+ to \w+/.test(to.getAttribute('aria-label')), to && to.outerHTML.slice(0, 120));
  h.destroy();
} catch (x) { out.fail.push('threw: ' + (x && x.stack || x)); }
document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
