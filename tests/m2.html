<!doctype html>
<!-- Milestone 2's fixtures (M2.14, notes/milestone-2.md §10) in headless Chrome (tests/embed.py), from lib/umlimator-all.js:
     every view of tests/er-*.json, flowchart-*.json, dfd-*.json, information-flow-*.json and c4-*.json drawn by render() in
     both directions, both themes and three fonts: every node and line drawn, no two nodes overlapping, every text inside
     its node, every node inside its box, no line through a node but its own two ends, every line end within 1 px of its
     node's box, no line label over a node (these three not on c4-stress.json's all, whose crowding
     tests/m2-fixtures.test.mjs pins), every node and line named, texts at 4.5:1 and lines and outlines at 3:1. Then the Bookshop atlas (M2.13): each link of
     tools/atlas-links.json, selected in a view that draws it as a card and opened by Enter, opens its view in the page. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator milestone 2 fixtures test</title>
<body style="margin:0">
<div id="m" style="width:1200px;height:900px"></div>
<script type="module">
import { render, layout } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const el = document.getElementById('m');
let sr;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const bb = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b, k = 0) => a.x + k < b.x + b.w && b.x + k < a.x + a.w && a.y + k < b.y + b.h && b.y + k < a.y + a.h;
const inside = (a, b, k = 1) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const ptsOf = d => { const n = d.match(/-?\d+(\.\d+)?/g).map(Number), p = []; for (let i = 0; i < n.length; i += 2) p.push([n[i], n[i + 1]]); return p; };
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (x, k) => rgba(getComputedStyle(x)[k]);
const FIX = {};
for (const t of ['er', 'flowchart', 'dfd', 'information-flow', 'c4']) for (const k of ['minimal', 'stress']) FIX[`${t}-${k}`] = await (await fetch(`${t}-${k}.json`)).json();

function drawn(g, bad, strict) {
  const nodes = all('.stage svg .node[data-id]'), B = new Map(nodes.map(n => [n.dataset.id, bb(n.querySelector('.n-mask') || n)]));
  const missing = g.nodes.filter(n => !B.has(n.id)).map(n => n.id); if (missing.length) bad.push(`not drawn: ${missing.join(', ')}`);
  const list = [...B]; list.forEach(([a, p], i) => list.slice(i + 1).forEach(([b, q]) => { if (meets(p, q, .5)) bad.push(`${a} and ${b} overlap`); }));
  nodes.forEach(n => n.querySelectorAll('text').forEach(t => { if (t.textContent.trim() && !inside(bb(t), B.get(n.dataset.id))) bad.push(`${n.dataset.id}: "${t.textContent}" out of its shape`); }));
  (g.families || []).forEach(f => { const box = pick(`.family[data-family="${CSS.escape(f.id)}"] .family-box`); if (!box) return bad.push(`box ${f.id} not drawn`);
    g.nodes.filter(n => n.parent === f.id || (g.byId[n.id] && g.byId[n.id].family === f.id)).forEach(n => { if (B.has(n.id) && !inside(B.get(n.id), bb(box))) bad.push(`${n.id} outside ${f.id}`); }); });
  if (strict) all('.edge-g').forEach(e => { const from = e.dataset.from, to = e.dataset.to, p = ptsOf(e.querySelector('path.edge').getAttribute('d'));
    [[from, p[0]], [to, p.at(-1)]].forEach(([id, [x, y]]) => { const b = B.get(id), o = b && Math.max(b.x - x, x - b.x - b.w, b.y - y, y - b.y - b.h, 0); if (o > 1) bad.push(`${from}>${to} ends ${o.toFixed(1)} px off ${id}`); });
    p.slice(1).forEach((q, k) => { const s = { x: Math.min(p[k][0], q[0]), y: Math.min(p[k][1], q[1]), w: Math.abs(q[0] - p[k][0]) || .01, h: Math.abs(q[1] - p[k][1]) || .01 };
      B.forEach((b, id) => { if (id !== from && id !== to && meets(s, { x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 })) bad.push(`${from}>${to} runs through ${id}`); }); }); });
  if (strict) all('.labels .e-lab .e-lbg').forEach(r => { const l = bb(r); B.forEach((b, id) => { if (meets(l, b)) bad.push(`label ${r.parentNode.dataset.i} is over ${id}`); }); });
  return nodes;
}
try {
  for (const [fx, MODEL] of Object.entries(FIX)) for (const v of MODEL.views) for (const d of ['right', 'down'])
    for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) {
      document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
      const M = { ...MODEL, views: MODEL.views.map(w => (w.id === v.id ? { ...w, direction: d } : w)) }, g = layout(M, v.id);
      el.innerHTML = ''; const h = render(el, M, { view: v.id }); sr = el.querySelector('.umlimator').shadowRoot;
      const tag = `${fx} ${v.id}, ${d}, ${theme}, ${fname}`, svg = pick('.stage svg'), bad = [];
      svg.style.textRendering = 'geometricPrecision'; // measured unhinted, as tests/stage5.html does
      const strict = !(fx === 'c4-stress' && v.id === 'all'), nodes = drawn(g, bad, strict), lines = all('.edge-g');
      nodes.forEach(n => { if (!(n.getAttribute('aria-label') || '').trim()) bad.push(`${n.dataset.id} has no name`); });
      lines.forEach(e => { if (!(e.querySelector(':scope > title') || {}).textContent) bad.push(`a line from ${e.dataset.from} has no name`); });
      const stageBg = css(pick('.stage'), 'backgroundColor'), low = [];
      nodes.forEach(n => { const body = n.querySelector(':scope > .n-body'), fill = body && css(body, 'fill'), bg = fill && fill[3] ? blend(fill, stageBg) : stageBg;
        n.querySelectorAll('text').forEach(t => { if (!t.textContent.trim()) return; const r = ratio(css(t, 'fill'), bg); if (r < 4.5) low.push([n.dataset.id, t.textContent, r]); });
        if (body && css(body, 'stroke') && css(body, 'stroke')[3]) { const k = ratio(css(body, 'stroke'), stageBg); if (k < 3) low.push([n.dataset.id, 'outline', k]); } });
      all('.edge-g path.edge').forEach(p => { const r = ratio(css(p, 'stroke'), stageBg); if (r < 3) low.push(['line', r]); });
      check(`${tag}: ${g.nodes.length} nodes and ${g.edges.length} lines drawn; no overlap, texts inside, inside their boxes${strict ? ', no line through a node, every end within 1 px of its node, no label over a node' : ''}, every piece named, contrast`,
        lines.length === g.edges.length && !bad.length && !low.length, [lines.length, g.edges.length, bad.slice(0, 10), low.slice(0, 6)]);
      h.destroy();
    }
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');

  // ---- the Bookshop atlas: each link opens its view in the page
  const ATLAS = await (await fetch('../examples/bookshop-atlas.json')).json(), LINKS = await (await fetch('../tools/atlas-links.json')).json();
  const id = ref => ref.slice(ref.indexOf('/') + 1), boxes = [];
  for (const l of LINKS.links) {
    // the first view that draws it as a card (a box, which holds what it owns, opens nothing on Enter)
    const n = id(l.element), to = id(l.opens), went = [];
    let h, g, on;
    for (const v of ATLAS.views.filter(v => v.nodeIds.includes(n))) {
      el.innerHTML = ''; h = render(el, ATLAS, { view: v.id, on: { viewchange: e => went.push(e.view) } }); sr = el.querySelector('.umlimator').shadowRoot;
      g = pick(`.stage .node[data-id="${CSS.escape(n)}"]`); on = v; if (g) break; h.destroy(); }
    const stage = pick('.stage'), r = g && g.getBoundingClientRect(), at = r && { clientX: r.x + r.width / 2, clientY: r.y + r.height / 2, bubbles: true, composed: true };
    if (g) { g.dispatchEvent(new PointerEvent('pointerdown', { ...at, button: 0, pointerId: 7, pointerType: 'mouse' })); g.dispatchEvent(new PointerEvent('pointerup', { ...at, button: 0, pointerId: 7, pointerType: 'mouse' }));
      g.dispatchEvent(new MouseEvent('click', at)); stage.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true, cancelable: true })); }
    await new Promise(res => setTimeout(res, 0));
    if (!g) { boxes.push(l.element); continue; }
    check(`the atlas: ${l.element}, selected in ${on.id} and opened by Enter, opens ${to}`, went.includes(to), went);
    h.destroy();
  }
  // two links of stages 5 and 6 name an element every view draws as a box, which Enter does not open (a gap, stated in
  // docs/module-api.md's 0.24.0 section); no milestone 2 link does
  check('the atlas: the links whose element is a box in every view are stage 5\'s and 6\'s two', JSON.stringify(boxes) === JSON.stringify(['bookshop-packages/sales', 'bookshop-deployment/jvm']), boxes);
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
