<!doctype html>
<!-- render() embedded in a plain page, as a host would: tests/embed.py serves the repository over HTTP, opens this in
     headless Chrome (it imports lib/umlimator.js as an ES module) and reads the result from <pre id="result">. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>umlimator embed test</title>
<body style="margin:0">
<div id="a" style="width:1000px;height:700px"></div>
<div id="b" style="width:600px;height:400px"></div>
<script type="module">
import { render, layout } from '../lib/umlimator.js';
const MODEL = await (await fetch('../examples/bookshop.json')).json(), THEME = await (await fetch('../lib/umlimator-theme.css')).text();
const loaded = performance.getEntriesByType('resource').length; // the module, the model and the theme; nothing after this
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const wait = ms => new Promise(r => setTimeout(r, ms));
// real work (an image decode, a PNG encode) under headless virtual time: tests/embed.py holds the clock meanwhile
const real = async f => { const hold = fetch('/__hold'); try { return await f(); } finally { await fetch('/__release'); await hold; } };
const until = async (f, ms = 5000) => { const t = Date.now(); while (!f() && Date.now() - t < ms) await wait(20); return f(); };
const before = new Set(Object.keys(window));
let file = '';
try {
  const el = document.getElementById('a'), ev = [];
  const h = render(el, MODEL, { on: { select: e => ev.push(['select', e.target]), click: e => ev.push(['click', e.target]), open: e => ev.push(['open', e.target, e.view]), viewchange: e => ev.push(['viewchange', e]) } });
  const sr = el.querySelector('.umlimator').shadowRoot, fire = (s, type = 'click') => sr.querySelector(s).dispatchEvent(new MouseEvent(type, { bubbles: true, composed: true }));
  check('starts on the root view', h.view === 'overview', h.view);
  check('draws inside a shadow root, every card of the view', sr.querySelectorAll('.node').length === 13);
  check('adds no globals', [...Object.keys(window)].every(k => before.has(k)), [...Object.keys(window)].filter(k => !before.has(k)));

  fire('.node[data-id="api"] .n-label');
  check('a card click reports click, then select, with a node ref', JSON.stringify(ev.slice(-2)) === JSON.stringify([['click', { type: 'node', id: 'api', view: 'overview' }], ['select', { type: 'node', id: 'api', view: 'overview' }]]), ev.slice(-2));
  check('handle.selection follows', h.selection && h.selection.id === 'api');

  const ids = new Set(MODEL.edges.map(e => e.id));
  fire('.edge-g[data-i="0"] .hitline');
  const er = ev[ev.length - 1][1];
  check('a line click selects an edge ref listing model edge ids', er.type === 'edge' && er.ids.length >= 1 && er.ids.every(i => ids.has(i)), er);

  h.select(null);
  check('handle.select(null) clears and reports', ev[ev.length - 1][0] === 'select' && ev[ev.length - 1][1] === null);

  const stop = h.on('open', e => e.preventDefault());
  fire('.node[data-id="api"]', 'dblclick'); await wait(300);
  check('open can be cancelled by the host', h.view === 'overview' && ev.some(x => x[0] === 'open' && x[2] === 'api'), h.view);
  stop();
  fire('.node[data-id="api"]', 'dblclick');
  check('open drills down and reports viewchange', await until(() => ev.some(x => x[0] === 'viewchange' && x[1].view === 'api' && x[1].from === 'overview')), ev.filter(x => x[0] === 'viewchange'));
  check('handle.view follows', h.view === 'api');
  h.setView('overview');
  check('setView goes back up', await until(() => h.view === 'overview' && ev.filter(x => x[0] === 'viewchange').length === 2));

  // export any view without showing it, and as a PNG in the browser
  const apiOff = h.toSVG({ view: 'api' }), vcs = ev.filter(x => x[0] === 'viewchange').length;
  check('toSVG({ view }) draws another view off screen; the screen stays', apiOff.startsWith('<svg') && h.view === 'overview' && ev.filter(x => x[0] === 'viewchange').length === vcs && !sr.querySelector('[style*="-100000px"]'));
  check('toSVG of an unknown view is empty', h.toSVG({ view: 'nope' }) === '');
  h.setView('api'); await until(() => h.view === 'api');
  check('the off-screen file is the one the view gives when shown', h.toSVG() === apiOff);
  h.setView('overview'); await until(() => h.view === 'overview' && ev.filter(x => x[0] === 'viewchange').length === vcs + 2);
  const png = await real(() => h.toPNG({ view: 'api', scale: 0.2 })), bmp = png && await real(() => createImageBitmap(png)), vbw = +apiOff.match(/viewBox="[^ ]+ [^ ]+ ([^ ]+)/)[1];
  check('toPNG gives a PNG of the view at the asked scale', png && png.type === 'image/png' && bmp.width === Math.ceil(vbw * 0.2), [png && png.type, bmp && bmp.width, vbw]);
  const face = '@font-face { font-family: "Host Sans"; src: url(data:font/woff2;base64,AAAA); }';
  check('fontCSS carries the host\'s @font-face rules into the file', h.toSVG({ fontCSS: face }).includes('font-family: "Host Sans"') && !h.toSVG().includes('Host Sans'));

  // update: a renamed card redraws in place; selection and view stay
  h.select({ type: 'node', id: 'api' });
  const svg0 = sr.querySelector('svg.map-svg');
  h.update(structuredClone(MODEL));
  check('an unchanged model does not redraw', sr.querySelector('svg.map-svg') === svg0);
  const m2 = structuredClone(MODEL); m2.nodes.find(n => n.id === 'api').label = 'Orders API';
  h.update(m2);
  check('a changed card redraws', sr.querySelector('svg.map-svg') !== svg0 && sr.querySelector('.node[data-id="api"] .n-label').textContent.includes('Orders API'));
  check('the view and selection survive an update', h.view === 'overview' && h.selection && h.selection.id === 'api', [h.view, h.selection]);
  const m3 = structuredClone(m2); m3.views.find(v => v.id === 'overview').nodeIds = m3.views.find(v => v.id === 'overview').nodeIds.filter(i => i !== 'api');
  h.update(m3);
  check('a selected card that is gone clears the selection', h.selection === null && ev[ev.length - 1][0] === 'select' && ev[ev.length - 1][1] === null);
  const m4 = structuredClone(m3); m4.views = m4.views.filter(v => v.id !== 'api');
  h.setView('api'); h.update(m4);
  check('updating away a view that is not shown keeps the current one', h.view === 'overview');

  h.destroy();
  check('destroy empties the container', el.childElementCount === 0);
  let threw = null; try { h.update(MODEL); h.select(null); h.destroy(); } catch (e) { threw = String(e); }
  check('a destroyed handle ignores later calls', threw === null, threw);

  // chips and containers
  const small = { nodes: [{ id: 'a', label: 'Reader', verbs: ['read', 'write'] }, { id: 'b', label: 'Store' }, { id: 'c', label: 'Index' }],
    edges: [{ id: 'e1', from: 'a', to: 'b' }, { id: 'e2', from: 'b', to: 'c' }],
    views: [{ id: 'v', nodeIds: ['a', 'b', 'c'], containers: [{ id: 'box', label: 'Data', nodeIds: ['b', 'c'] }] }] };
  const el2 = document.getElementById('b'), ev2 = [];
  el2.style.setProperty('--um-panel', 'rgb(10, 20, 30)'); el2.style.setProperty('--um-mono', 'monospace');
  const h2 = render(el2, small, { controls: false, on: { click: e => ev2.push(e.target), select: e => ev2.push(['select', e.target]) } });
  const sr2 = el2.querySelector('.umlimator').shadowRoot;
  const fbox = getComputedStyle(sr2.querySelector('.family-box')), ftitle = getComputedStyle(sr2.querySelector('.family-title'));
  check('a container box is a faint panel with an 11 px title (it was solid black)', fbox.fill === 'rgb(10, 20, 30)' && fbox.fillOpacity === '0.45' && ftitle.fontSize === '11px', [fbox.fill, fbox.fillOpacity, ftitle.fontSize]);
  check('…in toSVG() too', /<rect class="family-box"[^>]*style="fill: rgb\(10, 20, 30\);/.test(h2.toSVG()), (h2.toSVG().match(/<rect class="family-box"[^>]*>/) || [])[0]);
  sr2.querySelector('.node[data-id="a"] text[data-chip="1"]').dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
  check('each chip is clickable on its own, and selects its card', JSON.stringify(ev2) === JSON.stringify([{ type: 'chip', node: 'a', index: 1, value: 'write', view: 'v' }, ['select', { type: 'node', id: 'a', view: 'v' }]]), ev2);
  sr2.querySelector('.family[data-family="box"] .family-box').dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
  check('a container click reports a container ref', JSON.stringify(ev2.slice(-2)) === JSON.stringify([{ type: 'container', id: 'box', view: 'v' }, ['select', { type: 'container', id: 'box', view: 'v' }]]), ev2.slice(-2));
  check('controls: false leaves the zoom buttons out', !sr2.querySelector('.ctl'));
  h2.destroy(); el2.style.removeProperty('--um-panel'); el2.style.removeProperty('--um-mono');

  // colours, light and dark come from the host's --um-* variables; badges; edited; text in the host's font
  const el3 = document.getElementById('b'), ev3 = [];
  el3.style.setProperty('--um-green', 'rgb(1, 2, 3)'); el3.style.setProperty('--um-violet', 'rgb(4, 5, 6)');
  const tagged = { nodes: [{ id: 'svc', label: 'Billing', kind: 'backend', badges: ['BUILT', { text: 'Owner: platform', tone: 'violet' }], edited: true }, { id: 'db', label: 'Ledger', kind: 'database' }],
    edges: [{ id: 'e1', from: 'svc', to: 'db', label: 'writes', edited: true }], views: [{ id: 'v', nodeIds: ['svc', 'db'] }] };
  const h3 = render(el3, tagged, { on: { click: e => ev3.push(e.target) } });
  const sr3 = el3.querySelector('.umlimator').shadowRoot, body = () => getComputedStyle(sr3.querySelector('.node[data-id="svc"] .n-body')).stroke;
  check('a card takes its colour from the host variable', body() === 'rgb(1, 2, 3)', body());
  el3.style.setProperty('--um-green', 'rgb(7, 8, 9)');
  check('the host switches the palette (light / dark) by changing the variable', body() === 'rgb(7, 8, 9)', body());
  const tabs = sr3.querySelectorAll('.node[data-id="svc"] [data-badge]');
  check('each badge is its own tab', tabs.length === 2 && getComputedStyle(tabs[1].querySelector('rect')).fill === 'rgb(4, 5, 6)', tabs.length);
  tabs[1].querySelector('text').dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
  check('a badge click names the badge', JSON.stringify(ev3[0]) === JSON.stringify({ type: 'badge', node: 'svc', index: 1, value: 'Owner: platform', view: 'v' }), ev3);
  check('the edited marker shows on cards and lines', !!sr3.querySelector('.node[data-id="svc"] .edited-dot') && !!sr3.querySelector('.edge-g .edited-dot') && !sr3.querySelector('.node[data-id="db"] .edited-dot'));
  // accessibility: the map is a group of named buttons; selection and focus can be followed without a mouse
  const card = id => sr3.querySelector(`.node[data-id="${id}"]`), lab = card('svc').getAttribute('aria-label');
  check('the map is a group, not an image (an image hides its cards from screen readers)', sr3.querySelector('svg.map-svg').getAttribute('role') === 'group');
  check('a card is a focusable button named with its badges and edited state', card('svc').getAttribute('role') === 'button' && card('svc').tabIndex === 0 && lab.startsWith('Billing') && lab.includes('Owner: platform') && lab.includes('edited') && !card('db').getAttribute('aria-label').includes('edited'), lab);
  h3.select({ type: 'node', id: 'svc' });
  check('the selected card is pressed, the others not', card('svc').getAttribute('aria-pressed') === 'true' && card('db').getAttribute('aria-pressed') === 'false');
  check('a selection is announced', sr3.querySelector('[aria-live]').textContent === 'Billing, selected', sr3.querySelector('[aria-live]').textContent);
  card('svc').focus(); card('svc').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, composed: true }));
  check('an arrow key on a card moves focus to the next card that way', sr3.activeElement === card('db'), sr3.activeElement && sr3.activeElement.dataset.id);
  const sels3 = [], offSel = h3.on('select', e => sels3.push(e.target && e.target.id)), enter = id => card(id).dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true }));
  enter('db'); enter('db');
  check('Enter on a selected card with no inner view sends select again, as a click does', JSON.stringify(sels3) === '["db","db"]', sels3);
  offSel();
  h3.select(null);

  // the picture as a file, in the browser: host colours resolved, drawn at rest, the screen untouched
  h3.select({ type: 'node', id: 'svc' });
  file = h3.toSVG({ scale: 2 });
  const doc = new DOMParser().parseFromString(file, 'image/svg+xml'), root = doc.documentElement, vb = (root.getAttribute('viewBox') || '').split(' ').map(Number);
  check('toSVG gives a stand-alone SVG file at the asked scale', root.localName === 'svg' && !doc.querySelector('parsererror') && vb.length === 4 && +root.getAttribute('width') === vb[2] * 2, file.slice(0, 200));
  check('its colours are the host variables, resolved', !file.includes('var(') && file.includes('rgb(7, 8, 9)'), [file.includes('var('), (file.match(/rgb\([^)]*\)/g) || []).slice(0, 12), (file.match(/var\([^)]*\)/g) || []).slice(0, 5)]);
  check('the screen keeps its selection', h3.selection && h3.selection.id === 'svc' && !!sr3.querySelector('.node.sel'));
  h3.select(null);
  check('drawn at rest: a selection does not change the file', h3.toSVG({ scale: 2 }) === file);
  h3.destroy();
  check('a destroyed handle exports nothing', h3.toSVG() === '');
  const thin = { nodes: [{ id: 'a', label: 'i'.repeat(40) }], views: [{ id: 'v', nodeIds: ['a'] }] }, cardW = (font, opt = {}) => {
    el3.style.setProperty('--um-sans', font); const hh = render(el3, thin, opt);
    const w = +el3.querySelector('.umlimator').shadowRoot.querySelector('.n-body').getAttribute('width'); hh.destroy(); return w; };
  const est = layout(thin, 'v').nodes[0].w;
  check('text is measured in the host font', cardW('serif') < est && cardW('serif') !== cardW('monospace'), [cardW('serif'), cardW('monospace'), est]);
  check('measure: false keeps the font-independent estimate', cardW('serif', { measure: false }) === est);

  // the default theme on the page, and a host that sets a tone on an ancestor of the map: the tint follows the tone
  const sheet = new CSSStyleSheet(); sheet.replaceSync(THEME); document.adoptedStyleSheets = [sheet];
  const el4 = document.getElementById('b'); el4.style.setProperty('--um-green', 'rgb(255, 0, 0)');
  const h4 = render(el4, { nodes: [{ id: 'a', label: 'Orders', kind: 'backend' }], views: [{ id: 'v', nodeIds: ['a'] }] });
  const want = document.createElement('i'); want.style.color = 'color-mix(in srgb, var(--um-green) 9%, var(--um-panel))'; el4.appendChild(want);
  const tint = getComputedStyle(el4.querySelector('.umlimator').shadowRoot.querySelector('.n-body')).fill;
  check('a tone set on an ancestor of the map recolours its tint too (the theme mixed it on :root)', tint === getComputedStyle(want).color, [tint, getComputedStyle(want).color]);
  h4.destroy(); want.remove(); el4.style.removeProperty('--um-green'); document.adoptedStyleSheets = [];
  const own = () => performance.getEntriesByType('resource').filter(r => !/\/__(hold|release)$/.test(r.name)); // the test's own clock holds are not the map's
  check('makes no network requests', own().length === loaded, own().slice(loaded).map(r => r.name));
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(file);
  check('the file is a picture: role img, nothing focusable', /^<svg[^>]* role="img"/.test(file) && !file.includes('tabindex'));
  check('the file draws as an image on its own', await real(() => img.decode().then(() => img.naturalWidth > 0, () => false)));

  // a test DOM such as jsdom (a host's component tests): no ResizeObserver, no matchMedia, and a canvas without a 2D context
  const gone = ['ResizeObserver', 'matchMedia'].map(k => [k, Object.getOwnPropertyDescriptor(window, k)]), getContext = HTMLCanvasElement.prototype.getContext, errors = [];
  const onError = e => errors.push(String(e.message));
  addEventListener('error', onError); gone.forEach(([k]) => delete window[k]); HTMLCanvasElement.prototype.getContext = () => null;
  try {
    const el5 = document.getElementById('b'); let h5 = null, threw = null;
    try { h5 = render(el5, thin); } catch (e) { threw = String(e); }
    const sr5 = h5 && el5.querySelector('.umlimator').shadowRoot;
    check('without ResizeObserver, matchMedia or a 2D canvas (jsdom), render() draws the map', !threw && !!sr5.querySelector('.node'), threw);
    check('…measuring text with the font-independent estimate', !!sr5 && +sr5.querySelector('.n-body').getAttribute('width') === est);
    if (sr5) ['in', 'out', 'fit', 'one'].forEach(z => sr5.querySelector(`[data-z="${z}"]`).dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true })));
    await wait(50);
    check('…and its zoom buttons work without matchMedia', !!sr5 && !errors.length, errors);
    if (h5) h5.destroy();
  } finally { gone.forEach(([k, d]) => Object.defineProperty(window, k, d)); HTMLCanvasElement.prototype.getContext = getContext; removeEventListener('error', onError); }
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
