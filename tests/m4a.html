<!doctype html>
<!-- Milestone 4a's fixtures (4a.7, notes/milestone-4a.md §10.1) in headless Chrome (tests/embed.py), from ../src/ throughout
     (aws is off in the build and registered here, §4.7): every view of tests/mindmap-minimal.json, mindmap-stress.json,
     cloud-minimal.json and cloud-stress.json drawn by render() in both themes and three fonts, cloud views right and down,
     with a synthetic icons table (S18: a coloured square and a white circle, no vendor icon): every node drawn, no two
     topics or cards meeting, every text inside its shape, no branch curve through a topic (sampled every 4 px), every
     element inside its group, every vendor <image> with meet and nothing that crops, filters, masks, fades or transforms it,
     Google's legal line inside the picture under a Google icon only, every node named, texts at 4.5:1 and outlines, curves
     and glyphs at 3:1. Then the Bookshop atlas: the opening plan's Hosting topics open the Google Cloud and Azure views.
     tests/m4a-fixtures.test.mjs lays the same views out in Node. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator milestone 4a fixtures test</title>
<body style="margin:0">
<div id="m" style="width:1600px;height:1200px"></div>
<script type="module">
import { render } from '../src/canvas/render.js';
import { registerDiagramType } from '../src/core/registry.js';
import { layout } from '../src/map/api.js';
import '../src/map/typed.js';
import '../src/typed/edit.js';
import '../src/mindmap/mindmap.js';
import { CLOUD_DEFS, GCP_LEGAL } from '../src/cloud/cloud.js';
registerDiagramType('aws', CLOUD_DEFS.aws);
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const el = document.getElementById('m');
let sr;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const box = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b) => a.x < b.x + b.w - .5 && b.x < a.x + a.w - .5 && a.y < b.y + b.h - .5 && b.y < a.y + a.h - .5;
const inside = (a, b, k = .5) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (x, k) => rgba(getComputedStyle(x)[k]);
// synthetic icons (S18), the table the CLI builds from a fetched pack (§4.5); one icon the pack lacks
const svgUrl = body => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">${body}</svg>`);
const SQ = svgUrl('<rect width="16" height="16" fill="#3367d6"/>'), WH = svgUrl('<circle cx="8" cy="8" r="7" fill="#fff"/>'), WHITE = ['Cloud-SQL', 'SQL-Database', 'Amazon-RDS'];
const table = m => Object.fromEntries([['gcp/', { legal: GCP_LEGAL }], ...m.nodes.filter(n => n.props && n.props.icon && n.props.icon !== 'Cloud-Search-Appliance')
  .map(n => [`${n.type.split('.')[0]}/${n.props.icon}`, { src: WHITE.includes(n.props.icon) ? WH : SQ, dark: WHITE.includes(n.props.icon), name: n.props.icon.replace(/-/g, ' ') }])]);
const load = async f => (await fetch(f)).json();
const FIX = { 'mindmap-minimal': await load('mindmap-minimal.json'), 'mindmap-stress': await load('mindmap-stress.json'), 'cloud-minimal': await load('cloud-minimal.json'), 'cloud-stress': await load('cloud-stress.json') };
// a vendor <image> and what holds it in its card: nothing that crops, filters, masks, fades or transforms it (§5.2)
const untouched = img => { const bad = []; if (img.getAttribute('preserveAspectRatio') !== 'xMidYMid meet') bad.push('not meet');
  for (let e = img; e && !e.classList.contains('node'); e = e.parentElement) { const s = getComputedStyle(e);
    if (['clip-path', 'filter', 'mask', 'opacity', 'transform'].some(a => e.hasAttribute(a))) bad.push(e.tagName + ' attribute');
    if (s.opacity !== '1' || s.filter !== 'none' || s.clipPath !== 'none' || (s.mask && s.mask !== 'none') || s.transform !== 'none') bad.push(e.tagName + ' style'); }
  return bad; };
try {
  for (const [fx, RAW] of Object.entries(FIX)) {
    const MODEL = fx.startsWith('cloud') ? { ...RAW, icons: table(RAW) } : RAW;
    for (const v of MODEL.views) for (const d of v.diagram === 'mindmap' ? [null] : ['right', 'down'])
      for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) {
        document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
        const M = d ? { ...MODEL, views: MODEL.views.map(w => (w.id === v.id ? { ...w, direction: d } : w)) } : MODEL, g = layout(M, v.id), mind = v.diagram === 'mindmap';
        el.innerHTML = ''; const h = render(el, M, { view: v.id, legend: true }); sr = el.querySelector('.umlimator').shadowRoot;
        const tag = `${fx} ${v.id}${d ? ', ' + d : ''}, ${theme}, ${fname}`, svg = pick('.stage svg'), bad = [];
        svg.style.textRendering = 'geometricPrecision';
        const nodes = all('.stage .node[data-id]'), body = x => x.querySelector(mind ? 'rect.n-body' : '.n-mask') || x.querySelector('.n-body');
        const B = new Map(nodes.map(x => [x.dataset.id, box(body(x))])), list = [...B];
        list.forEach(([a, p], i) => list.slice(i + 1).forEach(([b, q]) => { if (meets(p, q)) bad.push(`${a} and ${b} meet`); }));
        nodes.forEach(x => x.querySelectorAll('text').forEach(t => { if (t.textContent.trim() && !inside(box(t), B.get(x.dataset.id))) bad.push(`${x.dataset.id}: "${t.textContent}" spills`); }));
        if (mind) all('.mm-branch').forEach((p, i) => { const L = p.getTotalLength();
          for (let s = 4; s < L - 4; s += 4) { const q = p.getPointAtLength(s);
            for (const [id, b] of B) if (q.x > b.x + .5 && q.x < b.x + b.w - .5 && q.y > b.y + .5 && q.y < b.y + b.h - .5) { bad.push(`curve ${i} through ${id}`); break; } } });
        else {
          const frame = id => { const f = pick(`.family[data-family="${CSS.escape(id)}"] .family-box`); return f && box(f); };
          M.nodes.filter(n => v.nodeIds.includes(n.id) && n.parent && frame(n.parent)).forEach(n => { const b = B.get(n.id) || frame(n.id); if (b && !inside(b, frame(n.parent))) bad.push(`${n.id} is outside ${n.parent}`); });
          all('.family').forEach(f => { const t = f.querySelector('.family-title'); if (t && !inside(box(t), box(f.querySelector('.family-box')))) bad.push(`${f.dataset.family}'s title spills`); });
        }
        check(`${tag}: ${g.nodes.length} nodes drawn; none meeting, every text inside its shape, ${mind ? 'no curve through a topic' : 'every element inside its group'}`, nodes.length === g.nodes.length && !bad.length, [nodes.length, g.nodes.length, [...new Set(bad)].slice(0, 8)]);
        if (!mind) {
          const imgs = all('.node image'), touched = imgs.flatMap(i => untouched(i).map(x => `${i.closest('.node').dataset.id}: ${x}`));
          check(`${tag}: ${imgs.length} vendor <image>s from data URLs, with meet, never clipped, filtered, masked, faded or transformed; ${all('.edge-g').length} lines drawn`,
            !touched.length && imgs.every(i => /^data:image\//.test(i.getAttribute('href'))) && all('.edge-g').length === g.edges.length, touched.slice(0, 6));
          const legal = pick('text.cl-legal'), google = v.diagram === 'gcp' && imgs.length > 0;
          if (google) { const L = box(legal), vb = svg.viewBox.baseVal;
            check(`${tag}: Google's legal line inside the picture, under it`, legal.textContent === GCP_LEGAL && L.x >= vb.x && L.y >= vb.y && L.x + L.w <= vb.x + vb.width && L.y + L.h <= vb.y + vb.height
              && list.every(([, b]) => b.y + b.h < L.y), [L, [vb.x, vb.y, vb.width, vb.height]]); }
          else check(`${tag}: no Google icon drawn, no legal line`, !legal);
        }
        const unnamed = nodes.filter(x => !(x.getAttribute('aria-label') || '').trim()).map(x => x.dataset.id);
        const bg = css(pick('.stage'), 'backgroundColor'), low = [];
        all('.node text, .family-title, text.cl-legal').forEach(t => { if (!t.textContent.trim()) return; const c = ratio(css(t, 'fill'), bg); if (c < 4.5) low.push([t.textContent, c]); });
        all('.mm-branch, .node.mm-topic rect.n-body, .node.cloud-card .n-body, .family .family-box, .cl-glyph').forEach(b => { const s = css(b, 'stroke'); if (!s || !s[3]) return; const c = ratio(s, bg); if (c < 3) low.push([b.getAttribute('class'), c]); });
        check(`${tag}: every node named; contrast: texts 4.5:1, outlines, curves and glyphs 3:1`, !unnamed.length && !low.length, [unnamed.slice(0, 6), low.slice(0, 4)]);
        h.destroy();
      }
  }
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
  // the Bookshop atlas: the opening plan is a root view, and its Hosting topics carry the drill-down mark to the cloud views
  const atlas = await load('../examples/bookshop-atlas.json');
  el.innerHTML = ''; const h = render(el, atlas, { view: 'mm-plan' }); sr = el.querySelector('.umlimator').shadowRoot;
  const marks = ['mm-on-gcp', 'mm-on-azure'].map(id => { const x = pick(`.node[data-id="${id}"]`); return x && x.querySelector('.open-hint') ? x.getAttribute('aria-label') : null; });
  check('the atlas: the opening plan\'s Hosting topics open the Google Cloud and Azure views, each with its drill-down mark',
    marks[0] === 'Topic On Google Cloud, under Hosting, opens Bookshop on Google Cloud' && marks[1] === 'Topic On Azure, under Hosting, opens Bookshop on Azure', marks);
  h.setView('gcp-on-gcp');
  check('the atlas: the Google Cloud view drawn there with glyphs (no pack in the atlas) and no legal line', all('.node.cloud-card').length === 9 && !all('.node image').length && !pick('text.cl-legal'), all('.node.cloud-card').length);
  h.destroy();
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
