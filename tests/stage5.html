<!doctype html>
<!-- Stage 5's fixtures (5.8, notes/stage-5.md §13) in headless Chrome (tests/embed.py), from lib/umlimator-all.js: every
     view of tests/component-*.json, deployment-*.json and composite-*.json, each drawn by render() in both themes, three
     fonts and both directions: every node and line drawn, no two nodes overlapping (a port sits on its owner's border by
     design; the ten ports on one side of a box, five held at its span's start, are pinned in Node), every text inside its
     node (a port's name is outside it, by design), no line through a node but its own two ends and their owners, every line
     end on its shape's outline or on a port's square, every node and line named, texts at 4.5:1 and lines and outlines at
     3:1. tests/stage5-fixtures.test.mjs holds the same in Node, with what check() finds pinned and §14's budgets. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator stage 5 fixtures test</title>
<body style="margin:0">
<div id="m" style="width:1200px;height:900px"></div>
<script type="module">
import { render, layout } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const el = document.getElementById('m');
let sr;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const bb = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b, k = 0) => a.x + k < b.x + b.w && b.x + k < a.x + a.w && a.y + k < b.y + b.h && b.y + k < a.y + a.h;
const inside = (a, b, k = 1) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const ptsOf = d => { const n = d.match(/-?\d+(\.\d+)?/g).map(Number), p = []; for (let i = 0; i < n.length; i += 2) p.push([n[i], n[i + 1]]); return p; };
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (x, k) => rgba(getComputedStyle(x)[k]);
const FIX = {};
for (const t of ['component', 'deployment', 'composite']) for (const k of ['minimal', 'stress']) FIX[`${t}-${k}`] = await (await fetch(`${t}-${k}.json`)).json();
// is a point on an element's outline, within 1.5 px: in the stroke when it is drawn 3 px wide
const onStroke = (svg, x, [px, py]) => { if (!x || !x.isPointInStroke) return false; const was = x.style.strokeWidth; x.style.strokeWidth = '3px';
  const p = svg.createSVGPoint(); p.x = px; p.y = py; const r = x.isPointInStroke(p); x.style.strokeWidth = was; return r; };
try {
  for (const [fx, MODEL] of Object.entries(FIX)) for (const v of MODEL.views) for (const d of ['right', 'down'])
    for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) {
      document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
      const M = { ...MODEL, views: MODEL.views.map(w => (w.id === v.id ? { ...w, direction: d } : w)) }, g = layout(M, v.id);
      el.innerHTML = ''; const h = render(el, M, { view: v.id }); sr = el.querySelector('.umlimator').shadowRoot;
      const tag = `${fx} ${v.id}, ${d}, ${theme}, ${fname}`, svg = pick('.stage svg'), bad = [];
      // text measured unhinted, as tests/sequence-fixtures.html does: a view fit into the page is drawn small
      svg.style.textRendering = 'geometricPrecision';
      const nodes = all('.stage svg .node[data-id]'), lines = all('.edge-g');
      const own = id => pick(`.node[data-id="${CSS.escape(id)}"]`), fam = id => pick(`.family[data-family="${CSS.escape(id)}"]`);
      const shapeOf = n => n.querySelector(':scope > .n-mask') || n.querySelector(':scope > .n-body') || n.querySelector(':scope > .fl-hit') || n.querySelector(':scope > g > .n-mask, :scope > g > .n-body');
      const missing = g.nodes.filter(n => !own(n.id)).map(n => n.id);
      if (missing.length) bad.push(`not drawn: ${missing.join(', ')}`);
      const B = new Map(nodes.filter(n => shapeOf(n)).map(n => [n.dataset.id, bb(shapeOf(n))]));
      const ownerOf = new Map(g.nodes.filter(n => n.shape === 'port').map(n => [n.id, n.owner])), isPort = id => ownerOf.has(id);
      const solid = [...B].filter(([id]) => !(ownerOf.get(id) === 'ec-tenbox'));
      solid.forEach(([a, p], i) => solid.slice(i + 1).forEach(([b, q]) => { if (ownerOf.get(a) === b || ownerOf.get(b) === a) return; if (meets(p, q, .5)) bad.push(`${a} and ${b} overlap`); }));
      // a ball's name hangs under its circle, by design (§9.1)
      nodes.filter(n => !isPort(n.dataset.id) && !n.classList.contains('ball')).forEach(n => { const box = B.get(n.dataset.id);
        n.querySelectorAll(':scope > text, :scope > g > text').forEach(t => { if (t.textContent.trim() && !inside(bb(t), box)) bad.push(`${n.dataset.id}: "${t.textContent}" out of its shape`); }); });
      // no line through a node but its own two ends, their ports and owners; each end on its node's outline, its box's frame
      // (a cube's faces included), or a port's square (within 1.5 px: a marker's cut)
      const squares = [...B].filter(([id]) => isPort(id)).map(([, b]) => b), near = (q, b, k = 1.5) => Math.max(b.x - q[0], q[0] - b.x - b.w, b.y - q[1], q[1] - b.y - b.h, 0) <= k;
      lines.forEach(e => { const from = e.dataset.from, to = e.dataset.to, p = ptsOf(e.querySelector('path.edge').getAttribute('d'));
        const ends = [from, to].flatMap(id => [id, ...[...ownerOf].filter(([, o]) => o === id).map(([x]) => x)]);
        p.slice(1).forEach((q, k) => { const s = { x: Math.min(p[k][0], q[0]), y: Math.min(p[k][1], q[1]), w: Math.abs(q[0] - p[k][0]) || .01, h: Math.abs(q[1] - p[k][1]) || .01 };
          B.forEach((b, id) => { if (!ends.includes(id) && meets(s, { x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 })) bad.push(`${from}>${to} runs through ${id}`); }); });
        [[p[0], from], [p.at(-1), to]].forEach(([q, id]) => { const n = own(id), f = !n && fam(id);
          if (squares.some(b => near(q, b))) return;
          // known (risks.md L17), on the generated view all under the monospace font only: it widens a ball's node, and two
          // lines that come in from below (or above: audit 3 keeps a top-level ball out of a box) end on the node's bottom (top)
          // beside the circle, 2.4 px off it in this Chrome (4 kept)
          const next = q === p[0] ? p[1] : p.at(-2);
          if (v.id === 'all' && fname === 'wide' && n && n.classList.contains('ball') && next[1] !== q[1] && near(q, bb(n.querySelector(':scope > .n-mask') || n), 4)) return;
          const shapes = n ? [n.querySelector(':scope > .n-body'), n.querySelector(':scope > .n-mask')] : f ? [f.querySelector('.family-box'), f.querySelector('.dp-face'), ...f.querySelectorAll('.family-box ~ *')] : [];
          if (!shapes.some(x => onStroke(svg, x, q))) bad.push(`${from}>${to} ends off ${id}'s outline at ${q}`); }); });
      // every piece named (A1)
      nodes.forEach(n => { if (!(n.getAttribute('aria-label') || '').trim()) bad.push(`${n.dataset.id} has no name`); });
      lines.forEach(e => { if (!(e.querySelector(':scope > title') || {}).textContent) bad.push(`a line from ${e.dataset.from} has no name`); });
      // contrast: texts 4.5:1 on what is under them, lines and outlines 3:1 on the stage
      const stageBg = css(pick('.stage'), 'backgroundColor'), low = [];
      nodes.forEach(n => { const body = n.querySelector(':scope > .n-body'), fill = body && css(body, 'fill'), bg = fill && fill[3] ? blend(fill, stageBg) : stageBg;
        n.querySelectorAll(':scope > text, :scope > g > text').forEach(t => { if (!t.textContent.trim()) return; const r = ratio(css(t, 'fill'), bg); if (r < 4.5) low.push([n.dataset.id, t.textContent, r]); });
        if (body && css(body, 'stroke') && css(body, 'stroke')[3]) { const k = ratio(css(body, 'stroke'), stageBg); if (k < 3) low.push([n.dataset.id, 'outline', k]); } });
      lines.forEach(e => { const r = ratio(css(e.querySelector('path.edge'), 'stroke'), stageBg); if (r < 3) low.push(['line', e.dataset.from, e.dataset.to, r]); });
      all('.e-lab').forEach(x => { const r = ratio(css(x.querySelector('text'), 'fill'), blend(css(x.querySelector('rect'), 'fill'), stageBg)); if (r < 4.5) low.push(['label', x.textContent, r]); });
      check(`${tag}: ${g.nodes.length} nodes and ${g.edges.length} lines drawn; no overlap, texts inside, no line through a node, ends on outlines, every piece named, contrast`,
        lines.length === g.edges.length && !bad.length && !low.length, [lines.length, bad.slice(0, 10), low.slice(0, 6)]);
      h.destroy();
    }
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
