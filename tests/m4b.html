<!doctype html>
<!-- Milestone 4b's fixtures (4b.5, notes/milestone-4b.md §13) in headless Chrome (tests/embed.py), from lib/umlimator-all.js:
     every view of tests/bpmn-minimal.json and tests/bpmn-stress.json drawn by render() in both directions, both themes and
     three fonts: every node and line drawn, no two shapes overlapping (a boundary circle on its own activity aside), every
     text inside its task or annotation, every flow node inside its lane's band (its pool's for a pool with no lanes),
     every node an expanded sub-process holds inside its frame, every boundary circle centred on its activity's border,
     every line's ends on their outlines (a boundary event's circle, a pool's border for a message flow to a pool), the
     names outside clear of the shapes and each other, every node and line named, texts at 4.5:1 and lines and outlines
     at 3:1. tests/m4b-fixtures.test.mjs lays the same views out in Node; tests/bpmn.html draws the example. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator milestone 4b fixtures test</title>
<body style="margin:0">
<div id="m" style="width:1600px;height:1200px"></div>
<script type="module">
import { render, layout } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const el = document.getElementById('m');
let sr;
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const box = x => { const r = x.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b) => a.x < b.x + b.w - .5 && b.x < a.x + a.w - .5 && a.y < b.y + b.h - .5 && b.y < a.y + a.h - .5;
const inside = (a, b, k = .5) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const pt = (svg, x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p; };
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (x, k) => rgba(getComputedStyle(x)[k]);
const SHAPES = ['bpmn-task', 'bpmn-event', 'bpmn-gateway', 'bpmn-data', 'bpmn-store', 'bpmn-note'];
const FIX = { 'bpmn-minimal': await (await fetch('bpmn-minimal.json')).json(), 'bpmn-stress': await (await fetch('bpmn-stress.json')).json() };

// a flow node's innermost lane, else its pool (test-side, not the type's)
function homes(m) {
  const lanes = new Map(), byId = new Map(m.nodes.map(n => [n.id, n])); m.nodes.forEach(n => (n.members || []).forEach(l => lanes.set(l.id, { l, pool: n.id })));
  const up = id => (lanes.has(id) ? lanes.get(id).l.parent ?? lanes.get(id).pool : (byId.get(id) || {}).parent);
  return id => { for (let p = up(id), k = 0; p != null && k < 64; p = up(p), k++) if (lanes.has(p) || (byId.get(p) || {}).type === 'bpmn.Participant') return p; return null; };
}
try {
  for (const [fx, MODEL] of Object.entries(FIX)) for (const v of MODEL.views) for (const d of ['right', 'down'])
    for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) {
      document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
      const M = { ...MODEL, views: MODEL.views.map(w => (w.id === v.id ? { ...w, direction: d } : w)) }, g = layout(M, v.id), home = homes(M);
      el.innerHTML = ''; const h = render(el, M, { view: v.id }); sr = el.querySelector('.umlimator').shadowRoot;
      const tag = `${fx} ${v.id}, ${d}, ${theme}, ${fname}`, svg = pick('.stage svg'), bad = [];
      svg.style.textRendering = 'geometricPrecision';
      const missing = g.nodes.filter(n => !pick(`.node[data-id="${CSS.escape(n.id)}"]`)).map(n => n.id);
      const shapes = all(SHAPES.map(s => `.node.${s}`).join(', ')), B = new Map(shapes.map(x => [x.dataset.id, box(x.querySelector(x.classList.contains('bpmn-note') ? '.bp-hit' : '.n-body'))]));
      const owner = id => (g.byId[id] || {}).owner, list = [...B];
      list.forEach(([a, p], i) => list.slice(i + 1).forEach(([b, q]) => { if (meets(p, q) && owner(a) !== b && owner(b) !== a) bad.push(`${a} and ${b} overlap`); }));
      all('.node.bpmn-task, .node.bpmn-note').forEach(x => x.querySelectorAll('text').forEach(t => { if (t.textContent.trim() && !inside(box(t), B.get(x.dataset.id))) bad.push(`${x.dataset.id}: "${t.textContent}" spills`); }));
      // every flow node in its lane's (or pool's) band; what an expanded sub-process holds inside its frame
      g.nodes.filter(n => /Event$|Gateway$|Task$|SubProcess$|CallActivity$/.test(n.type) && !n.owner && B.has(n.id)).forEach(n => { const l = home(n.id), r = l && pick(`.bz-pools rect[data-o="${CSS.escape(l)}"]`);
        if (r && !inside(B.get(n.id), box(r))) bad.push(`${n.id} is out of ${l}'s band`); });
      (g.families || []).forEach(f => { const fr = pick(`.family[data-family="${CSS.escape(f.id)}"] .family-box`) || pick(`.node[data-id="${CSS.escape(f.id)}"] .n-body`);
        if (!fr) return bad.push(`frame ${f.id} not drawn`); M.nodes.filter(n => n.parent === f.id && B.has(n.id)).forEach(n => { if (!inside(B.get(n.id), box(fr), 1)) bad.push(`${n.id} outside ${f.id}`); }); });
      // boundary circles on their activity's border
      const frame = id => pick(`.family[data-family="${CSS.escape(id)}"] .family-box`);
      g.nodes.filter(n => n.type === 'bpmn.BoundaryEvent' && n.owner).forEach(n => { const c = B.get(n.id), o = B.get(n.owner) || box(frame(n.owner));
        const cx = c.x + c.w / 2, cy = c.y + c.h / 2, on = { B: cy - (o.y + o.h), T: cy - o.y, R: cx - (o.x + o.w), L: cx - o.x }[n.side];
        if (!(Math.abs(on) < 1)) bad.push(`${n.id} ${on} px off ${n.owner}'s border`); });
      check(`${tag}: ${g.nodes.length} nodes drawn; no overlap, texts inside, each flow node in its band, a frame round what it holds, boundary circles on borders`, !missing.length && !bad.length, [missing, bad.slice(0, 8)]);
      // every line drawn, its ends on their outlines
      const lines = all('.edge-g'), off = [], x2 = id => (g.byId[id] || {}).type === 'bpmn.BoundaryEvent' && !!g.byId[id].owner;
      lines.forEach(x => { const p = x.querySelector('path.edge'), L = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(L);
        [[x.dataset.from, a], [x.dataset.to, b]].forEach(([id, q]) => { const e = CSS.escape(id), body = pick(`.node[data-id="${e}"].bpmn-note .bp-hit`) || pick(`.node[data-id="${e}"] .n-body`) || pick(`.bz-pools rect[data-o="${e}"]`) || frame(id);
          if (!body) { off.push(`${id}: no outline`); return; }
          // a boundary event's ends: on its circle within 1 px (two lines on one circle leave its box's face side by side, §13's 1 px)
          if (x2(id)) { const c = box(body), r = Math.hypot(q.x - c.x - c.w / 2, q.y - c.y - c.h / 2) - c.w / 2; if (Math.abs(r) > 1) off.push(`${x.dataset.from}>${x.dataset.to} ${r.toFixed(2)} px off ${id}'s circle`); return; }
          const was = body.style.strokeWidth; body.style.strokeWidth = '3px';
          if (!body.isPointInStroke(pt(svg, q.x, q.y))) off.push(`${x.dataset.from}>${x.dataset.to} off ${id} at ${Math.round(q.x)},${Math.round(q.y)}`); body.style.strokeWidth = was; }); });
      check(`${tag}: ${g.edges.length} lines drawn, every end on its outline`, lines.length === g.edges.length && !off.length, [lines.length, g.edges.length, off.slice(0, 6)]);
      // the names outside, clear of the shapes and each other (a name the search could not place is marked clash in Node)
      const labs = all('.bp-label'), clash = [], placed = new Set((g.labels || []).filter(l => !l.clash).map(l => l.id));
      labs.filter(L => placed.has(L.dataset.o)).forEach((L, i, ok) => { const b = box(L); B.forEach((n, id) => { if (meets(b, n)) clash.push(`${L.dataset.o} meets ${id}`); });
        ok.slice(i + 1).forEach(K => { if (meets(b, box(K))) clash.push(`${L.dataset.o} meets ${K.dataset.o}`); }); });
      check(`${tag}: ${labs.length} names outside, each placed one clear of the shapes and the other names`, labs.length === (g.labels || []).length && !clash.length, clash.slice(0, 6));
      const unnamed = [...all('.stage .node[data-id]').filter(x => !(x.getAttribute('aria-label') || '').trim()).map(x => x.dataset.id), ...lines.filter(x => !(x.querySelector(':scope > title') || {}).textContent).map(x => x.dataset.from)];
      const bg = css(pick('.stage'), 'backgroundColor'), low = [];
      all('.node text, .bp-label text').forEach(t => { if (!t.textContent.trim()) return; const c = ratio(css(t, 'fill'), bg); if (c < 4.5) low.push([t.textContent, c]); });
      all('.node .n-body, .edge-g path.edge, .bz-pools rect').forEach(b => { const s = css(b, 'stroke'); if (!s || !s[3]) return; const c = ratio(s, bg); if (c < 3) low.push([b.getAttribute('class'), c]); });
      check(`${tag}: every node and line named; contrast: texts 4.5:1, outlines, borders and lines 3:1`, !unnamed.length && !low.length, [unnamed.slice(0, 6), low.slice(0, 4)]);
      h.destroy();
    }
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
