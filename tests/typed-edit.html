<!doctype html>
<!-- Editing a typed view (1.7) in headless Chrome (tests/embed.py): each gesture, by pointer and by keyboard, emits one
     `edit` event whose commands are checked exactly and applied with apply(); the panels follow the type's definition;
     a read-only embed has none of it; a map view keeps its `change` events. Imports src/ to register a test type.
     Boxes on a typed view (2.1, notes/stage-2.md §8): a drop into, out of and between boxes, the Owner field, a box selected
     as a container; after a re-own every box holds exactly its contents. A second test type gives boxes from `parent`.
     What 3.4 adds to lib/umlimator.js (notes/stage-3.md §5.1): key rings on a typed view's lines, in geo.order when its type
     gives one; lines in the selection (Shift + click, Shift + Enter on a ring); L from a line when the type has edits.connect;
     no pin with layout.pins false. This page loads no src/typed/edit.js: a line to itself is still refused, as in 0.17.0.
     Stage 6's fields slot (notes/stage-6.md §5.7, 6.1): a test fill of TYPED.fields adds fields after the type's own, each
     committed as a set of its path inside props. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator typed edit test</title>
<body style="margin:0">
<div id="m" style="width:1100px;height:680px"></div>
<script type="module">
import { render } from '../src/canvas/render.js';
import { registerDiagramType, TYPED } from '../src/core/registry.js';
import { apply } from '../src/core/apply.js';
import { validate } from '../src/map/validate.js';
import { layoutTyped } from '../src/typed/layout.js';
import { SHAPE } from '../src/draw/shapes.js';
import { layout } from '../src/map/api.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
registerDiagramType('test.box', { title: 'test boxes',
  elements: [{ type: 'test.Box', label: 'Box' }, { type: 'test.Note', label: 'Note' }],
  lines: [{ type: 'test.Uses', label: 'Uses' }, { type: 'test.Owns', label: 'Owns' }],
  props: { 'test.Box': [{ key: 'owner', label: 'Owner', kind: 'text' }, { key: 'abstract', label: 'Abstract', kind: 'bool' }, { key: 'tier', label: 'Tier', kind: 'enum', options: ['gold', 'silver'] }] } });
const MODEL = { schemaVersion: 2,
  nodes: [{ id: 'a', type: 'test.Box', label: 'Alpha', props: { owner: 'x' }, members: [{ id: 'a1', type: 'test.Field', label: 'one' }, { id: 'a2', type: 'test.Field', label: 'two' }, { id: 'a3', label: 'untyped' }] },
    { id: 'b', type: 'test.Box', label: 'Beta' }, { id: 'c', type: 'test.Box', label: 'Gamma' }, { id: 'd', type: 'test.Note', label: 'Delta', props: { text: 'hi <b>' } },
    { id: 'z', type: 'Bad', label: 'Orphan' }],
  edges: [{ id: 'ab', type: 'test.Uses', from: 'a', to: 'b' }, { id: 'cd', type: 'test.Uses', from: 'c', to: 'd' }],
  views: [{ id: 'v', diagram: 'test.box', nodeIds: ['a', 'b', 'c', 'd'], layout: { a: [0, 0], b: [1, 0], c: [1, 1], d: [2, 1] } }, { id: 'm', nodeIds: ['a', 'b'] }] };
const el = document.getElementById('m');
let sr, stage, ed = [], ch = [];
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const centre = s => { const r = pick(s).getBoundingClientRect(); return [r.x + r.width / 2, r.y + r.height / 2]; };
const ptr = (target, type, [x, y], extra = {}) => target.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, pointerId: 7, pointerType: 'mouse', bubbles: true, composed: true, ...extra }));
const key = (k, extra = {}, target = stage) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true, ...extra }));
const click = (s, extra = {}) => { const g = pick(s), at = centre(s); ptr(g, 'pointerdown', at); ptr(g, 'pointerup', at); g.dispatchEvent(new MouseEvent('click', { clientX: at[0], clientY: at[1], bubbles: true, composed: true, ...extra })); };
const card = id => click(`.node[data-id="${id}"] .n-label`);
const last = () => ed[ed.length - 1];
const panel = s => pick('.um-editor ' + s);
const button = text => all('.um-editor button').find(b => b.textContent.trim() === text);
const mount = (opts, model = MODEL, view = 'v') => { el.innerHTML = ''; ed = []; ch = []; const h = render(el, model, { view, on: { edit: e => ed.push(e), change: c => ch.push(c) }, ...opts }); sr = el.querySelector('.umlimator').shadowRoot; stage = pick('.stage'); return h; };
// the event's commands, exactly, and the model they give
// and the model they give validates with no error (warnings are fine)
const errors = m => validate(m).filter(p => p.level === 'error');
const gives = (name, cmds, test, base = MODEL) => { const e = last(); let m = null, err = null; try { m = e && apply(base, e.commands); } catch (x) { err = String(x); }
  const bad = m ? errors(m) : [];
  check(name, !!e && e.view === 'v' && same(e.commands, cmds) && !!m && test(m) && !bad.length, { e, err, bad }); };
const node = (m, id) => m.nodes.find(n => n.id === id), V = m => m.views[0];
try {
  // ---- a read-only embed: none of it in its DOM, and no event
  let h = mount({});
  card('a'); key('F2'); key('Delete'); key('Delete', { shiftKey: true }); key('l'); key('n');
  check('read-only: no panels, palette, properties, problems, outline, handle, picker or add button, and no event',
    !pick('.um-editor') && !pick('.um-handle') && !pick('.um-pick') && !pick('.um-rename') && !pick('[data-z="add"]') && !sr.textContent.includes('Palette') && ed.length === 0 && ch.length === 0, [ed, ch]);
  h.destroy();

  // ---- a map view of the same model keeps today's change events, and no panels
  h = mount({ editable: true }, MODEL, 'm');
  card('a'); key('F2'); pick('.um-rename').value = 'A2'; key('Enter', {}, pick('.um-rename'));
  check('a map view: no panels, and F2 emits today\'s change, no edit', !pick('.um-editor') && ed.length === 0 && ch.length === 1 && ch[0].op === 'rename', [ed, ch]);
  h.destroy();

  h = mount({ editable: true });
  check('a typed view: the panels, each named', !!pick('.um-editor[aria-label]') && ['Palette', 'Properties', 'Problems', 'Elements'].every(n => !!pick(`.um-editor section[aria-label="${n}"]`)));

  // ---- rename: F2, then Enter; a double-click on a selected card's name opens the same field
  card('a'); key('F2');
  check('F2 opens a field holding the name', pick('.um-rename') && pick('.um-rename').value === 'Alpha');
  pick('.um-rename').value = 'Alpha one'; key('Enter', {}, pick('.um-rename'));
  gives('rename: one set of label', [{ op: 'set', id: 'a', path: 'label', value: 'Alpha one' }], m => node(m, 'a').label === 'Alpha one');
  check('nothing is drawn until the host updates (E12)', pick('.node[data-id="a"] .n-label').textContent.includes('Alpha') && !pick('.node[data-id="a"] .n-label').textContent.includes('one'));
  check('no change event on a typed view', ch.length === 0, ch);
  pick('.node[data-id="a"] .n-label').dispatchEvent(new MouseEvent('dblclick', { bubbles: true, composed: true }));
  check('a double-click on the selected card\'s name opens the field', !!pick('.um-rename')); key('Escape', {}, pick('.um-rename'));

  // ---- drag: the card's pin; Alt + arrows by keyboard
  card('c'); key('ArrowDown', { altKey: true });
  gives('Alt + ↓ sets the card\'s pin a row down', [{ op: 'set', view: 'v', path: ['layout', 'c'], value: [1, 2] }], m => same(V(m).layout.c, [1, 2]) && same(V(m).layout.a, [0, 0]));
  key('ArrowRight', { altKey: true });
  gives('Alt + → a column right', [{ op: 'set', view: 'v', path: ['layout', 'c'], value: [2, 1] }], m => same(V(m).layout.c, [2, 1]));
  const n0 = ed.length, to = [centre('.node[data-id="d"] .n-body')[0], centre('.node[data-id="b"] .n-body')[1]], from = centre('.node[data-id="c"] .n-body');
  ptr(pick('.node[data-id="c"]'), 'pointerdown', from); for (let i = 1; i <= 4; i++) ptr(stage, 'pointermove', [from[0] + (to[0] - from[0]) * i / 4, from[1] + (to[1] - from[1]) * i / 4]); ptr(stage, 'pointerup', to);
  check('a drag is one transaction', ed.length === n0 + 1, ed.length - n0);
  gives('a drag to the empty slot in d\'s column and b\'s row: the pin [2, 0]', [{ op: 'set', view: 'v', path: ['layout', 'c'], value: [2, 0] }], m => same(V(m).layout.c, [2, 0]));

  // ---- Delete hides from this view, Shift + Delete deletes from the model; a selection is one transaction (E2, E5)
  card('c'); key('Delete');
  gives('Delete: hide from this view', [{ op: 'hide', id: 'c', view: 'v' }], m => !V(m).nodeIds.includes('c') && !!node(m, 'c') && !V(m).layout.c);
  key('Delete', { shiftKey: true });
  gives('Shift + Delete: delete from the model, with its lines', [{ op: 'delete', id: 'c' }], m => !node(m, 'c') && !m.edges.some(e => e.id === 'cd'));
  card('b'); click('.node[data-id="c"] .n-label', { shiftKey: true }); key('Delete');
  gives('Delete with two cards selected: one transaction', [{ op: 'hide', id: 'b', view: 'v' }, { op: 'hide', id: 'c', view: 'v' }], m => same(V(m).nodeIds, ['a', 'd']));
  card('d'); button('Remove from view').click();
  gives('Remove from view, in the properties panel', [{ op: 'hide', id: 'd', view: 'v' }], m => !V(m).nodeIds.includes('d'));
  button('Delete from model').click();
  gives('Delete from model, in the properties panel', [{ op: 'delete', id: 'd' }], m => !node(m, 'd'));

  // ---- connect by keyboard: L, arrows or a name, Enter; then the relationship picker, by arrows and Enter
  card('a'); key('l'); key('g');
  check('L then a name picks the other end', !!pick('.node.um-target[data-id="c"]') && h.state.gesture === 'connecting');
  key('ArrowUp'); key('ArrowDown');
  check('arrows move the other end', !!pick('.node.um-target'));
  key('g'); key('Enter');
  const menu = pick('.um-pick[role="menu"]');
  check('Enter opens the relationship picker with the type\'s lines', !!menu && same(all('.um-pick button').map(b => b.textContent), ['Uses', 'Owns']) && sr.activeElement === menu.querySelector('button'));
  key('ArrowDown', {}, sr.activeElement); key('Enter', {}, sr.activeElement);
  gives('the picker\'s choice: one add of a line of that type, shown in the view', [{ op: 'add', element: { id: 'owns1', type: 'test.Owns', from: 'a', to: 'c' }, view: 'v' }],
    m => m.edges.some(e => e.id === 'owns1' && e.type === 'test.Owns' && e.from === 'a' && e.to === 'c'));
  check('the picker closes', !pick('.um-pick') && !pick('.um-target'));
  card('a'); key('l'); key('d'); key('Escape');
  check('Escape stops a keyboard connect, with no event', ed.length && last().commands[0].element && last().commands[0].element.id === 'owns1' && h.state.gesture === 'idle' && !pick('.um-target'));
  // by pointer: the handle dragged to a card, then a click in the picker
  card('a');
  const hp = centre('.um-handle circle'); ptr(pick('.um-handle circle'), 'pointerdown', hp); ptr(stage, 'pointermove', centre('.node[data-id="d"] .n-label')); ptr(stage, 'pointerup', centre('.node[data-id="d"] .n-label'));
  click('.um-pick button'); // a press, then a click: the press ends the click a drag leaves behind
  gives('the handle dragged to a card, then Uses', [{ op: 'add', element: { id: 'uses1', type: 'test.Uses', from: 'a', to: 'd' }, view: 'v' }], m => m.edges.some(e => e.id === 'uses1'));

  // ---- palette: the type's elements; N adds the first
  check('the palette lists the type\'s elements', same(all('.um-editor .um-pal button').map(b => b.textContent), ['Box', 'Note']));
  button('Note').click(); pick('.um-rename').value = 'Memo'; key('Enter', {}, pick('.um-rename'));
  gives('a palette entry, named: one add, shown in the view', [{ op: 'add', element: { id: 'note1', type: 'test.Note', label: 'Memo' }, view: 'v' }], m => !!node(m, 'note1') && V(m).nodeIds.includes('note1'));
  key('n'); pick('.um-rename').value = 'Crate'; key('Enter', {}, pick('.um-rename'));
  gives('N adds the palette\'s first element', [{ op: 'add', element: { id: 'box1', type: 'test.Box', label: 'Crate' }, view: 'v' }], m => node(m, 'box1').type === 'test.Box');
  button('Note').focus(); key('Enter', {}, button('Note'));
  check('Enter on a palette entry opens its name field', !!pick('.um-rename')); key('Escape', {}, pick('.um-rename'));

  // ---- properties: built from the type's schema; one transaction per committed field
  card('a');
  const f = s => panel(`.um-props [data-f="${s}"]`);
  check('the properties of a Box: its name and the schema\'s fields', f('label').value === 'Alpha' && f('p:owner').value === 'x' && f('p:abstract').type === 'checkbox' && f('p:tier').tagName === 'SELECT');
  f('p:owner').value = 'y'; key('Enter', {}, f('p:owner')); f('p:owner').dispatchEvent(new Event('change', { bubbles: true }));
  gives('a text field, Enter: one set of props.owner (and the change after it adds nothing)', [{ op: 'set', id: 'a', path: 'props.owner', value: 'y' }], m => node(m, 'a').props.owner === 'y');
  check('one event for one field', ed.filter(e => e.commands[0].path === 'props.owner').length === 1);
  f('label').value = 'Alef'; f('label').dispatchEvent(new Event('change', { bubbles: true }));
  gives('the name field, committed by a blur alone (its change event): set label', [{ op: 'set', id: 'a', path: 'label', value: 'Alef' }], m => node(m, 'a').label === 'Alef');
  let n1 = ed.length; f('label').value = '  '; key('Enter', {}, f('label'));
  check('an empty name does nothing, and the field shows the name again', ed.length === n1 && f('label').value === 'Alef', [ed.length - n1, f('label').value]);
  f('p:owner').value = 'typed'; key('Escape', {}, f('p:owner')); f('p:owner').dispatchEvent(new Event('change', { bubbles: true }));
  check('Escape in a field puts its value back, and the blur after it emits nothing', ed.length === n1 && f('p:owner').value === 'y', [ed.length - n1, f('p:owner').value]);
  f('p:abstract').click();
  gives('a bool: set to true', [{ op: 'set', id: 'a', path: 'props.abstract', value: true }], m => node(m, 'a').props.abstract === true);
  f('p:tier').value = 'gold'; f('p:tier').dispatchEvent(new Event('change', { bubbles: true }));
  gives('an enum: set to the option', [{ op: 'set', id: 'a', path: 'props.tier', value: 'gold' }], m => node(m, 'a').props.tier === 'gold');
  card('d');
  check('an element with no schema: its name, and its props to read, escaped', !!f('label') && !f('p:text') && panel('.um-props dl').textContent.includes('hi <b>') && !panel('.um-props dl b'));

  // ---- member rows: set, add, move
  card('a');
  f('m:a1').value = 'uno'; key('Enter', {}, f('m:a1'));
  gives('a member row: set its label', [{ op: 'set', id: 'a1', path: 'label', value: 'uno' }], m => node(m, 'a').members[0].label === 'uno');
  key('ArrowDown', { altKey: true }, f('m:a1'));
  gives('Alt + ↓ on a member row: move it down', [{ op: 'move', id: 'a1', index: 1 }], m => same(node(m, 'a').members.map(x => x.id), ['a2', 'a1', 'a3']));
  panel('[data-up="a2"]').click();
  gives('↑ on a member row: move it up', [{ op: 'move', id: 'a2', index: 0 }], m => same(node(m, 'a').members.map(x => x.id), ['a2', 'a1', 'a3']));
  panel('[data-down="a1"]').click();
  gives('↓ on a member row: move it down', [{ op: 'move', id: 'a1', index: 1 }], m => same(node(m, 'a').members.map(x => x.id), ['a2', 'a1', 'a3']));
  n1 = ed.length; f('m:a2').value = ''; key('Enter', {}, f('m:a2'));
  check('an empty member name does nothing', ed.length === n1 && f('m:a2').value === 'two', f('m:a2').value);
  f('new').value = 'four'; key('Enter', {}, f('new'));
  gives('the new member row: an add with the owner, typed as the last member', [{ op: 'add', element: { id: 'member1', label: 'four' }, owner: 'a' }], m => node(m, 'a').members[3].label === 'four');

  // ---- problems: this view's, each selecting its element
  const probs = all('.um-editor .um-probs button');
  check('problems: the view\'s elements only (the untyped member, not the orphan)', probs.length === 1 && probs[0].textContent.includes('type') && !panel('.um-probs').textContent.includes('Orphan'), probs.map(b => b.textContent));
  card('b'); key('Enter', {}, probs[0]);
  check('Enter on a problem selects its element (a member: its card)', h.selection && h.selection.id === 'a', h.selection);

  // ---- outline: every element, "in no diagram", show here, delete (M5)
  const rows = () => all('.um-editor .um-els [data-go]').map(b => b.dataset.go);
  check('the outline lists every node and line', same(rows(), ['a', 'b', 'c', 'd', 'z', 'ab', 'cd']), rows());
  panel('[data-orphans]').click();
  check('"In no diagram" leaves the orphan', same(rows(), ['z']), rows());
  key('Enter', {}, panel('[data-show="z"]'));
  gives('Show here: the view\'s nodeIds with it', [{ op: 'set', view: 'v', path: 'nodeIds', value: ['a', 'b', 'c', 'd', 'z'] }], m => V(m).nodeIds.includes('z'));
  key('Enter', {}, panel('[data-del="z"]'));
  gives('✕ in the outline, by Enter: delete from the model', [{ op: 'delete', id: 'z' }], m => !node(m, 'z'));

  // ---- the host applies: the panels follow update()
  const next = apply(MODEL, [{ op: 'set', id: 'a', path: 'label', value: 'Aleph' }]);
  card('a'); h.update(next);
  check('after update() the picture and the panel show the host\'s model', pick('.node[data-id="a"] .n-label').textContent.includes('Aleph') && f('label').value === 'Aleph');
  h.destroy();

  // ---- a type this release does not draw: core.Node and core.Line, no picker. Its view lists its lines, one its own
  const U = structuredClone(MODEL); U.views[0].diagram = 'uml.class'; U.views[0].edges = ['ab', 'cd', { id: 'loc', type: 'core.Line', from: 'a', to: 'c' }];
  check('the models the tests start from have no error', !errors(MODEL).length && !errors(U).length, [errors(MODEL), errors(U)]);
  h = mount({ editable: true }, U);
  check('an unregistered type: the panels, with one generic palette entry', !!pick('.um-editor') && same(all('.um-editor .um-pal button').map(b => b.textContent), ['Node']));
  card('a'); key('l'); key('b'); key('Enter');
  check('an unregistered type connects with no picker', !pick('.um-pick'));
  gives('a core.Line, listed in the view\'s lines', [{ op: 'add', element: { id: 'line1', type: 'core.Line', from: 'a', to: 'b' }, view: 'v' }], m => m.views[0].edges.includes('line1'), U);
  key('n'); pick('.um-rename').value = 'Thing'; key('Enter', {}, pick('.um-rename'));
  gives('N adds a core.Node', [{ op: 'add', element: { id: 'node1', type: 'core.Node', label: 'Thing' }, view: 'v' }], m => m.views[0].nodeIds.includes('node1'), U);
  check('its properties: the name, and the props to read', !!f('label') && !f('p:owner') && panel('.um-props dl').textContent.includes('owner'));
  check('the outline lists a line of one view only, saying so, with no Show', all('.um-editor .um-els [data-go]').some(b => b.dataset.go === 'loc' && b.textContent.includes('only in v')) && !panel('[data-show="loc"]'));
  h.select({ type: 'edge', ids: ['loc'], view: 'v' }); key('Delete');
  gives('Delete on a line of this view only: delete', [{ op: 'delete', id: 'loc' }], m => !m.views[0].edges.some(e => e.id === 'loc'), U);
  h.select({ type: 'edge', ids: ['ab'], view: 'v' }); key('Delete');
  gives('Delete on a listed model line: hide it from the view', [{ op: 'hide', id: 'ab', view: 'v' }], m => !m.views[0].edges.includes('ab') && m.edges.some(e => e.id === 'ab'), U);
  h.destroy();

  // ---- the editable flags: a control the host does not offer is not there, or is shown disabled
  h = mount({ editable: { move: true } });
  card('a');
  check('editable: { move }: no palette, handle, ↑ ↓, new member, Remove, Delete, Show or ✕; the fields shown disabled',
    panel('.um-pal').hidden && !all('.um-editor .um-pal button').length && !pick('.um-handle') && !panel('[data-up], [data-down], [data-new], [data-hide], [data-kill], [data-show], [data-del]')
    && all('.um-editor .um-props input, .um-editor .um-props select').every(x => x.disabled));
  key('F2'); key('Delete'); key('l'); key('n');
  check('…and its keys emit nothing but a pin', !pick('.um-rename') && ed.length === 0 && (key('ArrowDown', { altKey: true }), ed.length === 1 && last().commands[0].path[0] === 'layout'), ed);
  h.destroy();

  // ---- a type that is not a string, in a node and a member, does not break the panels
  const W = structuredClone(MODEL); W.nodes.push({ id: 'q', type: 7, label: 'Seven', members: [{ id: 'q1', type: { x: 1 }, label: 'm' }] }); W.views[0].nodeIds.push('q');
  h = mount({ editable: true }, W);
  card('q');
  check('a node whose type is 7: it draws, its properties and the outline show it', !!pick('.node[data-id="q"]') && f('label').value === 'Seven' && all('.um-editor .um-els [data-go]').some(b => b.dataset.go === 'q'));
  f('new').value = 'next'; key('Enter', {}, f('new'));
  check('a member added after one whose type is an object: no type copied', same(last().commands, [{ op: 'add', element: { id: 'member1', label: 'next' }, owner: 'q' }]), last());
  h.destroy();

  // ---- boxes (2.1): a test type whose boxes are the shown packages that own something shown (their nearest shown owner)
  const ownIn = (m, v, n) => { let p = n.parent; for (let k = 0; p != null && !v.nodeIds.includes(p) && k < 64; k++) p = (m.nodes.find(x => x.id === p) || {}).parent; return p ?? null; };
  const nestBoxes = (m, v) => { const ns = m.nodes.filter(n => v.nodeIds.includes(n.id)), isBox = n => ns.some(k => ownIn(m, v, k) === n.id);
    return ns.filter(isBox).map(p => ({ id: p.id, label: p.label, title: p.label, nodeIds: ns.filter(n => ownIn(m, v, n) === p.id && !isBox(n)).map(n => n.id), ...(ownIn(m, v, p) != null ? { parent: ownIn(m, v, p) } : {}), shape: 'test-frame' })); };
  // a box drawn by its shape's frame, which draws its border with class family-box, as svg.js asks
  SHAPE['test-frame'] = { frame: f => `<rect class="family-box" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" stroke="var(--um-muted)"/><text class="family-title" x="${f.x + 12}" y="${f.y + 18}" data-t="ft" data-o="${f.id}">${f.title}</text>` };
  registerDiagramType('test.nest', { title: 'nested boxes', elements: [{ type: 'test.Box', label: 'Box' }], lines: [{ type: 'test.Uses', label: 'Uses' }],

  const asked6 = []; TYPED.fields = (mm, x) => { asked6.push(x.id); return x.id === 'a' ? TAGS : x.id === 'd' ? [{ key: 'p:note:by', path: ['tags', 'note', 'by'], label: '«note» by', kind: 'text' }, null, { label: 'no key' }] : null; };
  h = mount({ editable: true }); card('a');
  const fs = () => all('.um-editor .um-props [data-f]').map(x => x.dataset.f).filter(k => k.startsWith('p:') || k === 'label');
  check('TYPED.fields: asked with the model and the element; its fields after the type\'s own', asked6.includes('a') && same(fs(), ['label', 'p:owner', 'p:abstract', 'p:tier', 'p:p:entity:table', 'p:p:entity:indexed']) && f('p:p:entity:table').closest('label').textContent === '«entity» table', [asked6, fs()]);
  f('p:p:entity:table').value = 'orders'; key('Enter', {}, f('p:p:entity:table'));
  gives('a slot\'s text field: one set of its path, the tags and stereotype objects made on the way', [{ op: 'set', id: 'a', path: ['props', 'tags', 'entity', 'table'], value: 'orders' }], m => node(m, 'a').props.tags.entity.table === 'orders' && node(m, 'a').props.owner === 'x');
  const T1 = apply(MODEL, last().commands); h.update(T1);
  check('…the field shows the value the host hands back', f('p:p:entity:table').value === 'orders');
  f('p:p:entity:indexed').value = 'true'; f('p:p:entity:indexed').dispatchEvent(new Event('change', { bubbles: true }));
  gives('a slot\'s enum field: set to the option', [{ op: 'set', id: 'a', path: ['props', 'tags', 'entity', 'indexed'], value: 'true' }], m => same(node(m, 'a').props.tags, { entity: { table: 'orders', indexed: 'true' } }), T1);
  f('p:p:entity:table').value = ''; key('Enter', {}, f('p:p:entity:table'));
  gives('a slot\'s field emptied: its value removed', [{ op: 'set', id: 'a', path: ['props', 'tags', 'entity', 'table'], value: undefined }], m => same(node(m, 'a').props.tags, { entity: {} }), T1);
  card('d');
  check('an element with no schema: the slot\'s fields (entries with no key left out), and its props to read as before', same(fs(), ['label', 'p:p:note:by']) && panel('.um-props dl').textContent.includes('hi <b>'), fs());
  card('b');
  check('an element the slot gives nothing: the type\'s fields alone', same(fs(), ['label', 'p:owner', 'p:abstract', 'p:tier']), fs());
  delete TYPED.fields; card('c'); card('a');
  check('the slot empty: the panel as before', same(fs(), ['label', 'p:owner', 'p:abstract', 'p:tier']), fs());
  h.destroy();

  // ---- a large model: an editable update() costs about what a read-only one does (risks.md P1)
  const BIG = { schemaVersion: 2, nodes: Array.from({ length: 2000 }, (_, i) => ({ id: 'n' + i, type: 'Bad', label: 'Node ' + i })), edges: [],
    views: [{ id: 'v', diagram: 'test.box', nodeIds: Array.from({ length: 40 }, (_, i) => 'n' + i) }] };
  const timed = opts => { const hh = mount(opts, BIG), m2 = structuredClone(BIG); m2.nodes[0].label = 'First'; const t0 = performance.now(); hh.update(m2); const t = performance.now() - t0; hh.destroy(); return t; };
  const ro = timed({}), rw = timed({ editable: true });
  check(`2000 nodes with 2000 warnings: an editable update() (${rw.toFixed(0)} ms) within 4 times a read-only one (${ro.toFixed(0)} ms) and 100 ms`, rw < ro * 4 + 100, [ro, rw]);
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
