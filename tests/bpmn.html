<!doctype html>
<!-- The BPMN diagram (4b.3, notes/milestone-4b.md §3 to §8, §11) in headless Chrome (tests/embed.py), from lib/umlimator-all.js:
     examples/bookshop-order-to-shipment.json drawn by render() in both themes, three fonts and both directions (no overlap, every
     task's text inside it, the names of events, gateways and data outside their shapes clear of the nodes and each other,
     every line end on its shape's outline, a boundary event's on its circle, a message flow's to a pool on the pool's
     border, every node in its lane's band, names, reading order, the legend, contrast, axe's rules written out); then
     edited by pointer and keyboard through the type's hooks (src/typed/edit.js), each through the edit event and apply():
     N, the palette into the selected lane, a gateway with no name field, L and the handle (the kind by the ends, no picker;
     one BPMN forbids refused on the hint line), F2 on a flow and on a lane, the Task type and Documentation fields, Alt +
     arrows and A on a boundary event, X on a sub-process, a drag into another lane, Delete on a lane (deleted, said), on a
     task (hidden), Shift + Delete on a task (its boundary event with it) and on a pool (counted).
     tests/bpmn.test.mjs lays the same example out in Node. -->
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<title>umlimator BPMN diagram test</title>
<body style="margin:0">
<div id="m" style="width:1700px;height:1200px"></div>
<script type="module">
import { render, apply, validate, layout } from '../lib/umlimator-all.js';
const out = { ok: [], fail: [] };
const check = (name, cond, info) => { document.title = name; if (cond) out.ok.push(name); else out.fail.push(name + (info === undefined ? '' : ': ' + JSON.stringify(info))); };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const el = document.getElementById('m'), VID = 'order-to-shipment';
let sr, stage, ed = [];
const pick = s => sr.querySelector(s), all = s => [...sr.querySelectorAll(s)];
const centre = s => { const r = pick(s).getBoundingClientRect(); return [r.x + r.width / 2, r.y + r.height / 2]; };
const ptr = (target, type, [x, y], extra = {}) => target.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, pointerId: 7, pointerType: 'mouse', bubbles: true, composed: true, ...extra }));
const key = (k, extra = {}, target = stage) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true, ...extra }));
const handleTo = ([x, y]) => { const c = pick('.um-handle circle'), r = c.getBoundingClientRect(); ptr(c, 'pointerdown', [r.x + r.width / 2, r.y + r.height / 2]); ptr(stage, 'pointermove', [x, y]); ptr(stage, 'pointerup', [x, y]); };
const click = s => { const g = pick(s), at = centre(s); ptr(g, 'pointerdown', at); ptr(g, 'pointerup', at); g.dispatchEvent(new MouseEvent('click', { clientX: at[0], clientY: at[1], bubbles: true, composed: true })); };
const drag = (s, to) => { const g = pick(s), from = centre(s); ptr(g, 'pointerdown', from); for (let i = 1; i <= 4; i++) ptr(stage, 'pointermove', [from[0] + (to[0] - from[0]) * i / 4, from[1] + (to[1] - from[1]) * i / 4]); ptr(stage, 'pointerup', to); };
const type = t => { const f = pick('.um-rename'); f.value = t; key('Enter', {}, f); };
const hint = () => pick('.um-live').textContent;
const mount = (model, opts = {}) => { el.innerHTML = ''; ed = []; const h = render(el, model, { view: VID, on: { edit: e => ed.push(e) }, ...opts }); sr = el.querySelector('.umlimator').shadowRoot; stage = pick('.stage'); return h; };
const errors = m => validate(m).filter(p => p.level === 'error');
const last = () => ed[ed.length - 1];
const gives = (name, cmds, test, base) => { const e = last(); let m = null; try { m = e && apply(base, e.commands); } catch (x) { m = null; }
  check(name, !!e && (cmds == null || same(e.commands, cmds)) && !!m && test(m) && !errors(m).length, [e && e.commands, m && errors(m)]); return m; };
const change = (t, v) => { if (t.type === 'checkbox') t.checked = v; else t.value = v; t.dispatchEvent(new Event('change', { bubbles: true })); };
const box = g => { const r = g.getBBox(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
const meets = (a, b) => a.x < b.x + b.w - .5 && b.x < a.x + a.w - .5 && a.y < b.y + b.h - .5 && b.y < a.y + a.h - .5;
const inside = (a, b, k = .5) => a.x >= b.x - k && a.y >= b.y - k && a.x + a.w <= b.x + b.w + k && a.y + a.h <= b.y + b.h + k;
const pt = (svg, x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p; };
const FONTS = { serif: 'serif', sans: 'sans-serif', wide: 'monospace' };
const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0] / 255, p[1] / 255, p[2] / 255, p.length > 3 ? p[3] : 1]; }
  m = /color\(srgb ([^)]+)\)/.exec(s); if (m) { const p = m[1].split(/[ /]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; } return null; };
const blend = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (fg, bg) => { const [x, y] = [lum(blend(fg, bg)), lum(bg)].sort((p, q) => q - p); return +((x + 0.05) / (y + 0.05)).toFixed(2); };
const css = (e, k) => rgba(getComputedStyle(e)[k]);
const EX = await (await fetch('../examples/bookshop-order-to-shipment.json')).json();
const dir = d => ({ ...EX, views: EX.views.map(v => ({ ...v, direction: d })) });
const LANE = { 'bp-sales': ['order-received', 'bp-take-payment', 'paid', 'not-paid', 'cancel-order', 'order-cancelled', 'fork', 'send-invoice', 'shipping-notice', 'order-shipped', 'bp-order', 'note-card'],
  'bp-warehouse': ['pick-pack', 'bp-join', 'courier-pickup', 'bp-ship', 'bp-stock'], 'bp-shopper': ['basket-ready', 'place-order', 'order-placed'] };
const SHAPES = ['bpmn-task', 'bpmn-event', 'bpmn-gateway', 'bpmn-data', 'bpmn-store', 'bpmn-note'];
try {
  check('the example validates clean', same(validate(EX), []), validate(EX));
  const widths = {};
  for (const theme of ['light', 'dark']) for (const [fname, family] of Object.entries(FONTS)) for (const d of ['right', 'down']) {
    document.documentElement.dataset.theme = theme; el.style.setProperty('--um-sans', family);
    const tag = `${theme}, ${fname}, ${d}`, h = mount(dir(d), { legend: true }), svg = pick('.stage svg'), bad = [];
    const nodes = all(SHAPES.map(s => `.node.${s}`).join(', ')), B = new Map(nodes.map(g => [g.dataset.id, box(g.querySelector(g.classList.contains('bpmn-note') ? '.bp-hit' : '.n-body'))]));
    if (d === 'right') widths[fname] = B.get('bp-take-payment').w;
    check(`${tag}: 21 shapes, 3 pools, 2 lanes, a group and 26 lines drawn`, nodes.length === 21 && all('.node.bpmn-pool').length === 3 && all('.node.bpmn-lane').length === 2 && all('.node.bpmn-group').length === 1 && all('.edge-g').length === 26,
      [nodes.length, all('.edge-g').length]);
    const ids = [...B.keys()];
    ids.forEach((a, i) => ids.slice(i + 1).forEach(b => { if (meets(B.get(a), B.get(b)) && !(a === 'payment-timeout' && b === 'bp-take-payment') && !(b === 'payment-timeout' && a === 'bp-take-payment')) bad.push(`${a} and ${b} overlap`); }));
    all('.node.bpmn-task, .node.bpmn-note').forEach(g => g.querySelectorAll('text').forEach(t => { if (!inside(box(t), B.get(g.dataset.id))) bad.push(`${g.dataset.id}: "${t.textContent}" spills`); }));
    // every node in its lane's band, past the band's header strip
    const band = id => box(pick(`.bz-pools rect[data-o="${id}"]`));
    Object.entries(LANE).forEach(([l, list]) => list.forEach(id => { if (!inside(B.get(id), band(l))) bad.push(`${id} is out of ${l}'s band`); }));
    check(`${tag}: no overlap, every text inside its shape, every node in its lane's band`, !bad.length, bad.slice(0, 8));
    // the names outside: 11, each two lines of 120 px at most, clear of the shapes and each other
    const labs = all('.bp-label'), clash = [];
    labs.forEach((L, i) => { const b = box(L), ts = [...L.querySelectorAll('text')];
      if (ts.length > 2 || ts.some(t => t.getComputedTextLength() > 120.5)) clash.push(`${L.dataset.o}: ${ts.length} lines`);
      B.forEach((n, id) => { if (meets(b, n)) clash.push(`${L.dataset.o} meets ${id}`); }); labs.slice(i + 1).forEach(M => { if (meets(b, box(M))) clash.push(`${L.dataset.o} meets ${M.dataset.o}`); }); });
    check(`${tag}: 11 names outside their shapes, clear of the shapes and each other`, labs.length === 11 && !clash.length, clash.slice(0, 6));
    // each line's ends on its shape's outline (a boundary event's circle; a pool's border for a message flow to a pool)
    const off = [];
    all('.edge-g').forEach(g => { const p = g.querySelector('path.edge'), L = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(L);
      [[g.dataset.from, a], [g.dataset.to, b]].forEach(([id, q]) => { const body = pick(`.node[data-id="${id}"].bpmn-note .bp-hit`) || pick(`.node[data-id="${id}"] .n-body`) || pick(`.bz-pools rect[data-o="${id}"]`);
        if (!body) { off.push(`${id}: no outline`); return; } const was = body.style.strokeWidth; body.style.strokeWidth = '3px';
        if (!body.isPointInStroke(pt(svg, q.x, q.y))) off.push(`${g.dataset.from}>${g.dataset.to} off ${id} at ${Math.round(q.x)},${Math.round(q.y)}`); body.style.strokeWidth = was; }); });
    check(`${tag}: every line's ends on their outlines, a boundary event's on its circle, a message flow's to a pool on its border`, !off.length, off.slice(0, 6));
    check(`${tag}: the boundary event a circle on take-payment's border`, (() => { const c = B.get('payment-timeout'), t = B.get('bp-take-payment'), cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      return d === 'right' ? Math.abs(cy - (t.y + t.h)) < 1 : Math.abs(cx - (t.x + t.w)) < 1; })());
    check(`${tag}: names a screen reader reads`, pick('.node[data-id="payment-timeout"]').getAttribute('aria-label') === 'Timer boundary event No answer in 2 minutes, on Take payment'
      && pick('.node[data-id="bp-bookshop"]').getAttribute('aria-label') === 'Pool Bookshop, 2 lanes, 16 elements' && pick('.node[data-id="paid"]').getAttribute('aria-label') === 'Exclusive gateway Paid?, in Sales'
      && pick('.edge-g[data-from="bp-take-payment"][data-to="bp-payment-provider"] title').textContent === 'Message flow from Take payment to Payment provider, named Charge request');
    const keys = all('.keys .um-key').map(k => k.dataset.node || k.dataset.edge), order = layout(dir(d), VID).order;
    check(`${tag}: a key for every element and line, in reading order`, keys.length === order.length && same(all('.keys .node-key').map(k => k.dataset.node), order.filter(id => !keys.includes(id) ? false : all('.keys .node-key').some(k => k.dataset.node === id))), [keys.length, order.length]);
    check(`${tag}: the legend keys each line kind drawn`, same(all('.m-legend b').map(b => b.textContent), ['Sequence flow', 'Message flow', 'Association', 'Data association']), all('.m-legend b').map(b => b.textContent));
    const bg = css(pick('.stage'), 'backgroundColor'), low = [];
    all('.node text, .bp-label text').forEach(t => { const c = ratio(css(t, 'fill'), bg); if (c < 4.5) low.push([t.textContent, c]); });
    all('.node .n-body, .edge-g path.edge, .bz-pools rect').forEach(b => { const c = ratio(css(b, 'stroke'), bg); if (c < 3) low.push([b.getAttribute('class'), c]); });
    check(`${tag}: contrast: texts 4.5:1, outlines, borders and lines 3:1`, !low.length, low.slice(0, 4));
    // axe-core 4.14's rules for what is drawn as role="img", written out: svg-img-alt and role-img-alt, nested-interactive
    const imgs = all('.stage svg [role="img"]'), noAlt = [], nested = [];
    imgs.forEach(x => { if (!(x.getAttribute('aria-label') || '').trim()) noAlt.push(x.dataset.id || x.localName);
      x.querySelectorAll('[tabindex], a[href], button, input, select, textarea').forEach(c => { if (c.tabIndex >= 0) nested.push(x.dataset.id); }); });
    check(`${tag}: axe, written out: the drawing a named group, its elements named images with no tab stop inside`, svg.getAttribute('role') === 'group' && !!(svg.getAttribute('aria-label') || '').trim() && imgs.length >= 27 && !noAlt.length && !nested.length, [imgs.length, noAlt, nested]);
    h.destroy();
  }
  check('the three fonts measure differently', new Set(Object.values(widths)).size >= 2, widths);
  document.documentElement.dataset.theme = 'light'; el.style.removeProperty('--um-sans');

  // ---- editing (DoD 4): each gesture's commands applied with apply(), none bringing an error
  const BASE = structuredClone(EX);
  let h = mount(BASE, { editable: true });
  check('the palette: row 24\'s 22 entries, one line entry', all('.um-editor .um-pal button').length === 22 && /Lines: Flow \(sequence, message, association or data association, by its ends\)/.test(pick('.um-editor .um-pal .um-note').textContent), all('.um-editor .um-pal button').length);
  key('n'); type('Courier');
  gives('N adds a pool, named', [{ op: 'add', element: { id: 'courier', type: 'bpmn.Participant', label: 'Courier' }, view: VID }], m => m.views[0].nodeIds.includes('courier'), BASE);
  click('.node[data-id="bp-warehouse"] text'); all('.um-editor .um-pal button').find(b => b.textContent === 'Task').click(); type('Gift wrap');
  gives('the palette\'s Task with a lane selected: in that lane', [{ op: 'add', element: { id: 'gift-wrap', type: 'bpmn.Task', label: 'Gift wrap', parent: 'bp-warehouse' }, view: VID }], m => m.nodes.some(n => n.id === 'gift-wrap'), BASE);
  click('.node[data-id="bp-warehouse"] text'); all('.um-editor .um-pal button').find(b => b.textContent === 'Exclusive gateway').click();
  gives('the palette\'s Exclusive gateway: added with no name field, in the lane', [{ op: 'add', element: { id: 'exclusive-gateway', type: 'bpmn.ExclusiveGateway', parent: 'bp-warehouse' }, view: VID }], m => m.nodes.some(n => n.id === 'exclusive-gateway'), BASE);
  click('.node[data-id="send-invoice"] .n-body'); all('.um-editor .um-pal button').find(b => b.textContent === 'Boundary').click();
  gives('the palette\'s Boundary with an activity selected: attached to it', [{ op: 'add', element: { id: 'boundary', type: 'bpmn.BoundaryEvent', props: { definition: 'timer', attachedTo: 'send-invoice' }, parent: 'bp-sales' }, view: VID }],
    m => m.nodes.some(n => n.id === 'boundary'), BASE);
  // L: the kind by the ends, no picker
  click('.node[data-id="cancel-order"] .n-body'); key('l'); for (const c of 'Email invoice') key(c); key('Enter');
  check('L opens no picker of kinds', !pick('.um-pick'));
  gives('L to a task of the pool: a sequence flow', [{ op: 'add', element: { id: 'cancel-order-send-invoice', type: 'bpmn.SequenceFlow', from: 'cancel-order', to: 'send-invoice' }, view: VID }], m => m.edges.some(e => e.id === 'cancel-order-send-invoice'), BASE);
  click('.node[data-id="send-invoice"] .n-body'); key('l'); for (const c of 'Payment provider') key(c); key('Enter');
  gives('L to another pool: a message flow', [{ op: 'add', element: { id: 'send-invoice-bp-payment-provider', type: 'bpmn.MessageFlow', from: 'send-invoice', to: 'bp-payment-provider' }, view: VID }], m => m.edges.some(e => e.type === 'bpmn.MessageFlow' && e.from === 'send-invoice'), BASE);
  const n0 = ed.length; click('.node[data-id="order-placed"] .n-body'); key('l'); for (const c of 'Order received') key(c); key('Enter');
  check('L from an end event to another pool: refused, nothing emitted, its reason on the hint line', ed.length === n0 && hint() === 'A message flow cannot start at an end event', [ed.slice(n0), hint()]);
  click('.node[data-id="bp-take-payment"] .n-body'); handleTo(centre('.node[data-id="bp-order"] .n-body'));
  gives('the handle from a task to a data object: a data association', [{ op: 'add', element: { id: 'bp-take-payment-bp-order', type: 'bpmn.DataAssociation', from: 'bp-take-payment', to: 'bp-order' }, view: VID }], m => m.edges.some(e => e.id === 'bp-take-payment-bp-order'), BASE);
  // F2 on a flow and on a lane
  h.select({ type: 'edge', ids: ['f-cancel'], view: VID }); key('F2'); type('give up');
  gives('F2 on a sequence flow: its name', [{ op: 'set', id: 'f-cancel', path: 'label', value: 'give up' }], m => m.edges.find(e => e.id === 'f-cancel').label === 'give up', BASE);
  click('.node[data-id="bp-sales"] text'); key('F2'); type('Sales desk');
  gives('F2 on a lane: its name', [{ op: 'set', id: 'bp-sales', path: 'label', value: 'Sales desk' }], m => m.nodes.find(n => n.id === 'bp-bookshop').members[0].label === 'Sales desk', BASE);
  // the properties panel
  click('.node[data-id="bp-take-payment"] .n-body'); const tt = pick('.um-editor [data-f="p:taskType"]'); check('the Task type field holds service', !!tt && tt.value === 'service', tt && tt.value);
  if (tt) { change(tt, 'user'); gives('the Task type field sets it', [{ op: 'set', id: 'bp-take-payment', path: 'props.taskType', value: 'user' }], m => m.nodes.find(n => n.id === 'bp-take-payment').props.taskType === 'user', BASE); }
  const doc = pick('.um-editor [data-f="p:documentation"]'); check('a Documentation field on the task', !!doc);
  if (doc) { change(doc, 'Charged once.'); gives('the Documentation field sets it (S2)', [{ op: 'set', id: 'bp-take-payment', path: 'props.documentation', value: 'Charged once.' }], m => m.nodes.find(n => n.id === 'bp-take-payment').props.documentation === 'Charged once.', BASE); }
  // a boundary event: Alt + arrows for its side, A for its activity
  click('.node[data-id="payment-timeout"] .n-body'); key('ArrowUp', { altKey: true });
  gives('Alt + Up on a boundary event: its side, top', [{ op: 'set', view: VID, path: ['present', 'payment-timeout', 'side'], value: 'top' }], m => m.views[0].present['payment-timeout'].side === 'top', BASE);
  click('.node[data-id="payment-timeout"] .n-body'); key('a');
  await new Promise(r => setTimeout(r, 0));
  const opts = all('.um-pick button').map(b => b.textContent);
  check('A on a boundary event: a picker of its pool\'s activities', opts[0] === 'Cancel order' && opts.length === 4, opts);
  if (opts.length) { all('.um-pick button')[0].click(); gives('the activity picked: attachedTo set', [{ op: 'set', id: 'payment-timeout', path: 'props.attachedTo', value: 'cancel-order' }], m => m.nodes.find(n => n.id === 'payment-timeout').props.attachedTo === 'cancel-order', BASE); }
  // X expands the sub-process in the view; E stays the canvas's
  click('.node[data-id="pick-pack"] .n-body'); key('x');
  const open = gives('X on a collapsed sub-process: what it holds added to the view', null, m => m.views[0].nodeIds.includes('pick-books'), BASE);
  if (open) { h.update(open); check('expanded: a box with its title and its four elements', !!pick('.family[data-family="pick-pack"]') && ['picking-starts', 'pick-books', 'pack-parcel', 'parcel-packed'].every(id => pick(`.node[data-id="${id}"]`)));
    h.select({ type: 'container', id: 'pick-pack', view: VID }); key('x'); gives('X again collapses it', null, m => same(m.views[0].nodeIds, EX.views[0].nodeIds), open); h.update(BASE); }
  // a drag into another lane
  const wh = pick('.bz-pools rect[data-o="bp-warehouse"]').getBoundingClientRect();
  drag('.node[data-id="send-invoice"] .n-body', [wh.x + wh.width - 60, wh.y + wh.height - 30]);
  gives('a drag into the warehouse lane: reparented there', [{ op: 'reparent', id: 'send-invoice', parent: 'bp-warehouse' }], m => m.nodes.find(n => n.id === 'send-invoice').parent === 'bp-warehouse', BASE);
  // the Owner field: the lane by keyboard
  click('.node[data-id="send-invoice"] .n-body'); const own = pick('.um-editor [data-f="owner"]');
  check('the Owner field lists the pools, sub-processes and lanes', !!own && [...own.options].map(o => o.textContent).includes('Bookshop::Warehouse'), own && [...own.options].map(o => o.textContent));
  if (own) { change(own, 'bp-warehouse'); gives('the Owner field: another lane', null, m => m.nodes.find(n => n.id === 'send-invoice').parent === 'bp-warehouse', BASE); }
  // Delete and Shift + Delete
  click('.node[data-id="bp-warehouse"] text'); key('Delete');
  gives('Delete on a lane: deleted from the model, what it held kept in the pool', null, m => !m.nodes.find(n => n.id === 'bp-bookshop').members.some(l => l.id === 'bp-warehouse') && m.nodes.find(n => n.id === 'bp-ship').parent === 'bp-bookshop', BASE);
  check('the hint line says a lane is not hidden', /Deleted lane Warehouse from the model: a lane is not hidden from a view/.test(hint()), hint());
  click('.node[data-id="cancel-order"] .n-body'); key('Delete');
  gives('Delete on a task: hidden from the view', [{ op: 'hide', id: 'cancel-order', view: VID }], m => !m.views[0].nodeIds.includes('cancel-order'), BASE);
  click('.node[data-id="bp-take-payment"] .n-body'); key('Delete', { shiftKey: true });
  gives('Shift + Delete on a task: deleted, its boundary event with it', [{ op: 'delete', id: 'bp-take-payment' }], m => !m.nodes.some(n => n.id === 'bp-take-payment' || n.id === 'payment-timeout'), BASE);
  click('.node[data-id="bp-payment-provider"] text'); key('Delete', { shiftKey: true });
  gives('Shift + Delete on a pool: deleted, counted on the hint line', [{ op: 'delete', id: 'bp-payment-provider' }], m => !m.nodes.some(n => n.id === 'bp-payment-provider'), BASE);
  check('the hint line counts what the pool held', /Deleted pool Payment provider and the 0 elements it holds/.test(hint()), hint());
  h.destroy();
} catch (e) { out.fail.push('threw: ' + (e && e.stack || e)); }
const pre = document.createElement('pre'); pre.id = 'result'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
</script>
