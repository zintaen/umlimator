const rgba = s => { let m = /rgba?\(([^)]+)\)/.exec(s);

  return null; };
const over = (top, bot) => { const a = top[3]; return [0, 1, 2].map(i => top[i] * a + bot[i] * (1 - a)).concat(1); };

    const down = []; for (let a = e; a; a = a.parentElement) { down.unshift(a); if (a === piece) break; }
