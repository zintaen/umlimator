# The diff Action (#66): on a pull request, what it changes in umlimator map models, posted on the pull request.
#
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }   # pull-requests: the comment; nothing else is written
#   steps:
#     - uses: actions/checkout@v4
#     - uses: zintaen/umlimator@v0.12.1
#       with:
#         models: "docs/*.json"   # optional: git pathspecs of the model files (default: every .json that is a map model)
#
# For each model file the pull request changes: a page with each change marked (umlimator.py diff), stills of the views
# that show one, and a summary in words with a mermaid sketch, which GitHub draws in the comment, so no picture needs
# hosting. The pages and stills are the run's artifact, which the comment links to. One comment, updated on each push
# (the bot's own: never a person's, even one that starts with the same marker).
# A pull request from a fork gets a read-only token: no comment, and the summary is in the job summary instead.
name: umlimator diff
description: Pictures what a pull request changes in umlimator map models, and posts it on the pull request.
branding:
  icon: map
  color: blue
inputs:
  models:
    description: Git pathspecs of the model files, separated by spaces (default every .json that is a map model)
    default: "*.json"
  comment:
    description: Post one comment on the pull request with the summary, and update it on later pushes
    default: "true"
  github-token:
    description: The token that posts the comment (pull-requests write)
    default: ${{ github.token }}
outputs:
  changed:
    description: How many model files the pull request changes on the map
    value: ${{ steps.diff.outputs.changed }}
  summary:
    description: The summary, as a Markdown file
    value: ${{ steps.diff.outputs.summary }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        MODELS: ${{ inputs.models }}
        OUT: ${{ runner.temp }}/umlimator-diff
      run: |
        set -f   # the pathspecs are git's to match, not the shell's
        # a pull request's checkout is its merge commit, whose first parent is the base branch as it is now
        git rev-parse -q --verify HEAD^1 > /dev/null || git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
        python3 "$GITHUB_ACTION_PATH/umlimator.py" diff --base HEAD^1 --out "$OUT" --models $MODELS > "$OUT.json"
        echo "changed=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' "$OUT.json")" >> "$GITHUB_OUTPUT"
        echo "summary=$OUT/summary.md" >> "$GITHUB_OUTPUT"
    - id: pictures
      if: steps.diff.outputs.changed != '0'
      uses: actions/upload-artifact@v4
      with:
        name: umlimator-diff
        path: ${{ runner.temp }}/umlimator-diff
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT: ${{ inputs.comment }}
        CHANGED: ${{ steps.diff.outputs.changed }}
        SUMMARY: ${{ steps.diff.outputs.summary }}
        PICTURES: ${{ steps.pictures.outputs.artifact-url }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if [ -n "$PICTURES" ]; then printf '\nPictures of each changed view, and pages to click through: [umlimator-diff](%s)\n' "$PICTURES" >> "$SUMMARY"; fi
        cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != true ] || [ -z "$PR" ]; then exit 0; fi
        # one comment, found again by the marker it starts with, and only on a bot's comment (the default token posts as
        # github-actions[bot]): a person's comment that starts with the marker is never overwritten. With a person's
        # token instead, the comment is not found again, and each push posts a new one.
        ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- umlimator-diff -->"))) | .id') || ids=""
        id=${ids%%$'\n'*}
        if [ "$CHANGED" = 0 ] && [ -z "$id" ]; then exit 0; fi   # no map changed, and nothing said before
        if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$SUMMARY" > /dev/null
        else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$SUMMARY" > /dev/null; fi \
          || echo "::notice::no comment (a pull request from a fork gets a read-only token): the summary is in this job's summary"
