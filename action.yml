# The diff Action (#66): on a pull request, what it changes in umlimator map models, posted on the pull request.
#
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }   # pull-requests: the comment; nothing else is written
#   concurrency: { group: "maps-${{ github.event.pull_request.number }}", cancel-in-progress: true }   # one run per pull request
#   steps:
#     - uses: actions/checkout@v4
#     - uses: zintaen/umlimator@v0.28.0
#       with:
#         models: "docs/*.json"   # optional: git pathspecs of the model files (default: every .json that is a map model)
#
# For each model file the pull request changes: a page with each change marked (umlimator.py diff), stills of the views
# that show one, and a summary in words with a mermaid sketch, which GitHub draws in the comment, so no picture needs
# hosting. The pages and stills are the run's artifact, which the comment links to. One comment, updated on each push
# (the bot's own: never a person's, even one that starts with the same marker). It names the commit it describes; only
# the run for the pull request's latest commit writes it; and when the diff fails, it says so.
# A pull request from a fork gets a read-only token: no comment, and the summary is in the job summary instead.
name: umlimator diff
description: Pictures what a pull request changes in umlimator map models, and posts it on the pull request.
branding:
  icon: map
  color: blue
inputs:
  models:
    description: Git pathspecs of the model files, separated by spaces (default every .json that is a map model)
    default: "*.json"
  comment:
    description: Post one comment on the pull request with the summary, and update it on later pushes
    default: "true"
  github-token:
    description: The token that posts the comment (pull-requests write)
    default: ${{ github.token }}
outputs:
  changed:
    description: How many model files the pull request changes on the map
    value: ${{ steps.diff.outputs.changed }}
  summary:
    description: The summary, as a Markdown file
    value: ${{ steps.diff.outputs.summary }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        MODELS: ${{ inputs.models }}
        OUT: ${{ runner.temp }}/umlimator-diff
      run: |
        set -f   # the pathspecs are git's to match, not the shell's
        # a pull request's checkout is its merge commit, whose first parent is the base branch as it is now
        git rev-parse -q --verify HEAD^1 > /dev/null || git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
        python3 "$GITHUB_ACTION_PATH/umlimator.py" diff --base HEAD^1 --out "$OUT" --models $MODELS > "$OUT.json"
        echo "changed=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' "$OUT.json")" >> "$GITHUB_OUTPUT"
        echo "summary=$OUT/summary.md" >> "$GITHUB_OUTPUT"
    - id: pictures
      if: steps.diff.outputs.changed != '0'
      uses: actions/upload-artifact@v4
      with:
        name: umlimator-diff
        path: ${{ runner.temp }}/umlimator-diff
    - id: comment
      if: ${{ !cancelled() }}   # after a failed diff too, so the comment never goes on showing an older push's map
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT: ${{ inputs.comment }}
        CHANGED: ${{ steps.diff.outputs.changed }}
        DIFF: ${{ steps.diff.outcome }}
        SUMMARY: ${{ runner.temp }}/umlimator-diff/summary.md
        PICTURES: ${{ steps.pictures.outputs.artifact-url }}
        PR: ${{ github.event.pull_request.number }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        mkdir -p "${SUMMARY%/*}"; [ -f "$SUMMARY" ] || printf '<!-- umlimator-diff -->\n### Map changes\n' > "$SUMMARY"
        if [ "$DIFF" != success ]; then printf '\nThe map diff failed for %s: [its run](%s) says why.\n' "${HEAD:0:7}" "$RUN" >> "$SUMMARY"; fi
        if [ -n "$PICTURES" ]; then printf '\nPictures of each changed view, and pages to click through: [umlimator-diff](%s)\n' "$PICTURES" >> "$SUMMARY"; fi
        printf '\n<sub>For commit %s.</sub>\n<!-- umlimator-diff-sha: %s -->\n' "${HEAD:0:7}" "$HEAD" >> "$SUMMARY"   # which push it describes
        cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != true ] || [ -z "$PR" ]; then exit 0; fi
        # only the run for the pull request's latest commit writes, so a slower run for an older push never overwrites it;
        # what can't be read is not guessed at: no comment, and the summary is in this job's summary
        now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha) \
          || { echo "::warning::no comment: the pull request could not be read, so this run can't tell it is the latest"; exit 0; }
        if [ "$now" != "$HEAD" ]; then echo "::notice::no comment: the pull request's head is $now now, and that commit's run comments"; exit 0; fi
        # one comment, found again by the marker it starts with, and only on a bot's comment (the default token posts as
        # github-actions[bot]): a person's comment that starts with the marker is never overwritten. With a person's
        # token instead, the comment is not found again, and each push posts a new one. Every one found is updated, so one
        # that two runs posted at once is never left stale.
        ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- umlimator-diff -->"))) | .id') \
          || { echo "::warning::no comment: the pull request's comments could not be read, and a second comment is never posted"; exit 0; }
        if [ "$CHANGED" = 0 ] && [ -z "$ids" ]; then exit 0; fi   # no map changed, and nothing said before
        write() {
          said=$(gh api "$@" -F body=@"$SUMMARY" 2>&1 > /dev/null) && return
          if [ "$FORK" = true ]; then echo "::notice::no comment: a pull request from a fork gets a read-only token, so the summary is in this job's summary"
          elif [[ "$said" == *"HTTP 403"* || "$said" == *"HTTP 404"* ]]; then echo "::warning::no comment: ${said//$'\n'/ } (the workflow needs permissions: pull-requests: write)"
          else echo "::warning::no comment: ${said//$'\n'/ }"; fi
          return 1
        }
        if [ -z "$ids" ]; then write "repos/$GITHUB_REPOSITORY/issues/$PR/comments" || true; fi
        for id in $ids; do write -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" || break; done
