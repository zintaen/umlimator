   of the map. Fonts are the host's: --um-sans and --um-mono name families the page already has; nothing is fetched.
   It meets WCAG AA in both themes (text 4.5:1 on its background, lines 3:1 on the stage): tests/contrast.html.

  --um-k-public: #4493f8; --um-k-lane: #2dd4bf; --um-k-ext: #ab7df8; --um-k-verb: #f778ba; --um-k-script: #9198a1; --um-k-hook: #f85149; --um-k-board: #d29922;

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--um-bg); color: var(--um-text); font: 15px/1.6 var(--um-sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--um-grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--um-cyan); }
  code, .mono { font-family: var(--um-mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--um-panel-2); border: 1px solid var(--um-border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--um-bg) 82%, transparent); border-bottom: 1px solid var(--um-border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--um-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--um-muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--um-muted); text-decoration: none; font: 500 13px var(--um-sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--um-text); background: var(--um-panel); }
  .btn { background: var(--um-panel); border: 1px solid var(--um-border-2); color: var(--um-text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--um-sans); cursor: pointer; }
  .btn:hover { border-color: var(--um-cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--um-cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--um-mono); color: var(--um-muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--um-green); border-color: var(--um-green); background: var(--um-green-f); }
  .kind.plan { color: var(--um-cyan); border-color: var(--um-cyan); background: var(--um-cyan-f); }
  .kind.explore { color: var(--um-violet); border-color: var(--um-violet); background: var(--um-violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--um-muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--um-panel); border: 1px solid var(--um-border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--um-mono); }
  .stat span { color: var(--um-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--um-green); } .stat.del b { color: var(--um-rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--um-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--um-muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--um-border); }
  h2 .count { color: var(--um-dim); }
  .card { background: var(--um-panel); border: 1px solid var(--um-border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--um-mono); background: var(--um-panel-2); border: 1px solid var(--um-border-2); color: var(--um-muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--um-muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--um-mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--um-green); } .t-changed, .t-modified, .t-change { color: var(--um-cyan); } .t-removed, .t-delete { color: var(--um-rose); }
  .t-fix { color: var(--um-amber); } .t-refactor { color: var(--um-violet); } .t-docs, .t-chore { color: var(--um-slate); } .t-risk { color: var(--um-orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--um-mono); color: var(--um-muted); background: var(--um-panel-2); border: 1px solid var(--um-border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--um-text); border-color: var(--um-cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--um-mono); color: var(--um-muted); }
  .area { border-top: 1px solid var(--um-border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--um-mono); color: var(--um-text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--um-dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--um-mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--um-panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--um-green); } .st.M { color: var(--um-amber); } .st.D { color: var(--um-rose); } .st.R { color: var(--um-violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--um-dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--um-green); } .minus { color: var(--um-rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--um-border-2); }
  .blocks i.g { background: var(--um-green); } .blocks i.r { background: var(--um-rose); }
  .fnote { grid-column: 2 / 4; color: var(--um-muted); font: 12.5px/1.45 var(--um-sans); margin-top: -2px; }

  /* ================= map mode app shell =================
     Layout: views (column browser) left, map on top, details strip below the map. */
  body.map-mode { overflow: hidden; height: 100dvh; background: var(--um-bg); background-image: none; }
  .mapapp { display: grid; grid-template-columns: 0 minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); height: 100dvh; max-width: none; padding: 0; transition: grid-template-columns .22s ease; }
  body.tree-open .mapapp { grid-template-columns: min(var(--browser-width, 224px), 38vw) minmax(0, 1fr); }
  .mbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--um-border); background: var(--um-bg); z-index: 10; min-width: 0; }
  .mbrand { display: flex; align-items: center; gap: 8px; font: 650 14.5px var(--um-sans); white-space: nowrap; min-width: 0; }
  .mbrand i { width: 9px; height: 9px; border-radius: 50%; background: var(--um-accent); flex: none; }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-left: 10px; border-left: 1px solid var(--um-border); }
  .crumb { font: 500 12.5px var(--um-sans); color: var(--um-muted); background: none; border: 0; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button.crumb:hover { color: var(--um-text); background: var(--um-panel-2); }
  .crumb.cur { color: var(--um-text); font-weight: 600; background: var(--um-accent-f, var(--um-cyan-f)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--um-accent) 40%, transparent); cursor: default; }
  .crumb-sep { color: var(--um-dim); font-size: 12px; }
  .ibtn { width: 32px; height: 32px; flex: none; border-radius: 8px; border: 1px solid var(--um-border-2); background: var(--um-panel); color: var(--um-text); cursor: pointer; font: 600 14px var(--um-sans); }
  .ibtn:hover, .ibtn[aria-expanded="true"] { border-color: var(--um-accent); color: var(--um-accent); }
  .ibtn[aria-pressed="true"] { border-color: var(--um-accent); color: var(--um-accent); }
  @media (prefers-reduced-motion: reduce) { #m-pause { display: none; } }
  .ibtn.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
  .pbtn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--um-text); background: var(--um-text); color: var(--um-bg); font: 600 13px var(--um-sans); cursor: pointer; white-space: nowrap; }
  .pbtn:hover { opacity: .88; }
  .kbd { font: 600 10.5px var(--um-mono); border: 1px solid var(--um-border-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--um-muted); background: var(--um-panel); white-space: nowrap; }
  .findbtn { display: flex; align-items: center; gap: 8px; width: min(250px, 24vw); height: 32px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--um-border-2); background: var(--um-panel); color: var(--um-muted); font: 13px var(--um-sans); cursor: pointer; flex: none; }
  .findbtn:hover { border-color: var(--um-accent); }
  .findbtn .ft { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu { position: relative; }
  .menu-pop[hidden] { display: none; }
  .menu-pop { position: absolute; right: 0; top: 40px; min-width: 210px; padding: 5px; border-radius: 10px; background: var(--um-panel); border: 1px solid var(--um-border-2); box-shadow: var(--um-shadow); display: grid; z-index: 30; }
  .menu-pop button { text-align: left; background: none; border: 0; color: var(--um-text); font: 500 13px var(--um-sans); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu-pop button:hover { background: var(--um-panel-2); color: var(--um-accent); }
  .menu-pop hr { border: 0; border-top: 1px solid var(--um-border); margin: 4px 0; width: 100%; }

  /* views: Finder-style column browser */
  .outline { grid-row: 2; grid-column: 1; overflow: hidden; border-right: 1px solid var(--um-border); background: var(--um-bg); visibility: hidden; min-width: 0; }
  body.tree-open .outline { visibility: visible; }
  .miller { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: thin; }
  .mcol { flex: 0 0 224px; min-width: 224px; border-right: 1px solid var(--um-border); padding: 8px 6px; overflow-y: auto; }
  .mcol:last-child { border-right: 0; flex-grow: 1; }
  .mch { font: 700 10px var(--um-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--um-muted); padding: 2px 8px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mit { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; min-height: 34px; padding: 7px 8px; border-radius: 6px; border: 0; background: none; color: var(--um-text); font: 500 12.5px/1.4 var(--um-sans); cursor: pointer; text-align: left; }
  .mit span { min-width: 0; overflow-wrap: anywhere; white-space: normal; }
  .mit em { font-style: normal; color: var(--um-muted); font-size: 11px; white-space: nowrap; flex: none; }
  .mit:hover { background: var(--um-panel-2); }
  .mit.path { background: var(--um-panel-2); font-weight: 650; }
  .mit.on { background: var(--um-accent); color: var(--um-accent-fg); font-weight: 650; }
  .mit.on em { color: inherit; opacity: .8; }

  .mmain { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .mstage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .mcanvas { position: absolute; inset: 0; }
  /* view header: a pill that opens on tap */
  .vpill { position: absolute; left: 16px; top: 14px; z-index: 4; max-width: calc(100% - 32px); }

  .vpop { margin-top: 8px; width: 380px; max-width: 100%; background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 12px; box-shadow: var(--um-shadow); padding: 12px 14px; font-size: 12.5px; max-height: 60vh; overflow: auto; }

  .m-legend .t { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 700 10px var(--um-sans); letter-spacing: .1em; color: var(--um-muted); }

  .lgi { display: flex; align-items: center; gap: 7px; white-space: nowrap; }

  .lgi i.p { border-radius: 999px; } .lgi i.d { border-style: dashed; } .lgi i.h { border-radius: 0; clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 50%, calc(100% - 3px) 100%, 3px 100%, 0 50%); border: 0; }
  .lgi i.s { box-shadow: 2px 2px 0 -.5px var(--um-panel), 2px 2px 0 .5px var(--um-muted); background: var(--um-panel); }

  /* help: one quiet line at the bottom, keys in a popover */

  /* ⌘K command box */

  .pal { width: min(560px, calc(100vw - 32px)); background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 14px; box-shadow: var(--um-shadow); overflow: hidden; }

  .fr { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 8px; border: 0; background: none; color: var(--um-text); text-align: left; cursor: pointer; font: 13px var(--um-sans); }

  .pal .none { padding: 22px 16px; text-align: center; color: var(--um-muted); font-size: 13px; }

  .pal .pft { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--um-border); font-size: 11.5px; color: var(--um-muted); }

  /* details: a short strip under the map — compact header, then When to use · What it is · How it works · Example · Behind the scenes tabs */
  .panel { flex: none; height: 234px; max-height: 44%; overflow: auto; border-top: 1px solid var(--um-border-2); background: var(--um-panel); z-index: 5; animation: rise .2s ease; }

  .ph { display: flex; align-items: center; gap: 12px; padding: 12px 18px 6px; }

  .ph .pt { min-width: 0; flex: 1; }
  .ph h3 { margin: 0; font: 650 17px var(--um-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .vis { font: 700 9px var(--um-sans); letter-spacing: .1em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--um-border-2); color: var(--um-muted); }
  .vis.pub { background: var(--um-k-public); border-color: var(--um-k-public); color: #fff; } .vis.ext { border-style: dashed; border-color: var(--um-k-ext); color: var(--um-k-ext); }
  .author { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 1px; border-radius: 999px; border: 1px solid var(--um-border-2); color: var(--um-text); text-decoration: none; background: var(--um-panel); font-size: 12px; }

  .ptab { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--um-muted); font: 500 13px var(--um-sans); padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  .ptab em { font-style: normal; font-size: 11px; color: var(--um-dim); margin-left: 4px; }

  .ptab[aria-selected="true"] { color: var(--um-text); font-weight: 650; border-bottom-color: var(--um-accent); }
  .pnav { margin-left: auto; display: flex; gap: 4px; }

  .clamp { font-size: 14px; line-height: 1.55; max-width: 980px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .detail-bullets { margin: 0; padding-left: 18px; max-width: 1100px; font-size: 13px; line-height: 1.65; }

  .links ul { margin: 0; padding: 0; list-style: none; }

  .morebtn { border: 0; background: none; color: var(--um-accent); font: 600 12px var(--um-sans); padding: 2px 0 0; cursor: pointer; }
  .pnone { color: var(--um-dim); font-size: 13px; }

  .pverb { font: 600 12px var(--um-sans); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); padding: 1px 9px; border-radius: 999px; }

  .links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px; }
  .src { display: flex; align-items: center; gap: 6px; min-width: 0; } .src a, .src span { font: 12px var(--um-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .rel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; text-align: left; background: none; border: 0; padding: 4px 6px; margin: 0 -6px; width: calc(100% + 12px); border-radius: 6px; cursor: pointer; color: var(--um-text); font: 13px var(--um-sans); }

  /* one yellow highlighter phrase per section (==text== in the model) */

  /* Example tab: a data-driven gallery (node.examples = [{title, caption, thumb, full, href}]) */

  svg .node.planned .n-body, svg .node.planned .n-label, svg .node.planned .n-sub, svg .node.planned .n-sigil { opacity: .58; }

  /* endpoints */
  .eps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

  .ep { padding: 14px 16px; }
  .ep .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .method { font: 700 11px var(--um-mono); padding: 3px 8px; border-radius: 6px; letter-spacing: .06em; border: 1px solid currentColor; }
  .m-GET { color: var(--um-green); background: var(--um-green-f); } .m-POST { color: var(--um-cyan); background: var(--um-cyan-f); }
  .m-PUT, .m-PATCH { color: var(--um-amber); background: var(--um-amber-f); } .m-DELETE { color: var(--um-rose); background: var(--um-rose-f); }
  .m-WS, .m-SSE, .m-CLI, .m-CMD, .m-EVENT { color: var(--um-violet); background: var(--um-violet-f); }
  .ep .path { font: 600 14px var(--um-mono); word-break: break-all; }

  pre.json { margin: 6px 0 0; padding: 10px 12px; background: var(--um-bg-2); border: 1px solid var(--um-border); border-radius: 8px; font: 12px/1.5 var(--um-mono); overflow-x: auto; }

  /* steps */
  .steps { counter-reset: s; display: grid; gap: 0; }

  .step:last-child::before { display: none; }

  .step h3 { margin: 0 0 4px; font-size: 16px; } .step .detail { color: var(--um-muted); font-size: 14.5px; }

  /* hunks */
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 8px 0; border-bottom: 1px solid var(--um-border); scrollbar-width: thin; }
  .tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--um-muted); font: 600 12.5px var(--um-mono); padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--um-text); background: var(--um-panel-2); border-color: var(--um-border); margin-bottom: -1px; }
  .hpanel { display: none; } .hpanel.on { display: block; }
  .hhead { padding: 14px 18px 10px; } .hhead .fn { font: 600 13px var(--um-mono); color: var(--um-muted); } .hhead .hs { margin-top: 4px; font-size: 15px; }
  .hbody { display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .hbody.has-notes { grid-template-columns: minmax(0, 1fr) 300px; } }
  .diff { overflow-x: auto; border-top: 1px solid var(--um-border); background: var(--um-bg-2); }
  .diff table { border-collapse: collapse; width: 100%; font: 12.5px/1.55 var(--um-mono); }
  .diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
  .diff td.ln { color: var(--um-dim); text-align: right; user-select: none; width: 1%; padding: 0 8px; }
  .diff td.sg { width: 1%; user-select: none; padding: 0 4px; color: var(--um-dim); }
  .diff td.mk { width: 1%; padding: 0 4px; }
  .diff tr.add { background: var(--um-add-bg); } .diff tr.add td.code, .diff tr.add td.sg { color: var(--um-add-tx); }
  .diff tr.del { background: var(--um-del-bg); } .diff tr.del td.code, .diff tr.del td.sg { color: var(--um-del-tx); }
  .diff tr.hdr td { color: var(--um-violet); background: var(--um-panel-2); padding: 3px 10px; }
  .diff.newfile tr.add { background: none; } .diff.newfile tr.add td.code { color: var(--um-text); } .diff.newfile td.sg, .diff.newfile td.ln.o { display: none; }
  .diff tr.noted td.code { box-shadow: inset 2px 0 0 var(--um-amber); }
  .pin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--um-amber); color: #111; font: 700 10px var(--um-mono); }
  .notes { border-top: 1px solid var(--um-border); padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 1000px) { .notes { border-left: 1px solid var(--um-border); } }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--um-muted); }
  .note b { color: var(--um-text); font-weight: 600; }
  .more { padding: 8px 18px; color: var(--um-dim); font: 12px var(--um-mono); border-top: 1px solid var(--um-border); }

  /* risks / tests / questions */
  .two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .list { padding: 6px 0; }
  .li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--um-border); align-items: start; font-size: 14.5px; }
  .li:first-child { border-top: none; }
  .lvl { font: 700 10px var(--um-mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-top: 2px; }
  .lvl.high { color: var(--um-rose); } .lvl.med, .lvl.medium { color: var(--um-amber); } .lvl.low { color: var(--um-green); }
  .li input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--um-green); }
  .li .cmd { display: block; margin-top: 4px; color: var(--um-muted); }
  .q { padding: 14px 18px; border-top: 1px solid var(--um-border); } .q:first-child { border-top: none; }
  .q .qq { font-weight: 600; } .q .qd { color: var(--um-muted); font-size: 14px; margin-top: 4px; }
  .q .qd b { color: var(--um-green); font-weight: 600; }
  footer { padding: 34px 0 44px; color: var(--um-dim); font: 12px var(--um-mono); }
  .empty { color: var(--um-dim); padding: 14px 18px; }
</style>

      const ports = new Map();
      edges.forEach((e, i) => { const point = e.from === n.id ? e.p1 : e.to === n.id ? e.p2 : null; if (!point) return;

}

/* ================= camera: wheel/pinch zoom, drag pan, animated moves =================
   Ported in spirit from archify's viewer camera (MIT): reading depths by zoom level
   (map / read / full), fit + 100% presets, keyboard steps. Implemented on the SVG viewBox
   so text stays crisp at every zoom. */
class Camera {
  constructor(el, svg, o = {}) {
    this.el = el; this.svg = svg; this.o = o; this.s = { cx: 0, cy: 0, k: 1 }; this.touched = false;
    this.ptrs = new Map(); this.anim = 0;
    el.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    el.addEventListener('pointerdown', e => this.onDown(e));
    el.addEventListener('pointermove', e => this.onMove(e));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, e => this.onUp(e)));
    el.addEventListener('click', e => { if (this.dragged) { e.stopPropagation(); e.preventDefault(); this.dragged = false; } }, true);
    el.addEventListener('dblclick', e => { if (e.target.closest('.node')) return; const r = el.getBoundingClientRect(); this.zoomAt(2, e.clientX - r.left, e.clientY - r.top, true); });
  }
  setSvg(svg, bounds) { this.svg = svg; this.b = bounds; }
  size() { return [this.el.clientWidth || 800, this.el.clientHeight || 500]; }
  fitState(pad = 0.94) { // fits the bounds inside the viewport minus the overlay insets (header pill, hint line)
    const [W, H] = this.size(), b = this.b, opts = [].concat(this.o.inset ? this.o.inset() : { t: 0, r: 0, b: 0, l: 0 });
    const kOf = I => Math.min(Math.max(80, W - I.l - I.r) / b.w, Math.max(80, H - I.t - I.b) / b.h);
    const I = opts.reduce((a, o) => kOf(o) > kOf(a) + 1e-6 ? o : a); // several inset sets: keep the one that leaves the map largest
    const aw = Math.max(80, W - I.l - I.r), ah = Math.max(80, H - I.t - I.b);
    const k = Math.min(Math.min(aw / b.w, ah / b.h) * pad, this.o.maxFit || 1.25);
    const sx = I.l + aw / 2 - W / 2, sy = I.t + ah / 2 - H / 2;

  limits() { const f = this.fitState(); return [Math.min(f.k * 0.5, 0.2), this.o.max || 4]; }
  clamp(s) {
    const [lo, hi] = this.limits(), b = this.b;

    return { k, cx: Math.min(b.x + b.w + mx, Math.max(b.x - mx, s.cx)), cy: Math.min(b.y + b.h + my, Math.max(b.y - my, s.cy)) };
  }
  apply() {
    const [W, H] = this.size(), { cx, cy, k } = this.s;
    const vx = cx - W / (2 * k), vy = cy - H / (2 * k);
    this.svg.setAttribute('viewBox', `${vx} ${vy} ${W / k} ${H / k}`);
    this.svg.setAttribute('width', W); this.svg.setAttribute('height', H);
    const g = 24 * k, G = g * 5;
    this.el.style.backgroundSize = `${g}px ${g}px, ${G}px ${G}px, ${G}px ${G}px`;
    const ox = -vx * k, oy = -vy * k;
    this.el.style.backgroundPosition = `${ox}px ${oy}px, ${ox}px ${oy}px, ${ox}px ${oy}px`;
    this.el.dataset.depth = k < (this.o.mapDepth || 0.5) ? 'map' : k < 1.6 ? 'read' : 'full';

  }
  stopAnimation() {
    cancelAnimationFrame(this.anim); this.anim = 0;
    // Resize/refit interrupts camera motion. Navigation awaits that motion, so cancellation
    // must settle its promise too; otherwise go() never releases its busy flag.
    const done = this.animationDone; this.animationDone = null; if (done) done();
  }
  set(s) { this.stopAnimation(); this.s = this.clamp({ ...this.s, ...s }); this.apply(); }
  animate(to, ms = 380) {
    this.stopAnimation();

    if (reducedMotion()) { this.set(dest); return Promise.resolve(); }
    return new Promise(res => {
      this.animationDone = res;
      const t0 = performance.now(), ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const lk0 = Math.log(from.k), lk1 = Math.log(dest.k);

  }
  toWorld(sx, sy) { const [W, H] = this.size(), { cx, cy, k } = this.s; return [cx + (sx - W / 2) / k, cy + (sy - H / 2) / k]; }
  zoomAt(f, sx, sy, anim) {
    const [W, H] = this.size(); if (sx == null) { sx = W / 2; sy = H / 2; }
    const [wx, wy] = this.toWorld(sx, sy), [lo, hi] = this.limits();

  fit(anim = true) { this.touched = false; return anim ? this.animate(this.fitState()) : this.set(this.fitState()); }
  actual(anim = true) { this.touched = true; return anim ? this.animate({ k: 1 }) : this.set({ k: 1 }); }
  pan(dx, dy, anim) { this.touched = true; const to = { cx: this.s.cx - dx / this.s.k, cy: this.s.cy - dy / this.s.k }; return anim ? this.animate(to, 160) : this.set(to); }
  reveal(r, anim = true) { // pan (no zoom change) until rect r is comfortably inside the viewport
    const [W, H] = this.size(), { cx, cy, k } = this.s, hw = W / (2 * k), hh = H / (2 * k), m = 60 / k;
    let nx = cx, ny = cy;
    if (r.x - m < cx - hw) nx = r.x - m + hw; else if (r.x + r.w + m > cx + hw) nx = r.x + r.w + m - hw;
    if (r.y - m < cy - hh) ny = r.y - m + hh; else if (r.y + r.h + m > cy + hh) ny = r.y + r.h + m - hh;
    if (r.w + 2 * m > 2 * hw) nx = r.x + r.w / 2;
    if (nx !== cx || ny !== cy) return anim ? this.animate({ cx: nx, cy: ny }, 300) : this.set({ cx: nx, cy: ny });

  }
  zoomTo(r, fill = 0.9) { const [W, H] = this.size(); return { cx: r.x + r.w / 2, cy: r.y + r.h / 2, k: Math.min(W / r.w, H / r.h) * fill }; }
  onWheel(e) {
    const pinch = e.ctrlKey || e.metaKey;
    if (this.o.wheel === 'ctrl' && !pinch && !this.el.classList.contains('full')) return; // page scroll wins in documents
    e.preventDefault();

    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY, dx = e.deltaMode === 1 ? e.deltaX * 16 : e.deltaX;
    const trackpadPan = !pinch && e.deltaMode === 0 && (Math.abs(dx) > 0 || (Math.abs(dy) < 40 && !Number.isInteger(dy)));

  onDown(e) {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    if (e.target.closest('.ctl, .minimap, button, a, input, .um-edit') || (this.o.skip && this.o.skip(e))) return;
    this.ptrs.set(e.pointerId, [e.clientX, e.clientY]);

  }
  pinchDist() { const p = [...this.ptrs.values()]; return p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0; }
  onMove(e) {
    if (!this.ptrs.has(e.pointerId)) return;
    this.ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (this.ptrs.size > 1) { // pinch
      const d = this.pinchDist(); if (!this.start.dist) { this.start.dist = d; this.start.s = { ...this.s }; return; }
      const p = [...this.ptrs.values()], r = this.el.getBoundingClientRect();
      this.s = { ...this.start.s }; this.zoomAt(d / this.start.dist, (p[0][0] + p[1][0]) / 2 - r.left, (p[0][1] + p[1][1]) / 2 - r.top);

    }

      this.set({ cx: this.start.s.cx - dx / this.s.k, cy: this.start.s.cy - dy / this.s.k });

  }
  onUp(e) {
    if (!this.ptrs.has(e.pointerId)) return;

    if (!this.dragged) this.dragged = false;
  }
}

function routeAudit(geo, where, only) { // only: a set of edges; counts just the issues that involve one of them
  const sk = e => only && !only.has(e);
  const issues = [];
  // routes: no crossings, no shared runs, no label lying across another route
  const segs = geo.edges.map(e => e.pts.slice(0, -1).map((a, i) => [a, e.pts[i + 1]]));
  const name = e => `${e.s.label}→${e.t.label}`;
  const crossing = ([a, b], [c, d]) => {
    const av = a[0] === b[0], cv = c[0] === d[0];
    if (av === cv) { // parallel: overlapping collinear run = shared trunk
      if (av && Math.abs(a[0] - c[0]) < 1) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 1 ? 'share' : null;
      if (!av && Math.abs(a[1] - c[1]) < 1) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 1 ? 'share' : null;
      return null;
    }
    const [v, hz] = av ? [[a, b], [c, d]] : [[c, d], [a, b]];
    const x = v[0][0], y = hz[0][1];
    const inV = y > Math.min(v[0][1], v[1][1]) + .5 && y < Math.max(v[0][1], v[1][1]) - .5, inH = x > Math.min(hz[0][0], hz[1][0]) + .5 && x < Math.max(hz[0][0], hz[1][0]) - .5;
    return inV && inH ? 'cross' : null;
  };
  for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
    if (geo.edges[i].fixed && geo.edges[j].fixed) continue; // one comb: its branches share the trunk by design
    if (sk(geo.edges[i]) && sk(geo.edges[j])) continue;
    let found = null;
    for (const s1 of segs[i]) { for (const s2 of segs[j]) { found = crossing(s1, s2); if (found) break; } if (found) break; }
    if (found === 'cross') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} cross`);
    if (found === 'share') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} share a line`);
  }
  geo.edges.forEach((e, i) => { if (!e.lbl) return; const L = { x: e.lbl.x + 1, y: e.lbl.y + 1, w: e.lbl.w - 2, h: e.lbl.h - 2 };
    geo.edges.forEach((o, j) => { if (j !== i && !(sk(e) && sk(o)) && segs[j].some(([a, b]) => Math.max(a[0], b[0]) > L.x && Math.min(a[0], b[0]) < L.x + L.w && Math.max(a[1], b[1]) > L.y && Math.min(a[1], b[1]) < L.y + L.h)) issues.push(`${where}: label "${e.lbl.text || e.lbl.step}" lies on edge ${name(o)}`); }); });
  const segHit = (r, i) => segs[i].some(([a, b]) => Math.max(a[0], b[0]) > r.x && Math.min(a[0], b[0]) < r.x + r.w && Math.max(a[1], b[1]) > r.y && Math.min(a[1], b[1]) < r.y + r.h);
  if (geo.map) {
    const ex = 12;
    geo.edges.forEach((e, i) => {
      // clearance: a route keeps 12+ px from every node it does not connect
      geo.nodes.forEach(n => { if (n.id === e.from || n.id === e.to) return;
        if (segHit({ x: n.x - ex + .5, y: n.y - ex + .5, w: n.w + 2 * ex - 1, h: n.h + 2 * ex - 1 }, i)) issues.push(`${where}: edge ${name(e)} passes within ${ex}px of node "${n.label}"`); });
      // no detours: a route stays under 2.5x the straight distance between its ends
      const len = e.pts.slice(1).reduce((a, p, k) => a + Math.abs(p[0] - e.pts[k][0]) + Math.abs(p[1] - e.pts[k][1]), 0);
      const d = Math.hypot(e.pts[e.pts.length - 1][0] - e.pts[0][0], e.pts[e.pts.length - 1][1] - e.pts[0][1]);
      if (len > 2.5 * Math.max(d, 100)) issues.push(`${where}: edge ${name(e)} takes a detour (${Math.round(len)}px for ${Math.round(d)}px)`);
      // reading order: every wire runs left to right, except one that closes a loop
      if (!e.back && !e.both && e.t.x + e.t.w / 2 <= e.s.x + e.s.w / 2) issues.push(`${where}: edge ${name(e)} runs right-to-left`);
    });
    if (geo.hub) { // hub views: one visible line into each callee
      const into = {}; geo.edges.forEach(e => { (into[e.to] ||= []).push(e); });
      Object.entries(into).forEach(([id, es]) => { es = es.filter(e => !e.back); if (es.some(e => e.from === geo.hub) && es.length > 1) issues.push(`${where}: hub callee "${(geo.byId[id] || {}).label || id}" has ${es.length} incoming lines`); });
    }
  }
  // author name tags hang under their card: no route may run through one
  (geo.nodes || []).forEach(n => { if (!n.tag) return; const r = { x: n.tag.x + 1, y: n.tag.y + 1, w: n.tag.w - 2, h: n.tag.h - 2 };
    geo.edges.forEach((o, j) => { if (segHit(r, j)) issues.push(`${where}: name tag "${n.tag.text}" lies on edge ${name(o)}`); }); });
  // lanes: every part sits inside its own lane, lanes never overlap, no route crosses a lane header
  const lanes = geo.lanes || [];
  lanes.forEach((l, i) => {
    lanes.slice(i + 1).forEach(m => { if (hit(l, m, -1)) issues.push(`${where}: lanes "${l.title}" and "${m.title}" overlap`); });
    (geo.nodes || []).forEach(n => {
      if (n.lane === i && (n.x < l.x || n.x + n.w > l.x + l.w || n.y < l.y || n.y + n.h + (n.tag ? 14 : 0) > l.y + l.h)) issues.push(`${where}: lane "${l.title}": node "${n.label}" sticks out`);
      if (n.lane != null && n.lane !== i && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" of another lane sits in it`);
      if (n.lane == null && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" belongs to no lane but sits in it`);
    });
  });
  (geo.blocks || []).forEach(b => geo.edges.forEach((o, j) => { if (segHit({ x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 }, j)) issues.push(`${where}: lane "${b.title || ''}": header crossed by edge ${name(o)}`); }));
  const families = geo.families || [], inside = (a,b) => b.x > a.x && b.y > a.y && b.x+b.w < a.x+a.w && b.y+b.h < a.y+a.h;
  families.forEach(f => {
    const parent = families.find(p => p.id === f.parent);
    if (f.parent && (!parent || !inside(parent,f))) issues.push(`${where}: family "${f.label}" sticks out of its parent`);
    (f.nodeIds || []).forEach(id => { const n = geo.byId[id]; if (n && !inside(f,n)) issues.push(`${where}: family "${f.label}" does not contain "${n.label}"`); });
    families.filter(g => g !== f && g.parent === f.parent && g.id > f.id).forEach(g => { if (hit(f,g,-1)) issues.push(`${where}: families "${f.label}" and "${g.label}" overlap`); });
    geo.edges.forEach((e,i) => { if (segHit({x:f.x+8,y:f.y+3,w:Math.min(f.w-16,textW(f.label || f.id,11)+16),h:22},i)) issues.push(`${where}: family "${f.label}": header crossed by edge ${name(e)}`); });
    geo.edges.forEach((e,i) => { if (segs[i].some(([a,b]) => { const v = a[0] === b[0], c = v ? a[0] : a[1], p = v ? [a[1], b[1]] : [a[0], b[0]];
      const lo = Math.max(Math.min(...p), v ? f.y : f.x), hi = Math.min(Math.max(...p), v ? f.y + f.h : f.x + f.w);
      return hi - lo > 40 && (v ? [f.x, f.x + f.w] : [f.y, f.y + f.h]).some(u => Math.abs(c - u) < 8); })) issues.push(`${where}: edge ${name(e)} runs along the border of family "${f.label}"`); });
    geo.edges.forEach(e => { const L = e.lbl; if (!L) return; const xin = L.x + L.w > f.x && L.x < f.x + f.w, yin = L.y + L.h > f.y && L.y < f.y + f.h;
      if ((xin && [f.y, f.y + f.h].some(u => L.y < u && L.y + L.h > u)) || (yin && [f.x, f.x + f.w].some(u => L.x < u && L.x + L.w > u))) issues.push(`${where}: label "${L.text || L.step}" sits on the border of family "${f.label}"`); });
  });
  return issues;
}

/* label-overlap audit used by `visual.py check` (world coordinates, real font metrics) */
function auditSvg(svg, geo, where) {
  const issues = [], R = n => ({ x: n.x, y: n.y, w: n.w, h: n.h });
  const T = [...svg.querySelectorAll('text[data-t]')].map(t => { let b; try { b = t.getBBox(); } catch (_) { return null; } return { t: t.dataset.t, o: t.dataset.o, txt: t.textContent, b: { x: b.x, y: b.y, w: b.width, h: b.height } }; }).filter(x => x && x.b.w);
  const nodes = geo.nodes;
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) if (hit(R(nodes[i]), R(nodes[j]), -1)) issues.push(`${where}: nodes "${nodes[i].label}" and "${nodes[j].label}" overlap`);
  T.forEach(a => {
    if (a.t === 'lt' || a.t === 'ft') {
      nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: lane "${a.txt}": header covers node "${n.label}"`); });
      if (a.t === 'ft') { const f = (geo.families || []).find(f => f.id === a.o); if (f && (a.b.x < f.x || a.b.x+a.b.w > f.x+f.w)) issues.push(`${where}: family title "${a.txt}" overflows its box`); }
    } else if (a.t === 'el') {
      nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: edge label "${a.txt}" covers node "${n.label}"`); });
    } else {

  }

  if (opt && !V[vid].layout && !planOf(vid).hub) { delete layoutCache[vid]; const t = performance.now(), o = optimize(vid); r.optimize = { ms: performance.now() - t, evals: o.evals, score: o.score }; }
  return r;
}
/* #check=1[&views=a,pic-*][&optimize=1] (umlimator.py check, visual.py render): every view drawn off screen, in a shadow root like the canvas,
   with text measured in the page's font as the viewer does, and audited. The layout search (optimize, baked into the page by render) uses the
   font-independent estimate (approx), so a rendered page is the same on every machine. */
function mapAudit(approx) {
  const ctx = mapContext(D, { measure: hostMeasure(document.documentElement) });
  const { views, N, planOf, layoutCache, buildView, chain } = ctx;
  const out = [], host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-99999px;top:0;width:2000px;height:2000px;visibility:hidden';
  document.body.appendChild(host);
  const root = host.attachShadow({ mode: 'open' }); root.adoptedStyleSheets = [sheet()];
  const routes = {}, layouts = {}, laneReport = {};
  views.forEach(v => { const L = planOf(v.id); if (L.hub) laneReport[v.id] = L.lanes.map(l => l.title); });
  if (Q.get('optimize')) views.forEach(v => { if (!v.layout && !approx.planOf(v.id).hub) { const r = approx.optimize(v.id); layouts[v.id] = r.pos; layoutCache[v.id] = r.pos; } });
  const only = (Q.get('views') || '').split(',').filter(Boolean), want = v => !only.length || only.some(p => p.endsWith('*') ? v.id.startsWith(p.slice(0, -1)) : v.id === p);
  views.forEach(v => { if (!want(v) || !(v.nodeIds || []).some(i => N[i])) return; const { g, markup } = buildView(v.id, { tour: !Q.get('still'), openHint: !Q.get('reader') }); root.innerHTML = markup; out.push(...auditSvg(root.firstElementChild, g, 'view ' + v.id)); Object.entries(g.stats || {}).forEach(([k, n]) => { routes[k] = (routes[k] || 0) + n; });
    g.edges.filter(e => e.how === 'fallback').forEach(e => (routes.fallbackEdges ||= []).push(`${v.id}: ${e.from}(${e.fs})→${e.to}(${e.ts})`)); });
  host.remove();
  const deep = views.filter(v => v.parent).sort((a, b) => chain(b.id).length - chain(a.id).length || (b.nodeIds || []).length - (a.nodeIds || []).length)[0];
  const laneView = laneReport['super-build'] ? 'super-build' : Object.keys(laneReport)[0] || null;
  return { overlaps: out, routes, layouts, lanes: laneReport, checked: views.filter(want).length + ' views', childView: deep ? deep.id : null, laneView };
}

let mapCtx = null;
try {
  if (D.kind === 'map') {
    mapCtx = mapContext(D);
    if (!Q.get('bench')) { document.querySelector('.bar').remove(); mountPage(app, D, { params: Q, instant: INSTANT }); }
  } else renderDoc();
} catch (err) { errors.push('render: ' + err.message); console.error(err); }

if (Q.get('bench')) {
  const res = { views: {}, errors };
  try { (Q.get('views') || '').split(',').filter(Boolean).forEach(v => { res.views[v] = benchView(mapCtx, v, +Q.get('runs') || 5, !!Q.get('optimize')); }); }
  catch (err) { errors.push('bench: ' + err.message); }
  const pre = document.createElement('pre'); pre.id = 'bench'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
}
/* ---------- self-check hook for `visual.py check` ---------- */
if (Q.get('check')) {
  const report = () => {
    let res = { overlaps: [], checked: 0 };
    try {
      if (mapCtx) res = mapAudit(mapCtx);
      else { (window.__geos || []).forEach(([fig, geo, name]) => res.overlaps.push(...auditSvg(fig.querySelector('svg'), geo, 'diagram ' + name))); res.checked = (window.__geos || []).length + ' diagrams'; }
    } catch (err) { errors.push('check: ' + err.message); }
    res.errors = errors;
    const pre = document.createElement('pre'); pre.id = 'visual-check'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(report, report);
}
