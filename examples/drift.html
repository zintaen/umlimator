<!doctype html>
<html lang="en">
<!-- Drift (#68): the Umlimator Atlas's overview against a week of made-up traffic, as a tracing backend (Jaeger, Tempo)
     lists the calls between services. drift() marks the model: lines that run but are not drawn come in, dashed rose; drawn lines
     between services the traffic reached, that carried nothing, fade. `umlimator.py drift` writes the same page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>umlimator: drawn vs. seen</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--um-bg); color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--um-border); }
  header span { color: var(--um-muted); }
  i.k { display: inline-block; width: 22px; vertical-align: middle; border-top: 2px solid var(--um-rose); margin-right: 6px; }
  i.k.idle { border-top-color: var(--um-w-calls); opacity: .35; } i.k.new { border-top-style: dashed; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; } /* the page's main landmark */
  #map { flex: 1; min-height: 0; }
  header h1 { margin: 0; font-size: inherit; } /* the page's heading, drawn as the bold title it was */
</style>
<header><h1>Drawn vs. seen</h1><label><input id="on" type="checkbox" checked> Show drift</label>
  <span><i class="k new"></i>runs, not drawn</span><span><i class="k idle"></i>drawn, carried nothing</span><span id="counts" aria-live="polite"></span></header>
<main><div id="map"></div></main>
<script type="module">
import { render, drift } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const model = await withIcons(await (await fetch('umlimator-atlas.json')).json());
// a week of calls between umlimator's parts, as a tracing backend names them (made up)
const seen = { data: [
  ['github', 'diff-action', 4200], ['diff-action', 'umlimator-py', 4200], ['diff-action', 'github', 4100], ['umlimator-py', 'core-module', 9100],
  ['umlimator-py', 'chrome', 3800], ['umlimator-py', 'readers', 0], ['standalone-page', 'typed', 52000], ['typed', 'core-module', 52000],
  ['assistant', 'mcp-server', 1250], ['mcp-server', 'standalone-page', 1300], ['host', 'core-module', 8800], ['docs', 'element', 2400],
  ['element', 'core-module', 2400], ['mcp-server', 'core-module', 640], ['diff-action', 'chrome', 90], ['umlimator-py', 'icon-cdn', 120],
].map(([parent, child, callCount]) => ({ parent, child, callCount })) };
// where a service's name is not a card's id or label
const match = { 'umlimator-py': 'cli', 'core-module': 'module', 'standalone-page': 'page', 'mcp-server': 'mcp', 'diff-action': 'action' };
const { model: marked, counts } = drift(model, seen, { match });
const c = counts;
// counts are of the model's edges: a line drawn for two edges fades only when both were idle
document.getElementById('counts').textContent = `Edges: ${c.carried} carried traffic, ${c.undrawn} ran undrawn, ${c.idle} idle (a line drawn for two fades only when both are); ${c.unknown} not judged (an end the traffic never reached); no card for ${c.unmatched.join(', ') || 'none'}`;
const map = render(document.getElementById('map'), marked, { view: 'overview' });
window.map = map;
document.getElementById('on').addEventListener('change', e => map.update(e.target.checked ? marked : model));
</script>
