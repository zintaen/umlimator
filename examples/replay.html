<!doctype html>
<html lang="en">
<!-- replay() of a trace: the diff Action on a pull request, on the Umlimator Atlas's overview, as an OpenTelemetry
     collector exports it (OTLP JSON, traces/pull-request.json), read by otlpSpans(). Each call runs along its line at the
     trace's relative timing, the line glows while the call lasts and keeps its duration. Services match cards by id, by
     label, or through a match map (traces/pull-request-match.json). One service (git) has no card on this view, so its
     span is skipped and counted. The trace is made up. Serve the repository over HTTP to open it: python3 -m http.server  then  http://localhost:8000/examples/replay.html -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umlimator: trace replay</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; background: var(--um-bg);
    color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; border-bottom: 1px solid var(--um-border); font-size: 13px; }
  header p { margin: 0; color: var(--um-muted); flex: 1 1 320px; }
  button { font: inherit; }
  #map { min-height: 0; }
  main { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); min-height: 0; } /* the page's main landmark, around the map */
  header h1 { margin: 0; font-size: inherit; } /* the page's heading, drawn as the bold title it was */
</style>
<header>
  <h1>A pull request's diff: the trace, replayed</h1>
  <p id="status" aria-live="polite">Play runs the trace over 6 seconds.</p>
  <button id="play">Play</button>
  <button id="pause" aria-pressed="false" disabled>Pause</button>
  <button id="stop" disabled>Stop</button>
</header>
<main><div id="map"></div></main>
<script type="module">
import { render, otlpSpans } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const model = await withIcons(await (await fetch('umlimator-atlas.json')).json());
const map = render(document.getElementById('map'), model, { view: 'overview' });

// the trace, as an OpenTelemetry collector exports it (one resource per service, times in ns), and the services whose
// names aren't a card's id or label (github and chrome are ids, umlimator.py is a label). umlimator.py trace keeps
// a trace like this one as a numbered view (#96)
const [trace, match] = await Promise.all(['traces/pull-request.json', 'traces/pull-request-match.json'].map(async f => (await fetch(f)).json()));

const $ = id => document.getElementById(id), status = $('status');
let run = null;
$('play').onclick = () => {
  run = map.replay(otlpSpans(trace), { match, duration: 6000 });
  status.textContent = `${run.hops} calls; ${run.skipped} span${run.skipped === 1 ? '' : 's'} with no card or line on this view.`;
  $('pause').disabled = $('stop').disabled = false; $('pause').textContent = 'Pause'; $('pause').setAttribute('aria-pressed', false);
  const mine = run;
  run.done.then(played => { if (run !== mine) return; $('pause').disabled = true;
    status.textContent = played ? 'Played: each line keeps its call\'s duration. Stop clears them.' : 'Stopped.'; if (!played) $('stop').disabled = true; });
};
$('pause').onclick = e => { if (!run) return; const on = e.target.getAttribute('aria-pressed') !== 'true';
  on ? run.pause() : run.resume(); e.target.setAttribute('aria-pressed', on); e.target.textContent = on ? 'Resume' : 'Pause'; };
$('stop').onclick = () => { if (run) run.stop(); $('stop').disabled = true; };
window.map = map;
</script>
