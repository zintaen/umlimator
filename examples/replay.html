<!doctype html>
<!-- replay() of a trace: a ride ending in bike share's Trip service, as an OpenTelemetry collector exports it (OTLP JSON),
     read by otlpSpans(). Each call runs along its line at the trace's relative timing, the line glows while the call
     lasts and keeps its duration. Services match cards by id, by label, or through the page's match map. One service
     (fraud-check) has no card on this view, so its span is skipped and counted. The trace is made up. Serve the
     repository over HTTP to open it: python3 -m http.server  then  http://localhost:8000/examples/replay.html -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umlimator: trace replay</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; background: var(--um-bg);
    color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; border-bottom: 1px solid var(--um-border); font-size: 13px; }
  header p { margin: 0; color: var(--um-muted); flex: 1 1 320px; }
  button { font: inherit; }
  #map { min-height: 0; }
</style>
<header>
  <b>A ride ends: the trace, replayed</b>
  <p id="status" aria-live="polite">Play runs the trace over 6 seconds.</p>
  <button id="play">Play</button>
  <button id="pause" aria-pressed="false" disabled>Pause</button>
  <button id="stop" disabled>Stop</button>
</header>
<div id="map"></div>
<script type="module">
import { render, otlpSpans } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const model = await withIcons(await (await fetch('bike-share.json')).json());
const map = render(document.getElementById('map'), model, { view: 'trips' });

// the trace: one resource per service, each with its spans [id, parent id, name, start ms, end ms]; OTLP keeps times in ns
const T0 = 1762700000000n, ns = ms => String((T0 + BigInt(ms)) * 1000000n);
const service = (name, spans) => ({ resource: { attributes: [{ key: 'service.name', value: { stringValue: name } }] },
  scopeSpans: [{ spans: spans.map(([id, parent, what, a, b]) => ({ traceId: '5b8aa5a2d2c872e8321cf37308d69df2', spanId: id, parentSpanId: parent, name: what, startTimeUnixNano: ns(a), endTimeUnixNano: ns(b) })) }] });
const trace = { resourceSpans: [
  service('rider-app', [['a1', '', 'tap End ride', 0, 212]]),
  service('trip-api', [['b1', 'a1', 'POST /rides/{id}/end', 6, 206]]),
  service('trip-lifecycle', [['c1', 'b1', 'close ride', 12, 198]]),
  service('fare-calculator', [['d1', 'c1', 'fare for ride', 20, 118]]),
  service('Pricing', [['e1', 'd1', 'GetPrice', 24, 61]]),
  service('payment-gateway', [['f1', 'd1', 'POST /charges', 66, 114]]),
  service('fraud-check', [['g1', 'f1', 'score charge', 70, 92]]),
  service('trip-repository', [['h1', 'c1', 'save ride', 122, 160]]),
  service('postgres', [['i1', 'h1', 'UPDATE rides', 126, 155]]),
  service('event-publisher', [['j1', 'c1', 'publish ride.ended', 164, 190]]),
] };
// services whose names aren't a card's id or label: rider-app and trip-api are ids, Pricing is a label
const match = { 'trip-lifecycle': 'lifecycle', 'fare-calculator': 'fare', 'payment-gateway': 'payments', 'trip-repository': 'trip-repo', postgres: 'tripsdb', 'event-publisher': 'trip-events' };

const $ = id => document.getElementById(id), status = $('status');
let run = null;
$('play').onclick = () => {
  run = map.replay(otlpSpans(trace), { match, duration: 6000 });
  status.textContent = `${run.hops} calls; ${run.skipped} span${run.skipped === 1 ? '' : 's'} with no card or line on this view.`;
  $('pause').disabled = $('stop').disabled = false; $('pause').textContent = 'Pause'; $('pause').setAttribute('aria-pressed', false);
  const mine = run;
  run.done.then(played => { if (run !== mine) return; $('pause').disabled = true;
    status.textContent = played ? 'Played: each line keeps its call\'s duration. Stop clears them.' : 'Stopped.'; if (!played) $('stop').disabled = true; });
};
$('pause').onclick = e => { if (!run) return; const on = e.target.getAttribute('aria-pressed') !== 'true';
  on ? run.pause() : run.resume(); e.target.setAttribute('aria-pressed', on); e.target.textContent = on ? 'Resume' : 'Pause'; };
$('stop').onclick = () => { if (run) run.stop(); $('stop').disabled = true; };
window.map = map;
</script>
