<!doctype html>
<html lang="en">
<!-- overlay() with live data: the map is drawn once, and every second this page hands it a new layer of marks. Flow runs
     faster on a line that carries more readings; a line that drops readings pulses rose and a slow one glows amber, with
     its delay; each card's tab shows how far that part lags. The model never changes, so cards, the view, the camera
     and the selection stay as they are. The numbers are made up. Serve the repository over HTTP to open it:
     python3 -m http.server  then  http://localhost:8000/examples/live.html -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umlimator: live traffic</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; background: var(--um-bg);
    color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; border-bottom: 1px solid var(--um-border); font-size: 13px; }
  header p { margin: 0; color: var(--um-muted); flex: 1 1 320px; }
  button { font: inherit; }
  #map { min-height: 0; }
</style>
<header>
  <b>Weather stations, live</b>
  <p>Flow runs faster where more readings pass. A line pulses rose while it drops readings and glows amber while it's slow;
    a card's tab turns amber, then rose, as that part falls behind.</p>
  <span id="clock" aria-live="off"></span>
  <button id="pause" aria-pressed="false">Pause</button>
</header>
<div id="map"></div>
<script type="module">
import { render } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const model = await withIcons(await (await fetch('weather.json')).json());
const flow = model.views.find(v => v.id === 'flow'), shown = id => flow.nodeIds.includes(id);
const wave = (seed, t) => (Math.sin(t / 7 + seed * 1.7) + Math.sin(t / 3.1 + seed)) / 2;   // made-up metrics, -1 to 1
const seed = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0);

let t = 0;
function traffic() {   // a layer of marks: lines by edge id, cards by node id
  const edges = {}, nodes = {};
  for (const e of model.edges) if (shown(e.from) && shown(e.to)) {
    const perMinute = Math.exp(3.2 + 2.2 * wave(seed(e.id), t));                 // 3 to 220 readings a minute
    const drops = wave(seed(e.id) + 7, t * 1.3), slow = wave(seed(e.id) + 11, t * 0.8);
    edges[e.id] = { speed: Math.min(4, Math.max(0.3, perMinute / 40)),
      ...(drops > 0.8 ? { tone: 'rose', pulse: true, label: 'dropping' } : slow > 0.75 ? { tone: 'amber', label: `${Math.round(300 + 900 * slow)} ms` } : {}) };
  }
  for (const n of model.nodes) if (shown(n.id) && n.kind !== 'external') {
    const lag = Math.max(0, Math.round(12 + 14 * wave(seed(n.id) + 3, t)));
    nodes[n.id] = { badge: { text: `lag ${String(lag).padStart(2, ' ')} s`, tone: lag < 8 ? 'green' : lag < 20 ? 'amber' : 'rose' } };   // a figure space keeps the tab's width
  }
  return { edges, nodes };
}

const map = render(document.getElementById('map'), model, { view: 'flow' });
map.overlay('traffic', traffic());
let timer = setInterval(tick, 1000);
function tick() { t++; map.overlay('traffic', traffic()); document.getElementById('clock').textContent = `t = ${t} s`; }
document.getElementById('pause').onclick = e => {
  const paused = !!timer; e.target.textContent = paused ? 'Resume' : 'Pause'; e.target.setAttribute('aria-pressed', paused);
  if (paused) { clearInterval(timer); timer = null; } else timer = setInterval(tick, 1000);
};
window.map = map;
</script>
