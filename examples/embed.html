<!doctype html>
<!-- render() in a host page, with the standalone page's pieces (#99): the views list, the details panel, the legend and
     the hint line, each a render() option; views loaded when a card opens them, export, themes and the minimap are this
     page's own code around the map. Serve the repository over HTTP to open it (ES modules do not load from file://):
     python3 -m http.server  then  http://localhost:8000/examples/embed.html -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umlimator: a host page</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh;
    background: var(--um-bg); color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px;
    border-bottom: 1px solid var(--um-border); font-size: 13px; }
  header .grow { flex: 1; }
  button, select { font: inherit; }
  #map { min-height: 0; }
  /* a host's own palette: any --um-* variable, set on the map's element or above it */
  #map.plum { --um-accent: #7a3ea8; --um-cyan: #7a3ea8; --um-green: #2f7d5b; --um-amber: #a35a00; --um-rose: #b3305b;
    --um-w-calls: #4b3d57; --um-w-feeds: #7a3ea8; --um-stage-bg: #fbf8fd; --um-panel: #fffdfe; --um-dot: #ece4f2; }
</style>
<header>
  <label>Model <select id="model">
    <option value="bike-share.json">Bike share</option>
    <option value="weather.json">Weather stations</option>
    <option value="assistant.json">Helpdesk assistant</option>
    <option value="bookshop.json">Bookshop</option>
  </select></label>
  <span class="grow"></span>
  <span id="pieces"><label><input type="checkbox" id="nav" checked> views</label> <label><input type="checkbox" id="details" checked> details</label>
    <label><input type="checkbox" id="legend" checked> legend</label> <label><input type="checkbox" id="hints" checked> hints</label>
    <label><input type="checkbox" id="minimap"> minimap</label></span>
  <label>Theme <select id="theme">
    <option value="">system</option><option value="light">light</option><option value="dark">dark</option>
    <option value="plum">a host's palette</option>
  </select></label>
  <button id="svg" title="The view as an SVG file">SVG</button>
  <button id="png" title="The view as a PNG file">PNG</button>
</header>
<div id="map"></div>
<script type="module">
import { render } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const $ = id => document.getElementById(id);
let full, model, map;   // full: what the "server" has; model: what this page has loaded so far

// A card whose opensView comes with an opensCount names a view the host loads only when someone opens it: the card
// still looks stacked and shows the count. A real host would fetch the view; this page waits 300 ms instead.
const heldBack = m => new Set(m.nodes.filter(n => n.opensView && n.opensCount != null).map(n => n.opensView));
const loaded = id => model.views.some(v => v.id === id);
async function load(id) {
  await new Promise(r => setTimeout(r, 300));
  model = { ...model, views: [...model.views, full.views.find(v => v.id === id)] };
  map.update(model);   // the map keeps its view, camera and selection
}

function mount(view) {   // the pieces and the minimap are render() options: changing one draws the map again, in the same view
  map?.destroy();
  const on = id => $(id).checked;
  map = render($('map'), model, { view, nav: on('nav'), details: on('details'), legend: on('legend'), hints: on('hints'), minimap: on('minimap'), on: {
    // a card opens a view this page has not loaded yet (a double-click, Enter, or Open in its details): load it, then show it
    open: async e => { if (loaded(e.view)) return; await load(e.view); map.setView(e.view); },
    // E, Alt + click or Unfold here in its details unfolds a stacked card in place: a view not loaded yet is loaded first (#71)
    expand: async e => { if (!e.expanded || loaded(e.view)) return; e.preventDefault(); await load(e.view); map.expand(e.target.id); },
  } });
  window.map = map;   // for the console, and for tests/embed.py
}

async function pick(file) {
  full = await withIcons(await (await fetch(file)).json());
  const held = heldBack(full);
  model = { ...full, views: full.views.filter(v => !held.has(v.id)) };
  mount();
}

const save = (blob, name) => { const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name }); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('svg').onclick = () => save(new Blob([map.toSVG({ scale: 2 })], { type: 'image/svg+xml' }), `${map.view}.svg`);
$('png').onclick = async () => { const png = await map.toPNG(); if (png) save(png, `${map.view}.png`); };

$('theme').onchange = e => {
  const t = e.target.value, root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else if (t === 'plum') root.dataset.theme = 'light'; else delete root.dataset.theme;
  $('map').classList.toggle('plum', t === 'plum');
};
$('pieces').onchange = () => mount(map.view);
$('model').onchange = e => pick(e.target.value);
const asked = new URLSearchParams(location.search).get('model');   // embed.html?model=weather.json
if ([...$('model').options].some(o => o.value === asked)) $('model').value = asked;
await pick($('model').value);
</script>
