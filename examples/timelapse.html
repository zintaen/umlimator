<!doctype html>
<html lang="en">
<!-- A time-lapse (#67): four made-up releases of the bike share, on a slider. update() eases the map from one to the
     next: new cards fade in, removed ones fade out, moved ones glide. diff() says what changed, and its marks show on
     the map when asked. `umlimator.py timelapse model.json` writes the same page from a model's git history. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>umlimator: a time-lapse</title>
<link rel="stylesheet" href="../lib/umlimator-theme.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--um-bg); color: var(--um-text); font: 14px/1.5 var(--um-sans); }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--um-border); }
  header input[type=range] { flex: 1 1 220px; accent-color: var(--um-accent); }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--um-border-2); border-radius: 6px; background: var(--um-panel); color: var(--um-text); cursor: pointer; }
  #map { flex: 1; min-height: 0; }
  #said { margin: 0; padding: 8px 16px 12px; border-top: 1px solid var(--um-border); color: var(--um-muted); min-height: 1.5em; }
</style>
<header><button id="play" type="button">Play</button><input id="at" type="range" min="0" step="1" aria-label="Release">
  <label><input id="marks" type="checkbox"> Mark what changed</label><b id="label" aria-live="polite"></b></header>
<div id="map"></div>
<p id="said" aria-live="polite"></p>
<script type="module">
import { render, diff } from '../lib/umlimator.js';
import { withIcons } from './icons.js';

const full = await withIcons(await (await fetch('bike-share.json')).json());
// each release, as the cards that came after it: a model without them (and their lines, places and boxes)
const without = (m, drop) => {
  const out = structuredClone(m), keep = id => !drop.includes(id);
  out.nodes = out.nodes.filter(n => keep(n.id));
  out.edges = out.edges.filter(e => keep(e.from) && keep(e.to));
  const lines = new Set(out.edges.map(e => e.id));
  out.views.forEach(v => {
    v.nodeIds = v.nodeIds.filter(keep);
    if (v.layout) v.layout = Object.fromEntries(Object.entries(v.layout).filter(([id]) => keep(id)));
    if (Array.isArray(v.edges)) v.edges = v.edges.filter(e => typeof e === 'string' ? lines.has(e) : keep(e.from) && keep(e.to));
    (v.containers || []).forEach(c => { c.nodeIds = (c.nodeIds || []).filter(keep); });
  });
  return out;
};
const V = [
  ['2023: docks and rides', ['planner', 'forecast', 'warehouse', 'battery', 'charging', 'city', 'status', 'flags', 'monitoring']],
  ['2024: batteries and charging', ['planner', 'forecast', 'warehouse', 'city', 'status', 'flags', 'monitoring']],
  ['2025: forecasts and monitoring', ['planner', 'status', 'flags']],
  ['2026: rebalancing', []],
].map(([label, drop]) => ({ label, model: without(full, drop) }));

const $ = id => document.getElementById(id), at = $('at'), marks = $('marks'), play = $('play');
let i = 0, timer = null;
at.max = V.length - 1;
// the Fleet service, whose cards lay themselves out; stableLayout: false draws each release as its own map would be drawn
const map = render($('map'), V[0].model, { view: 'fleet', stableLayout: false });
window.map = map;
function show(k) {
  i = k; at.value = k;
  const d = k ? diff(V[k - 1].model, V[k].model) : null, s = d ? d.summary : [];
  map.update(marks.checked && d ? d.model : V[k].model);
  $('label').textContent = `${k + 1} of ${V.length}: ${V[k].label}`;
  $('said').textContent = !d ? 'The first release.' : !s.length ? 'Nothing on the map changed.' : s.slice(0, 6).join('; ') + (s.length > 6 ? `; and ${s.length - 6} more` : '') + '.';
}
const stop = () => { clearInterval(timer); timer = null; play.textContent = 'Play'; };
at.addEventListener('input', () => { stop(); show(+at.value); });
marks.addEventListener('change', () => show(i));
play.addEventListener('click', () => {
  if (timer) return stop();
  if (i === V.length - 1) show(0);
  play.textContent = 'Pause';
  timer = setInterval(() => i < V.length - 1 ? show(i + 1) : stop(), 2200);
});
show(0);
</script>
