<!doctype html>
<!--
  /visual page template. visual.py injects the page data into #visual-data; everything
  else renders client-side from this one file, with lib/umlimator.js inlined by umlimator.py. No build, no runtime dependencies.
  Section layout adapted from BuilderIO/skills visual-recap + visual-plan (MIT, (c) 2026 Builder.io).
  Diagram style (semantic palette, mask-under-fill nodes, grid canvas, orthogonal routes,
  arrow markers) and viewer UX (camera zoom/pan with reading depths, minimap, node focus panel,
  node finder, export) adapted from tt-a1i/archify (MIT, (c) 2026 tt-a1i, (c) 2025 Cocoon AI).
  See ../THIRD_PARTY_NOTICES.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__VISUAL_TITLE__</title>
<script>
  try { const t = localStorage.getItem('visual-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/*__UMLIMATOR_THEME__*/
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--um-bg); color: var(--um-text); font: 15px/1.6 var(--um-sans); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--um-grid) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--um-cyan); }
  code, .mono { font-family: var(--um-mono); font-size: .86em; }
  :not(pre) > code { overflow-wrap: anywhere; background: var(--um-panel-2); border: 1px solid var(--um-border); padding: .05em .35em; border-radius: 5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--um-bg) 82%, transparent); border-bottom: 1px solid var(--um-border); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; height: 50px; }
  .bar .brand { font: 700 12px var(--um-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--um-muted); white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .bar nav a { color: var(--um-muted); text-decoration: none; font: 500 13px var(--um-sans); padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
  .bar nav a:hover { color: var(--um-text); background: var(--um-panel); }
  .btn { background: var(--um-panel); border: 1px solid var(--um-border-2); color: var(--um-text); border-radius: 8px; height: 32px; padding: 0 12px; font: 500 13px var(--um-sans); cursor: pointer; }
  .btn:hover { border-color: var(--um-cyan); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--um-cyan); outline-offset: 2px; }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--um-mono); color: var(--um-muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--um-green); border-color: var(--um-green); background: var(--um-green-f); }
  .kind.plan { color: var(--um-cyan); border-color: var(--um-cyan); background: var(--um-cyan-f); }
  .kind.explore { color: var(--um-violet); border-color: var(--um-violet); background: var(--um-violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--um-muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--um-panel); border: 1px solid var(--um-border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--um-mono); }
  .stat span { color: var(--um-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--um-green); } .stat.del b { color: var(--um-rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--um-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--um-muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--um-border); }
  h2 .count { color: var(--um-dim); }
  .card { background: var(--um-panel); border: 1px solid var(--um-border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--um-mono); background: var(--um-panel-2); border: 1px solid var(--um-border-2); color: var(--um-muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--um-muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--um-mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--um-green); } .t-changed, .t-modified, .t-change { color: var(--um-cyan); } .t-removed, .t-delete { color: var(--um-rose); }
  .t-fix { color: var(--um-amber); } .t-refactor { color: var(--um-violet); } .t-docs, .t-chore { color: var(--um-slate); } .t-risk { color: var(--um-orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--um-mono); color: var(--um-muted); background: var(--um-panel-2); border: 1px solid var(--um-border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--um-text); border-color: var(--um-cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--um-mono); color: var(--um-muted); }
  .area { border-top: 1px solid var(--um-border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--um-mono); color: var(--um-text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--um-dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--um-mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--um-panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--um-green); } .st.M { color: var(--um-amber); } .st.D { color: var(--um-rose); } .st.R { color: var(--um-violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--um-dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--um-green); } .minus { color: var(--um-rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--um-border-2); }
  .blocks i.g { background: var(--um-green); } .blocks i.r { background: var(--um-rose); }
  .fnote { grid-column: 2 / 4; color: var(--um-muted); font: 12.5px/1.45 var(--um-sans); margin-top: -2px; }

  /* ================= map mode app shell =================
     Layout: views (column browser) left, map on top, details strip below the map. */
  body.map-mode { overflow: hidden; height: 100dvh; background: var(--um-bg); background-image: none; }
  .mapapp { display: grid; grid-template-columns: 0 minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); height: 100dvh; max-width: none; padding: 0; transition: grid-template-columns .22s ease; }
  body.tree-open .mapapp { grid-template-columns: min(var(--browser-width, 224px), 38vw) minmax(0, 1fr); }
  .mbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--um-border); background: var(--um-bg); z-index: 10; min-width: 0; }
  .mbrand { display: flex; align-items: center; gap: 8px; font: 650 14.5px var(--um-sans); white-space: nowrap; min-width: 0; }
  .mbrand i { width: 9px; height: 9px; border-radius: 50%; background: var(--um-accent); flex: none; }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-left: 10px; border-left: 1px solid var(--um-border); }
  .crumb { font: 500 12.5px var(--um-sans); color: var(--um-muted); background: none; border: 0; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button.crumb:hover { color: var(--um-text); background: var(--um-panel-2); }
  .crumb.cur { color: var(--um-text); font-weight: 600; background: var(--um-accent-f, var(--um-cyan-f)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--um-accent) 40%, transparent); cursor: default; }
  .crumb-sep { color: var(--um-dim); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { #m-pause { display: none; } }
  .ibtn.txt { width: auto; padding: 0 11px; font-size: 13px; white-space: nowrap; }
  /* stories (#69): the legend gives way to the story's caption bar; recording a story, a panel top right */
  .mapapp.story .m-legend { display: none; }
  .m-rec { position: absolute; right: 16px; top: 14px; z-index: 6; width: min(330px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto; box-sizing: border-box; background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 12px; box-shadow: var(--um-shadow); padding: 10px 12px; font: 12.5px var(--um-sans); }
  .m-rec .t { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; } .m-rec .t b { color: var(--um-rose); font-weight: 650; } .m-rec .t span { color: var(--um-muted); }
  .m-rec input { box-sizing: border-box; width: 100%; font: 12.5px var(--um-sans); color: var(--um-text); background: var(--um-bg); border: 1px solid var(--um-border-2); border-radius: 6px; padding: 4px 7px; }
  .m-rec ol { margin: 8px 0; padding-left: 20px; display: grid; gap: 6px; } .m-rec li span { display: block; color: var(--um-muted); font-size: 11.5px; margin-bottom: 2px; }
  .m-rec li { position: relative; padding-right: 26px; } .m-rec li button { position: absolute; right: 0; bottom: 2px; border: 0; background: none; color: var(--um-muted); cursor: pointer; }
  .m-rec .b { display: flex; gap: 6px; justify-content: flex-end; } .m-rec .b button { font: 600 12px var(--um-sans); border-radius: 7px; border: 1px solid var(--um-border-2); background: var(--um-panel); color: var(--um-text); padding: 4px 10px; cursor: pointer; }
  .m-rec .b button:hover, .m-rec li button:hover { border-color: var(--um-accent); color: var(--um-accent); }
  .pbtn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--um-text); background: var(--um-text); color: var(--um-bg); font: 600 13px var(--um-sans); cursor: pointer; white-space: nowrap; }
  .pbtn:hover { opacity: .88; }
  .kbd { font: 600 10.5px var(--um-mono); border: 1px solid var(--um-border-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--um-muted); background: var(--um-panel); white-space: nowrap; }
  .findbtn { display: flex; align-items: center; gap: 8px; width: min(250px, 24vw); height: 32px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--um-border-2); background: var(--um-panel); color: var(--um-muted); font: 13px var(--um-sans); cursor: pointer; flex: none; }
  .findbtn:hover { border-color: var(--um-accent); }
  .findbtn .ft { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu { position: relative; }
  .menu-pop[hidden] { display: none; }
  .menu-pop { position: absolute; right: 0; top: 40px; min-width: 210px; padding: 5px; border-radius: 10px; background: var(--um-panel); border: 1px solid var(--um-border-2); box-shadow: var(--um-shadow); display: grid; z-index: 30; }
  .menu-pop button { text-align: left; background: none; border: 0; color: var(--um-text); font: 500 13px var(--um-sans); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .menu-pop button:hover { background: var(--um-panel-2); color: var(--um-accent); }
  .menu-pop button[aria-pressed="true"] { color: var(--um-accent); font-weight: 650; }
  .menu-pop hr { border: 0; border-top: 1px solid var(--um-border); margin: 4px 0; width: 100%; }

  .outline { grid-row: 2; grid-column: 1; } /* the views list: its look is in lib/umlimator.js */

  .mmain { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .mstage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .mcanvas { position: absolute; inset: 0; }
  /* view header: a pill that opens on tap */
  .vpill { position: absolute; left: 16px; top: 14px; z-index: 4; max-width: calc(100% - 32px); }
  .vpill .pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 999px; padding: 5px 8px 5px 14px; box-shadow: var(--um-shadow); font: 13px var(--um-sans); color: var(--um-text); white-space: nowrap; cursor: pointer; }
  .vpill .pill b { overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
  .vpill .pill .n { background: var(--um-panel-2); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--um-muted); }
  .vpill .pill:hover, .vpill .pill[aria-expanded="true"] { border-color: var(--um-accent); }
  .view-note { margin: 8px 4px 0; max-width: 760px; color: var(--um-muted); font: 12px/1.55 var(--um-sans); }
  .vpop { margin-top: 8px; width: 380px; max-width: 100%; background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 12px; box-shadow: var(--um-shadow); padding: 12px 14px; font-size: 12.5px; max-height: 60vh; overflow: auto; }
  .vpop[hidden] { display: none; }
  .vpop h4 { margin: 0 0 4px; font: 650 14px var(--um-sans); }
  .vpop p { margin: 0 0 8px; color: var(--um-muted); }
  .vpop ol { margin: 0 0 8px; padding-left: 20px; columns: 2; column-gap: 20px; }
  .vpop li { break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vpop .vm { font: 11px var(--um-mono); color: var(--um-dim); }
  .vpop .back { border: 0; background: none; color: var(--um-accent); font: 600 12px var(--um-sans); padding: 0 0 6px; cursor: pointer; }
  .vlanes { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin: 0 0 8px; font-size: 12px; }
  .vlanes span { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--um-border-2); border-radius: 999px; padding: 1px 9px 1px 3px; font-weight: 600; }
  .vlanes em { font-style: normal; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--um-accent); color: var(--um-accent-fg); font-size: 9.5px; }
  .vlanes i { font-style: normal; color: var(--um-dim); }
  /* help: keys in a popover */
  .hpop { position: fixed; right: 14px; top: 58px; width: 300px; background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 12px; box-shadow: var(--um-shadow); padding: 12px 14px; z-index: 40; font-size: 12.5px; }
  .hpop[hidden] { display: none; }
  .hpop::before { content: ""; position: absolute; right: 9px; top: -6px; width: 10px; height: 10px; background: var(--um-panel); border-left: 1px solid var(--um-border-2); border-top: 1px solid var(--um-border-2); transform: rotate(45deg); }
  .hpop dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 8px 0 0; }
  .hpop dt { font: 600 11px var(--um-mono); color: var(--um-accent); } .hpop dd { margin: 0; color: var(--um-muted); }
  /* loading: ghost nodes; empty: a friendly card */
  .ghosts { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .ghosts span { position: absolute; height: 52px; border-radius: 10px; border: 1px solid var(--um-border); background: linear-gradient(90deg, var(--um-panel-2) 0%, var(--um-panel) 50%, var(--um-panel-2) 100%); background-size: 200% 100%; animation: shim 1.4s linear infinite; }
  @keyframes shim { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .ghosts span { animation: none; } }
  /* ⌘K command box */
  .scrim { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; background: color-mix(in srgb, var(--um-bg) 55%, transparent); backdrop-filter: blur(2px); }
  .scrim[hidden] { display: none; }
  .pal { width: min(560px, calc(100vw - 32px)); background: var(--um-panel); border: 1px solid var(--um-border-2); border-radius: 14px; box-shadow: var(--um-shadow); overflow: hidden; }
  .pal .in { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--um-border); color: var(--um-muted); }
  .pal input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--um-text); font: 16px var(--um-sans); }
  .pal .res { max-height: min(52vh, 440px); overflow: auto; padding: 4px 6px 6px; }
  .pal .gt { font: 700 10.5px var(--um-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--um-muted); padding: 8px 8px 3px; }
  .fr { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 8px; border: 0; background: none; color: var(--um-text); text-align: left; cursor: pointer; font: 13px var(--um-sans); }
  .fr.on { background: var(--um-panel-2); box-shadow: inset 2px 0 0 var(--um-accent); }
  .fr i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .fr b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr span { margin-left: auto; color: var(--um-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .fr mark { background: color-mix(in srgb, var(--um-accent) 22%, transparent); color: inherit; border-radius: 2px; }
  .pal .none { padding: 22px 16px; text-align: center; color: var(--um-muted); font-size: 13px; }
  .pal .none h4 { margin: 4px 0; color: var(--um-text); font: 650 14px var(--um-sans); }
  .pal .none button { border: 0; background: none; color: var(--um-accent); font: 600 13px var(--um-sans); cursor: pointer; }
  .pal .pft { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--um-border); font-size: 11.5px; color: var(--um-muted); }

  svg .node.planned .n-body, svg .node.planned .n-label, svg .node.planned .n-sub, svg .node.planned .n-sigil { opacity: .58; }

  /* phone: still a map; the header folds to one line and details slide up from the bottom */
  @media (max-width: 820px) {
    .mapapp, body.tree-open .mapapp { grid-template-columns: 0 minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); }
    .mbar { gap: 8px; padding: 0 10px; }
    .crumbs, #m-export, .menu, #m-help, .findbtn .ft, .findbtn .kbd { display: none; }
    .findbtn { width: 32px; padding: 0; justify-content: center; }
    .mbrand { flex: 1; } .mbrand span { overflow: hidden; text-overflow: ellipsis; }
    .outline { position: fixed; top: 48px; bottom: 0; left: 0; width: min(320px, 88vw); z-index: 20; box-shadow: var(--um-shadow); }
    .mapapp .panel { position: fixed; left: 0; right: 0; bottom: 0; height: auto; max-height: 58dvh; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.15); }
    .panel::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--um-border-2); margin: 8px auto 0; }
    .vpop ol { columns: 1; }
  }

  /* endpoints */
  .eps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  @media (max-width: 420px) { .eps { grid-template-columns: 1fr; } }
  .ep { padding: 14px 16px; }
  .ep .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .method { font: 700 11px var(--um-mono); padding: 3px 8px; border-radius: 6px; letter-spacing: .06em; border: 1px solid currentColor; }
  .m-GET { color: var(--um-green); background: var(--um-green-f); } .m-POST { color: var(--um-cyan); background: var(--um-cyan-f); }
  .m-PUT, .m-PATCH { color: var(--um-amber); background: var(--um-amber-f); } .m-DELETE { color: var(--um-rose); background: var(--um-rose-f); }
  .m-WS, .m-SSE, .m-CLI, .m-CMD, .m-EVENT { color: var(--um-violet); background: var(--um-violet-f); }
  .ep .path { font: 600 14px var(--um-mono); word-break: break-all; }
  .ep .desc { color: var(--um-muted); font-size: 14px; margin-top: 6px; }
  .ep details { margin-top: 8px; } .ep summary { cursor: pointer; color: var(--um-muted); font: 600 12px var(--um-mono); }
  pre.json { margin: 6px 0 0; padding: 10px 12px; background: var(--um-bg-2); border: 1px solid var(--um-border); border-radius: 8px; font: 12px/1.5 var(--um-mono); overflow-x: auto; }

  /* steps */
  .steps { counter-reset: s; display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; position: relative; padding-bottom: 18px; }
  .step::before { content: ""; position: absolute; left: 19px; top: 38px; bottom: 0; width: 2px; background: var(--um-border); }
  .step:last-child::before { display: none; }
  .step .dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 14px var(--um-mono); color: var(--um-cyan); background: var(--um-cyan-f); border: 1px solid var(--um-cyan); }
  .step .body { padding: 14px 18px; }
  .step h3 { margin: 0 0 4px; font-size: 16px; } .step .detail { color: var(--um-muted); font-size: 14.5px; }

  /* hunks */
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 8px 0; border-bottom: 1px solid var(--um-border); scrollbar-width: thin; }
  .tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--um-muted); font: 600 12.5px var(--um-mono); padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--um-text); background: var(--um-panel-2); border-color: var(--um-border); margin-bottom: -1px; }
  .hpanel { display: none; } .hpanel.on { display: block; }
  .hhead { padding: 14px 18px 10px; } .hhead .fn { font: 600 13px var(--um-mono); color: var(--um-muted); } .hhead .hs { margin-top: 4px; font-size: 15px; }
  .hbody { display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .hbody.has-notes { grid-template-columns: minmax(0, 1fr) 300px; } }
  .diff { overflow-x: auto; border-top: 1px solid var(--um-border); background: var(--um-bg-2); }
  .diff table { border-collapse: collapse; width: 100%; font: 12.5px/1.55 var(--um-mono); }
  .diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
  .diff td.ln { color: var(--um-dim); text-align: right; user-select: none; width: 1%; padding: 0 8px; }
  .diff td.sg { width: 1%; user-select: none; padding: 0 4px; color: var(--um-dim); }
  .diff td.mk { width: 1%; padding: 0 4px; }
  .diff tr.add { background: var(--um-add-bg); } .diff tr.add td.code, .diff tr.add td.sg { color: var(--um-add-tx); }
  .diff tr.del { background: var(--um-del-bg); } .diff tr.del td.code, .diff tr.del td.sg { color: var(--um-del-tx); }
  .diff tr.hdr td { color: var(--um-violet); background: var(--um-panel-2); padding: 3px 10px; }
  .diff.newfile tr.add { background: none; } .diff.newfile tr.add td.code { color: var(--um-text); } .diff.newfile td.sg, .diff.newfile td.ln.o { display: none; }
  .diff tr.noted td.code { box-shadow: inset 2px 0 0 var(--um-amber); }
  .pin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--um-amber); color: #111; font: 700 10px var(--um-mono); }
  .notes { border-top: 1px solid var(--um-border); padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 1000px) { .notes { border-left: 1px solid var(--um-border); } }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--um-muted); }
  .note b { color: var(--um-text); font-weight: 600; }
  .more { padding: 8px 18px; color: var(--um-dim); font: 12px var(--um-mono); border-top: 1px solid var(--um-border); }

  /* risks / tests / questions */
  .two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .list { padding: 6px 0; }
  .li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--um-border); align-items: start; font-size: 14.5px; }
  .li:first-child { border-top: none; }
  .lvl { font: 700 10px var(--um-mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-top: 2px; }
  .lvl.high { color: var(--um-rose); } .lvl.med, .lvl.medium { color: var(--um-amber); } .lvl.low { color: var(--um-green); }
  .li input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--um-green); }
  .li .cmd { display: block; margin-top: 4px; color: var(--um-muted); }
  .q { padding: 14px 18px; border-top: 1px solid var(--um-border); } .q:first-child { border-top: none; }
  .q .qq { font-weight: 600; } .q .qd { color: var(--um-muted); font-size: 14px; margin-top: 4px; }
  .q .qd b { color: var(--um-green); font-weight: 600; }
  footer { padding: 34px 0 44px; color: var(--um-dim); font: 12px var(--um-mono); }
  .empty { color: var(--um-dim); padding: 14px 18px; }
</style>
</head>
<body>
<div class="bar"><div class="wrap"><span class="brand">/visual</span><nav id="nav"></nav><button class="btn" id="theme" type="button" aria-label="Toggle theme">◐</button></div></div>
<main class="wrap" id="app"></main>
<script id="visual-data" type="application/json">/*__VISUAL_DATA__*/null</script>
<script type="module">
/*__UMLIMATOR_LIB__*/
/* ================= the page (umlimator.py render): the map viewer, or a recap / plan / explore document ================= */
const D = JSON.parse(document.getElementById('visual-data').textContent) || {};
const Q = new URLSearchParams(location.hash.slice(1));
if (Q.get('reader')) [...(D.nodes || []), ...(D.views || []).flatMap(v => Object.values(v.nodeOverrides || {}))].forEach(n => { // a reader copy drops "check" marks
  const clean = b => String(b).replace(/\s*·\s*check$/i, '').replace(/^check$/i, '');
  if (n.badge) { const b = clean(n.badge); if (b) n.badge = b; else delete n.badge; }
  if (Array.isArray(n.badges)) n.badges = n.badges.map(b => b && typeof b === 'object' ? { ...b, text: clean(b.text) } : clean(b)).filter(b => b && (typeof b !== 'object' || b.text)); });
if (Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
const INSTANT = !!(Q.get('shot') || Q.get('check') || Q.get('still') || Q.get('pdf')); // this page's map draws without animation (its own handle only)
const errors = []; addEventListener('error', e => errors.push(String(e.message || e)));
document.adoptedStyleSheets = [...document.adoptedStyleSheets, sheet()];
const app = document.getElementById('app');
function renderDoc() {
const kind = D.kind || 'explore';
const L = {
  recap:   { key: 'Key changes', files: 'Files changed', dia: 'What changed', tests: 'What to test', hunks: 'Annotated changes' },
  plan:    { key: 'What will change', files: 'Files to touch', dia: 'Design', tests: 'Verification', hunks: 'Code sketches' },
  explore: { key: 'Highlights', files: 'Map', dia: 'Diagram', tests: 'Try it', hunks: 'Key code' },
}[kind] || {};
const labels = Object.assign({}, L, D.labels || {});
const navItems = [];
const sec = (id, title, count) => { navItems.push([id, title]);
  const s = h(`<section id="${id}"><h2>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ''}</h2></section>`);
  app.appendChild(s); return s; };
const base = p => p.split('/').pop();
const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
const hunkByFile = {};

/* ---------- hero ---------- */
const m = D.meta || {};
const eyebrow = [`<span class="kind ${esc(kind)}">${esc(kind)}</span>`];
if (m.project) eyebrow.push(`<span>${esc(m.project)}</span>`);
if (m.branch) eyebrow.push(`<span>⎇ ${esc(m.branch)}${m.base ? ' → ' + esc(m.base) : ''}</span>`);
if (D.source) eyebrow.push(`<span>◇ ${esc(D.source)}</span>`);
const st = D.stats || {};
const stats = [];
if (st.files != null) stats.push(`<div class="stat"><b>${st.files}</b><span>files</span></div>`);
if (st.add != null) stats.push(`<div class="stat add"><b>+${st.add}</b><span>added</span></div>`);
if (st.del != null) stats.push(`<div class="stat del"><b>−${st.del}</b><span>removed</span></div>`);
if (st.commits) stats.push(`<div class="stat"><b>${st.commits}</b><span>commits</span></div>`);
if (kind === 'plan' && (D.steps || []).length) stats.push(`<div class="stat"><b>${D.steps.length}</b><span>steps</span></div>`);
if (kind === 'plan' && (D.files || []).length && st.files == null) stats.push(`<div class="stat"><b>${D.files.length}</b><span>files</span></div>`);
if ((D.questions || []).length) stats.push(`<div class="stat"><b>${D.questions.length}</b><span>open questions</span></div>`);
app.appendChild(h(`<header class="hero"><div class="eyebrow">${eyebrow.join('<span>·</span>')}</div>
  <h1>${inline(D.title || 'Visual')}</h1>${D.subtitle ? `<p class="sub">${inline(D.subtitle)}</p>` : ''}
  <div class="stats">${stats.join('')}</div></header>`));

if (D.summary) sec('summary', 'Summary').appendChild(h(`<div class="card summary prose">${md(D.summary)}</div>`));

/* ---------- key changes + files ---------- */
const keys = D.keyChanges || [];
const files = D.files || [];
if (keys.length || files.length) {
  const s = sec('changes', keys.length ? labels.key : labels.files);
  const grid = h(`<div class="split"></div>`); s.appendChild(grid);
  if (keys.length) {
    const col = h(`<div class="changes"></div>`);
    keys.forEach((k, i) => {
      const tag = k.tag ? `<span class="tag t-${esc(String(k.tag).toLowerCase())}">${esc(k.tag)}</span>` : '';
      const chips = (k.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
      col.appendChild(h(`<div class="card change"><div class="num">${String(i + 1).padStart(2, '0')}</div><div>
        <h3>${inline(k.title)} ${tag}</h3>${k.detail ? `<div class="detail prose">${md(k.detail)}</div>` : ''}
        ${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
    });
    grid.appendChild(col);
  }
  if (files.length) grid.appendChild(renderFiles(files));
  if (!keys.length) grid.style.gridTemplateColumns = '1fr';
}

function normStatus(f) {
  const s = String(f.status || 'M').toUpperCase();
  return ({ ADD: 'A', ADDED: 'A', NEW: 'A', CREATE: 'A', MODIFY: 'M', MODIFIED: 'M', CHANGE: 'M', EDIT: 'M',
    DELETE: 'D', DELETED: 'D', REMOVE: 'D', RENAME: 'R', RENAMED: 'R' })[s] || s[0];
}
function renderFiles(files) {
  const aside = h(`<aside class="card files"></aside>`);
  const tot = files.reduce((a, f) => [a[0] + (f.add || 0), a[1] + (f.del || 0)], [0, 0]);
  const hasNums = files.some(f => f.add || f.del);
  aside.appendChild(h(`<div class="head"><span>${esc(labels.files)} · ${files.length}</span>${hasNums ? `<span><span class="plus">+${tot[0]}</span> <span class="minus">−${tot[1]}</span></span>` : ''}</div>`));
  const areas = {};
  files.forEach(f => (areas[f.area || '(root)'] ||= []).push(f));
  const many = Object.keys(areas).length > 8;
  Object.entries(areas).forEach(([area, fs]) => {
    const a = fs.reduce((x, f) => [x[0] + (f.add || 0), x[1] + (f.del || 0)], [0, 0]);
    const d = h(`<details class="area" ${many && fs.length > 6 ? '' : 'open'}><summary>${esc(area)}<span class="n">${hasNums ? `<span class="plus">+${a[0]}</span> <span class="minus">−${a[1]}</span>` : fs.length}</span></summary></details>`);
    fs.forEach(f => {
      const s = normStatus(f), tot = (f.add || 0) + (f.del || 0);
      const g = tot ? Math.round(5 * (f.add || 0) / tot) : 0;
      const blocks = hasNums ? `<span class="blocks">${[0,1,2,3,4].map(i => `<i class="${tot ? (i < g ? 'g' : 'r') : ''}"></i>`).join('')}</span>` : '';
      const nums = hasNums ? `${f.binary ? '<span>bin</span>' : `<span class="plus">+${f.add || 0}</span><span class="minus">−${f.del || 0}</span>`}${blocks}` : '';
      const pre = f.prefix ?? (f.area ? f.area + '/' : ''), rel = pre && f.path.startsWith(pre) && f.path !== pre ? f.path.slice(pre.length) : f.path;
      const row = h(`<div class="frow" data-path="${esc(f.path)}" title="${esc(f.path)}${f.from ? ' (from ' + esc(f.from) + ')' : ''}">
        <span class="st ${s}">${s}</span><span class="p"><bdi><span class="dir">${esc(dir(rel))}</span>${esc(base(rel))}</bdi></span>
        <span class="ad">${nums}</span>${f.note ? `<div class="fnote">${inline(f.note)}</div>` : ''}</div>`);
      d.appendChild(row);
    });
    aside.appendChild(d);
  });
  return aside;
}

/* ---------- diagrams (archify-style inline SVG, zoom + pan) ---------- */
const cams = [];
window.__geos = [];
function renderDiagram(dg) {
  const geo = layoutGraph(dg, false);
  const used = [...new Set(geo.nodes.map(n => n.k))];
  const col = k => `var(--um-${KIND[k][0]})`, fill = k => `var(--um-${KIND[k][0]}-f)`;
  const legend = used.map(k => `<span><i style="border-color:${col(k)};background:${fill(k)}"></i>${KIND[k][1]}</span>`).join('')
    + (geo.nodes.some(n => CHG[String(n.change || '').toLowerCase()]) ? '<span style="color:var(--um-green)">● new</span><span style="color:var(--um-amber)">● changed</span>' : '');
  const fig = h(`<figure class="card dia"><figcaption><div class="ft">${inline(dg.title || '')}</div><div class="legend">${legend}</div></figcaption>
    <div class="canvas cam" tabindex="0" aria-label="Diagram canvas: drag to pan, pinch or Ctrl+scroll to zoom">${svgOf(geo, { title: dg.title })}
      <div class="ctl mini-ctl"><button data-z="out" title="Zoom out (−)">−</button><button data-z="fit" class="pct" title="Fit (0)">100%</button><button data-z="in" title="Zoom in (+)">+</button><button data-z="flow" title="Animate flow direction">≋</button><button data-z="full" title="Full screen (F)">⛶</button></div>
      <div class="cam-hint">Drag to pan · pinch or ⌘/Ctrl + scroll to zoom</div></div>
    ${dg.caption ? `<div class="fc">${inline(dg.caption)}</div>` : ''}</figure>`);
  fig._geo = geo; window.__geos.push([fig, geo, dg.title || 'diagram']);
  return fig;
}
function initDocCameras() {
  document.querySelectorAll('figure.dia').forEach(fig => {
    const el = fig.querySelector('.canvas'), svg = el.querySelector('svg'), geo = fig._geo, b = geo.bounds;
    const sizeIt = () => { if (el.classList.contains('full')) { el.style.height = ''; return; } const w = el.clientWidth || 800; el.style.height = Math.round(Math.max(220, Math.min(680, w * b.h / b.w + 8))) + 'px'; };
    sizeIt();
    const pct = el.querySelector('.pct');
    const cam = new Camera(el, svg, { wheel: 'ctrl', maxFit: 1, onChange: c => { pct.textContent = Math.round(c.s.k * 100) + '%'; } });
    cam.setSvg(svg, b); cam.fit(false); cams.push(cam);
    el.querySelector('.ctl').addEventListener('click', ev => {
      const z = ev.target.closest('button')?.dataset.z; if (!z) return;
      if (z === 'in') cam.zoomAt(1.4, null, null, true); else if (z === 'out') cam.zoomAt(1 / 1.4, null, null, true);
      else if (z === 'fit') cam.fit(); else if (z === 'flow') { el.classList.toggle('flowing'); ev.target.closest('button').classList.toggle('on'); } else if (z === 'full') { el.classList.toggle('full'); document.body.classList.toggle('noscroll', el.classList.contains('full')); sizeIt(); requestAnimationFrame(() => cam.fit(false)); }
    });
    el.addEventListener('keydown', ev => {
      if (ev.key === '+' || ev.key === '=') cam.zoomAt(1.4, null, null, true); else if (ev.key === '-') cam.zoomAt(1 / 1.4, null, null, true);
      else if (ev.key === '0') cam.fit(); else if (ev.key === 'f' || ev.key === 'F') el.querySelector('[data-z=full]').click();
      else if (ev.key === 'Escape' && el.classList.contains('full')) el.querySelector('[data-z=full]').click();
      else if (ev.key.startsWith('Arrow')) { const d = 60, m = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[ev.key]; cam.pan(m[0], m[1], true); }
      else return; ev.preventDefault();
    });
    addEventListener('resize', () => { sizeIt(); if (!cam.touched) cam.fit(false); else cam.apply(); });
  });
}
if ((D.diagrams || []).length) {
  const s = sec('diagram', labels.dia);
  D.diagrams.forEach(dg => { try { s.appendChild(renderDiagram(dg)); } catch (err) { s.appendChild(h(`<div class="card empty">Diagram failed: ${esc(err.message)}</div>`)); } });
}

/* ---------- endpoints ---------- */
if ((D.endpoints || []).length) {
  const s = sec('endpoints', 'Endpoints', D.endpoints.length);
  const g = h(`<div class="eps"></div>`); s.appendChild(g);
  const pj = v => esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2));
  D.endpoints.forEach(e => {
    const M = String(e.method || 'GET').toUpperCase(), ch = CHG[String(e.change || '').toLowerCase()];
    g.appendChild(h(`<div class="card ep"><div class="line"><span class="method m-${esc(M)}">${esc(M)}</span><span class="path">${esc(e.path)}</span>
      ${ch ? `<span class="tag" style="color:var(--um-${ch[0]})">${ch[1]}</span>` : ''}${e.auth ? `<span class="tag t-risk">${esc(e.auth)}</span>` : ''}</div>
      ${e.summary ? `<div class="desc">${inline(e.summary)}</div>` : ''}
      ${e.request != null ? `<details><summary>request</summary><pre class="json">${pj(e.request)}</pre></details>` : ''}
      ${e.response != null ? `<details><summary>response</summary><pre class="json">${pj(e.response)}</pre></details>` : ''}</div>`));
  });
}

/* ---------- steps (plan) ---------- */
if ((D.steps || []).length) {
  const s = sec('steps', 'Steps', D.steps.length);
  const list = h(`<div class="steps"></div>`); s.appendChild(list);
  D.steps.forEach((st, i) => {
    const chips = (st.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
    list.appendChild(h(`<div class="step"><div class="dot">${i + 1}</div><div class="card body"><h3>${inline(st.title)}</h3>
      ${st.detail ? `<div class="detail prose">${md(st.detail)}</div>` : ''}${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
  });
}

/* ---------- annotated hunks ---------- */
const hunks = (D.hunks || []).filter(x => (x.lines && x.lines.length) || x.code);
if (hunks.length) {
  const s = sec('hunks', labels.hunks, hunks.length);
  const box = h(`<div class="card"></div>`); s.appendChild(box);
  const tabs = h(`<div class="tabs" role="tablist"></div>`); box.appendChild(tabs);
  hunks.forEach((hk, i) => {
    const lines = hk.lines && hk.lines.length ? hk.lines : String(hk.code).replace(/\n$/, '').split('\n').map((s, j) => ({ t: ' ', n: (hk.start || 1) + j, s }));
    const notes = (hk.notes || []).map((n, j) => ({ ...n, at: n.at ?? (n.match ? lines.findIndex(l => l.s.includes(n.match)) : n.line != null ? lines.findIndex(l => l.n === n.line) : -1), k: j + 1 }));
    const pinAt = {}; notes.forEach(n => { if (n.at >= 0) (pinAt[n.at] ||= []).push(n.k); });
    const tab = h(`<button class="tab" role="tab" aria-selected="${i === 0}" title="${esc(hk.file)}">${esc(hk.label || base(hk.file || 'snippet'))}</button>`);
    tabs.appendChild(tab);
    const isNew = lines.every(l => l.t === '+');
    const rows = (hk.header && !isNew ? `<tr class="hdr"><td colspan="5">${esc(hk.header)}</td></tr>` : '') + lines.map((l, j) => {
      const cls = l.t === '+' ? 'add' : l.t === '-' ? 'del' : '';
      return `<tr class="${cls}${pinAt[j] ? ' noted' : ''}"><td class="ln o">${l.o ?? ''}</td><td class="ln">${l.n ?? ''}</td><td class="mk">${(pinAt[j] || []).map(k => `<span class="pin">${k}</span>`).join('')}</td><td class="sg">${l.t === ' ' ? '' : esc(l.t)}</td><td class="code">${esc(l.s)}</td></tr>`;
    }).join('');
    const panel = h(`<div class="hpanel${i === 0 ? ' on' : ''}" role="tabpanel"><div class="hhead"><div class="fn">${esc(hk.file || '')}${hk.lang ? ' · ' + esc(hk.lang) : ''}</div>${hk.summary ? `<div class="hs">${inline(hk.summary)}</div>` : ''}</div>
      <div class="hbody${notes.length ? ' has-notes' : ''}"><div class="diff${isNew ? ' newfile' : ''}"><table>${rows}</table></div>
      ${notes.length ? `<div class="notes">${notes.map(n => `<div class="note"><span class="pin">${n.k}</span><div>${inline(n.text)}</div></div>`).join('')}</div>` : ''}</div>
      ${hk.truncated ? `<div class="more">Excerpt: lines ${lines[0].n ?? lines[0].o}–${lines[lines.length - 1].n ?? lines[lines.length - 1].o}${isNew ? ' of a new file' : ''}${hk.hunkCount > 1 ? ` · ${hk.hunkCount} hunks in this file` : ''}</div>` : ''}</div>`);
    box.appendChild(panel);
    tab.addEventListener('click', () => select(i));
    if (hk.file) hunkByFile[hk.file] = i;
  });
  function select(i) {
    box.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', j === i));
    box.querySelectorAll('.hpanel').forEach((p, j) => p.classList.toggle('on', j === i));
  }
  window.__selectHunk = (i) => { select(i); s.scrollIntoView({ behavior: 'smooth' }); };
}

/* ---------- risks + tests ---------- */
const risks = D.risks || [], tests = D.tests || [];
if (risks.length || tests.length) {
  navItems.push(['checks', risks.length ? 'Risks' : labels.tests]);
  const s = h(`<section id="checks"><div class="two"></div></section>`); app.appendChild(s);
  const two = s.firstChild;
  if (risks.length) two.appendChild(h(`<div><h2>Risks <span class="count">${risks.length}</span></h2><div class="card list">${risks.map(r => {
    const o = typeof r === 'string' ? { text: r } : r; const lv = String(o.level || 'med').toLowerCase();
    return `<div class="li"><span class="lvl ${esc(lv)}">${esc(lv)}</span><div>${inline(o.text)}</div></div>`; }).join('')}</div></div>`));
  if (tests.length) two.appendChild(h(`<div><h2>${esc(labels.tests)} <span class="count">${tests.length}</span></h2><div class="card list">${tests.map(t => {
    const o = typeof t === 'string' ? { text: t } : t;
    return `<label class="li"><input type="checkbox"><div>${inline(o.text)}${o.cmd ? `<code class="cmd">${esc(o.cmd)}</code>` : ''}</div></label>`; }).join('')}</div></div>`));
}

/* ---------- open questions ---------- */
if ((D.questions || []).length) {
  const s = sec('questions', 'Open questions', D.questions.length);
  s.appendChild(h(`<div class="card">${D.questions.map(q => { const o = typeof q === 'string' ? { q } : q;
    return `<div class="q"><div class="qq">${inline(o.q)}</div>${o.default || o.why ? `<div class="qd">${o.default ? `Recommended: <b>${inline(o.default)}</b>` : ''}${o.why ? ' — ' + inline(o.why) : ''}</div>` : ''}</div>`; }).join('')}</div>`));
}

/* ---------- free sections ---------- */
(D.sections || []).forEach((x, i) => {
  const s = sec('s' + i, x.title || 'Notes');
  s.appendChild(h(`<div class="card summary prose">${md(x.body)}</div>`));
});

app.appendChild(h(`<footer>Generated by /visual${m.generated ? ' · ' + esc(m.generated) : ''}${m.commits && m.commits.length ? ' · ' + m.commits.length + (m.commits.length === 1 ? ' commit' : ' commits') : ''}</footer>`));

/* ---------- nav, cross-links, theme ---------- */
document.getElementById('nav').innerHTML = navItems.map(([id, t]) => `<a href="#${id}">${esc(t)}</a>`).join('');
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-file],[data-path]'); if (!el) return;
  const f = el.dataset.file || el.dataset.path;
  if (hunkByFile[f] != null && window.__selectHunk) return window.__selectHunk(hunkByFile[f]);
  const row = document.querySelector(`.frow[data-path="${CSS.escape(f)}"]`);
  if (row && el !== row) { row.closest('details').open = true; row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('hl'); setTimeout(() => row.classList.remove('hl'), 1600); }
});
document.querySelectorAll('.frow').forEach(r => { if (hunkByFile[r.dataset.path] != null) r.classList.add('link'); });
initDocCameras();
document.getElementById('theme').addEventListener('click', toggleTheme);
}
/* #bench=1&views=a,b&runs=5[&optimize=1] (bench/bench.py): lane planning and layout per view with fresh caches, and a hash of the geometry */
function benchView(ctx, vid, runs, opt) {
  const [v0, ...cards] = vid.split('+'), t = performance.now(); // "view+card+card": the view with those cards unfolded in place (#71)
  if (cards.length) { ctx = mapContext(D, { kinds: true, expand: { [v0]: cards } }); vid = v0; }
  const unfold = performance.now() - t, { V, N, planCache, layoutCache, planOf, buildGeo, optimize } = ctx, out = []; let last = null;
  for (let i = 0; i < runs; i++) {
    delete planCache[vid]; delete layoutCache[vid];
    const t0 = performance.now(); planOf(vid); const t1 = performance.now(), g = last = buildGeo(vid), t2 = performance.now();
    const sig = JSON.stringify([g.nodes.map(n => [n.id, n.x, n.y, n.w, n.h]), g.edges.map(e => [e.from, e.to, e.pts, e.lbl ? [e.lbl.x, e.lbl.y] : null])]);
    let h = 2166136261; for (let k = 0; k < sig.length; k++) h = Math.imul(h ^ sig.charCodeAt(k), 16777619) >>> 0;
    out.push({ plan: t1 - t0, geo: t2 - t1, ...g.ms, issues: routeAudit(g, '').length, cross: g.stats.cross || 0, fallback: g.stats.fallback || 0, hash: h.toString(16) });
  }
  const r = { runs: out, nodes: (V[vid].nodeIds || []).filter(i => N[i]).length, ...(cards.length ? { unfold, edges: last.edges.length } : {}) };
  if (opt && !V[vid].layout && !planOf(vid).hub) { delete layoutCache[vid]; const t = performance.now(), o = optimize(vid); r.optimize = { ms: performance.now() - t, evals: o.evals, score: o.score }; }
  return r;
}
/* #check=1[&views=a,pic-*][&optimize=1] (umlimator.py check, visual.py render): every view drawn off screen, in a shadow root like the canvas,
   with text measured in the page's font as the viewer does, and audited. The layout search (optimize, baked into the page by render) uses the
   font-independent estimate (approx), so a rendered page is the same on every machine. */
function mapAudit(approx) {
  const ctx = mapContext(D, { measure: hostMeasure(document.documentElement), kinds: true }); // line kinds as the viewer draws them (it guesses, for its legend)
  const { views, N, planOf, layoutCache, buildView, chain } = ctx;
  const out = [], host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-99999px;top:0;width:2000px;height:2000px;visibility:hidden';
  document.body.appendChild(host);
  const root = host.attachShadow({ mode: 'open' }); root.adoptedStyleSheets = [sheet()];
  const routes = {}, layouts = {}, laneReport = {};
  views.forEach(v => { const L = planOf(v.id); if (L.hub) laneReport[v.id] = L.lanes.map(l => l.title); });
  if (Q.get('optimize')) views.forEach(v => { if (!v.layout && !approx.planOf(v.id).hub) { const r = approx.optimize(v.id); layouts[v.id] = r.pos; layoutCache[v.id] = r.pos; } });
  const only = (Q.get('views') || '').split(',').filter(Boolean), want = v => !only.length || only.some(p => p.endsWith('*') ? v.id.startsWith(p.slice(0, -1)) : v.id === p);
  views.forEach(v => { if (!want(v) || !(v.nodeIds || []).some(i => N[i])) return; const { g, markup } = buildView(v.id, { tour: !Q.get('still'), openHint: !Q.get('reader') }); root.innerHTML = markup; out.push(...auditSvg(root.firstElementChild, g, 'view ' + v.id)); Object.entries(g.stats || {}).forEach(([k, n]) => { routes[k] = (routes[k] || 0) + n; });
    g.edges.filter(e => e.how === 'fallback').forEach(e => (routes.fallbackEdges ||= []).push(`${v.id}: ${e.from}(${e.fs})→${e.to}(${e.ts})`)); });
  let unfolded = 0; // &expand=1: each view again with each card that unfolds in place (#71) unfolded, one at a time
  if (Q.get('expand')) views.forEach(v => { if (!want(v)) return; (v.nodeIds || []).filter(i => ctx.unfoldable(i, v.id)).forEach(nid => {
    const c2 = mapContext(D, { measure: hostMeasure(document.documentElement), kinds: true, expand: { [v.id]: [nid] } }); c2.planOf(v.id);
    const { g, markup } = c2.buildView(v.id, { tour: !Q.get('still'), openHint: !Q.get('reader') }); root.innerHTML = markup; out.push(...auditSvg(root.firstElementChild, g, `view ${v.id} with ${nid} unfolded`)); unfolded++; }); });
  out.push(...rules(D).filter(r => views.some(v => v.id === r.view && want(v))).map(r => r.message)); // a rule the model breaks (#70): umlimator.py check fails on it
  host.remove();
  const deep = views.filter(v => v.parent).sort((a, b) => chain(b.id).length - chain(a.id).length || (b.nodeIds || []).length - (a.nodeIds || []).length)[0];
  const laneView = laneReport['super-build'] ? 'super-build' : Object.keys(laneReport)[0] || null;
  return { overlaps: out, routes, layouts, lanes: laneReport, checked: views.filter(want).length + ' views' + (Q.get('expand') ? `, and ${unfolded} with a card unfolded` : ''), childView: deep ? deep.id : null, laneView };
}

let mapCtx = null;
try {
  if (D.kind === 'map') {
    mapCtx = mapContext(D, { kinds: true });
    // the map's handle (setView, highlight, tour, play ...) on window.umlimatorMap, for scripts and tests: umlimator.py mcp's page drives it
    if (!Q.get('bench')) { document.querySelector('.bar').remove(); window.umlimatorMap = mountPage(app, D, { params: Q, instant: INSTANT }); }
  } else renderDoc();
} catch (err) { errors.push('render: ' + err.message); console.error(err); }

if (Q.get('bench')) {
  const res = { views: {}, errors };
  try { (Q.get('views') || '').split(',').filter(Boolean).forEach(v => { res.views[v] = benchView(mapCtx, v, +Q.get('runs') || 5, !!Q.get('optimize')); }); }
  catch (err) { errors.push('bench: ' + err.message); }
  const pre = document.createElement('pre'); pre.id = 'bench'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
}
/* ---------- self-check hook for `visual.py check` ---------- */
if (Q.get('check')) {
  const report = () => {
    let res = { overlaps: [], checked: 0 };
    try {
      if (mapCtx) res = mapAudit(mapCtx);
      else { (window.__geos || []).forEach(([fig, geo, name]) => res.overlaps.push(...auditSvg(fig.querySelector('svg'), geo, 'diagram ' + name))); res.checked = (window.__geos || []).length + ' diagrams'; }
    } catch (err) { errors.push('check: ' + err.message); }
    res.errors = errors;
    const pre = document.createElement('pre'); pre.id = 'visual-check'; pre.hidden = true; pre.textContent = JSON.stringify(res); document.body.appendChild(pre);
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(report, report);
}
</script>
