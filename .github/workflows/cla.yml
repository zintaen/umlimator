name: cla

# The Contributor License Agreement (CLA.md): each pull request's authors sign it once, by commenting on the pull
# request. This workflow never checks out or runs a pull request's code: it reads the event, and writes signatures to
# signatures/cla.json on the cla-signatures branch, apart from main.
on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write        # the signatures file on the cla-signatures branch
  pull-requests: write   # the comment that asks for a signature, and the lock after merge
  statuses: write        # the cla status on the pull request

jobs:
  cla:
    runs-on: ubuntu-latest
    # a pull request's own event, or a comment on a pull request that signs or asks for a recheck
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Every author of the pull request has signed the CLA
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/zintaen/umlimator/blob/main/CLA.md
          branch: cla-signatures
          allowlist: zintaen,dependabot[bot],github-actions[bot]
          create-file-commit-message: "CLA: the signatures file"
          signed-commit-message: "CLA: $contributorName signed in #$pullRequestNo"
