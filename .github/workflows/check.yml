name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: a logo source that changed shows up here, not in someone's picture

env:
  SB: https://raw.githubusercontent.com/EricTechPro/super-board/d0b7d5a/skills/visual  # pinned upstreams (README § What was changed)
  SD: https://raw.githubusercontent.com/caru-ini/stack-diagram/30cbbb7/skills/stack-diagram/scripts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The copied files are upstream's, unmodified (the template became lib/umlimator.js, umlimator's own)
        run: |
          curl -fsSL "$SB/scripts/visual.py" -o engine/scripts/visual.py
          curl -fsSL "$SB/references/schema.md" -o engine/references/schema.md
          curl -fsSL "$SB/references/sections.md" -o engine/references/sections.md
          curl -fsSL "$SD/fetch_icons.py" -o tools/fetch_icons.py
          git diff --exit-code engine/scripts engine/references tools

      - name: layout() draws the benchmark views as recorded, with no DOM (Node)
        run: node --test

      - name: render() embedded in a plain page reports its events and follows update() and destroy()
        run: python3 tests/embed.py

      - name: Upstream changed a copied file since its pin (a warning, time to sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moved() { gh api "repos/$1/compare/$2...HEAD" --jq '.files[].filename' | grep -xE "$3" || true; }
          for f in $(moved EricTechPro/super-board d0b7d5a 'skills/visual/(assets/template.html|scripts/visual.py|references/.*)'; moved caru-ini/stack-diagram 30cbbb7 'skills/stack-diagram/scripts/fetch_icons.py'); do
            echo "::warning::upstream changed $f since its pin"
          done

      - name: Every brand logo still downloads and matches its pinned sha256
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("u", "umlimator.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          man = json.load(open("icons/manifest.json"))
          bad = [k for k, e in man.items() if e["source"] != "lucide" and u.icon_bytes(e) is None]
          print(f"{sum(1 for e in man.values() if e['source'] != 'lucide') - len(bad)} logos ok; failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: The benchmark models lay out as recorded, the same on every run, and in time
        # m50's time is checked on a developer machine (README § Benchmarks: about 1.6 s since 0.6.0, which lays a view
        # out again when some of its lines find no route); a CI runner takes about 3x as long and gets 5x headroom,
        # which the engine before patches 31-35 never met (m50 did not finish in 30 min: bench/results/2026-11-06-ab8daa1-m50.json)
        run: python3 bench/bench.py --runs 2 --timeout 300 --check-determinism --expect bench/expected.json --max-ms m50=8000,b26=2000

      - name: The example renders as committed and its layout check is clean
        run: |
          python3 umlimator.py render examples/bookshop.json --out examples/bookshop.html --no-check
          t='s/"generated": "[^"]*"//'  # the render time is the only difference allowed
          diff -q <(git show HEAD:examples/bookshop.html | sed "$t") <(sed "$t" examples/bookshop.html) \
            || { echo "::error::examples/bookshop.html is stale: render it again and commit it"; exit 1; }
          python3 umlimator.py check examples/bookshop.html | tee /tmp/check.json
          python3 -I -c "import json; s = open('/tmp/check.json').read(); d = json.loads(s[s.find('{'):]); assert not d['problems'] and not d['errors'], (d['problems'], d['errors'])"
