name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: a logo source that changed shows up here, not in someone's picture

env:
  SB: https://raw.githubusercontent.com/EricTechPro/super-board/d0b7d5a/skills/visual  # pinned upstreams (THIRD_PARTY_NOTICES.md)
  SD: https://raw.githubusercontent.com/caru-ini/stack-diagram/30cbbb7/skills/stack-diagram/scripts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The copied files are upstream's, unmodified (the template became lib/umlimator.js, umlimator's own)
        run: |
          curl -fsSL "$SB/scripts/visual.py" -o engine/scripts/visual.py
          curl -fsSL "$SB/references/schema.md" -o engine/references/schema.md
          curl -fsSL "$SB/references/sections.md" -o engine/references/sections.md
          curl -fsSL "$SD/fetch_icons.py" -o tools/fetch_icons.py
          git diff --exit-code engine/scripts engine/references tools

      - name: layout() draws the benchmark views as recorded, with no DOM (Node)
        run: node --test

      - name: render() embedded in a plain page reports its events and follows update() and destroy()
        run: python3 tests/embed.py

      - name: Upstream changed a copied file since its pin (a warning, time to sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moved() { gh api "repos/$1/compare/$2...HEAD" --jq '.files[].filename' | grep -xE "$3" || true; }
          for f in $(moved EricTechPro/super-board d0b7d5a 'skills/visual/(assets/template.html|scripts/visual.py|references/.*)'; moved caru-ini/stack-diagram 30cbbb7 'skills/stack-diagram/scripts/fetch_icons.py'); do
            echo "::warning::upstream changed $f since its pin"
          done

      - name: Every brand logo still downloads and matches its pinned sha256
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("u", "umlimator.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          man = json.load(open("icons/manifest.json"))
          bad = [k for k, e in man.items() if e["source"] != "lucide" and u.icon_bytes(e) is None]
          print(f"{sum(1 for e in man.values() if e['source'] != 'lucide') - len(bad)} logos ok; failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: The benchmark models lay out as recorded, the same on every run, and in time
        # m50's time is checked on a developer machine (about 1.6 s since 0.6.0, which lays a view
        # out again when some of its lines find no route); a CI runner takes about 3x as long and gets 5x headroom,
        # which the engine before patches 31-35 never met (m50 did not finish in 30 min: bench/results/2026-11-06-ab8daa1-m50.json).
        # b26 takes about 0.4 s here and took 0.78-1.36 s on a runner (1.36 s on 0.9.0, with its layout unchanged): 3 s keeps
        # a slow runner from failing a PR on time alone
        run: python3 bench/bench.py --runs 2 --timeout 300 --check-determinism --expect bench/expected.json --max-ms m50=8000,b26=3000

      - name: The example renders as committed and its layout check is clean
        run: |
          python3 umlimator.py render examples/bookshop.json --out examples/bookshop.html --no-check
          t='s/"generated": "[^"]*"//'  # the render time is the only difference allowed
          diff -q <(git show HEAD:examples/bookshop.html | sed "$t") <(sed "$t" examples/bookshop.html) \
            || { echo "::error::examples/bookshop.html is stale: render it again and commit it"; exit 1; }
          python3 umlimator.py check examples/bookshop.html | tee /tmp/check.json
          python3 -I -c "import json; s = open('/tmp/check.json').read(); d = json.loads(s[s.find('{'):]); assert not d['problems'] and not d['errors'], (d['problems'], d['errors'])"

      - name: The other examples render and their layout checks are clean, in the browser and in Node (the site shows them)
        run: |
          for m in examples/*.json; do
            n=$(basename "$m" .json); [ "$n" = bookshop ] && continue   # checked above, with its committed page
            python3 umlimator.py render "$m" --out "/tmp/$n.html" --no-check
            python3 umlimator.py check "/tmp/$n.html" > "/tmp/$n.json"
            python3 -I -c "import json, sys; s = open(sys.argv[1]).read(); d = json.loads(s[s.find('{'):]); assert d['checked'] and not d['problems'] and not d['errors'], (sys.argv[1], d['problems'], d['errors'])" "/tmp/$n.json"
          done
          node examples/layout.mjs

      - name: The Claude Code plugin's manifests parse, its skills name and describe themselves, and map-repo's CLI runs from its pinned release
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re, sys
          market = json.load(open(".claude-plugin/marketplace.json"))
          for p in market["plugins"]:
              json.load(open(pathlib.Path(p["source"]) / ".claude-plugin" / "plugin.json"))
          for s in pathlib.Path("plugins").glob("*/skills/*/SKILL.md"):
              m = re.match(r"---\n(.*?)\n---\n", s.read_text(encoding="utf-8"), re.S)
              meta = dict(line.split(":", 1) for line in (m.group(1).splitlines() if m else []) if ":" in line)
              if not (meta.get("name", "").strip() and meta.get("description", "").strip()):
                  sys.exit(f"{s}: its frontmatter needs a name and a description")
          print(f"{len(market['plugins'])} plugin(s), manifests and skills ok")
          PY
          python3 plugins/umlimator/skills/map-repo/scripts/cli.py --help > /dev/null   # clones the pinned tag and checks its commit

  # The examples, live: on each push to main that passes the checks, every model's page and pictures are built and
  # published with the host pages and the module on GitHub Pages (zintaen.github.io/umlimator).
  site:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          mkdir -p _site/examples
          cp -r lib icons _site/
          cp examples/*.json examples/*.html examples/*.js examples/*.mjs examples/README.md _site/examples/
          for m in examples/*.json; do
            n=$(basename "$m" .json)
            python3 umlimator.py render "$m" --out "_site/examples/$n.html" --no-check
            python3 umlimator.py stills "_site/examples/$n.html" --out "_site/examples/stills/$n"
          done
          sed 's|<meta charset="utf-8">|<meta charset="utf-8"><base href="examples/">|' examples/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Merging a version bump releases it: once the checks pass on main, the version in package.json is tagged, published
  # as a GitHub Release whose notes are that version's section of docs/module-api.md, and published to npm. A version
  # that is tagged (or on npm) already is skipped, so every other push to main releases nothing.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # npm's trusted publishing: npm checks that this workflow publishes, so no npm token is stored
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - name: Tag and release package.json's version, once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then echo "v$v is released already"; exit 0; fi
          python3 -I - "$v" <<'PY'
          import re, sys
          v = sys.argv[1]
          m = re.search(rf"^## {re.escape(v)}: (.+?)\n(.*?)(?=^## |\Z)", open("docs/module-api.md").read(), re.M | re.S)
          if not m:
              sys.exit(f"::error::docs/module-api.md has no '## {v}: ...' section: a release's notes go there")
          open("title.txt", "w").write(f"v{v}: {m.group(1).strip()}")
          open("notes.md", "w").write(f'Install: `npm install umlimator@{v}`, or `"umlimator": "github:zintaen/umlimator#v{v}"`.\n\n{m.group(2).strip()}\n')
          PY
          gh release create "v$v" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md --latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # npm 11: trusted publishing needs 11.5.1 or later

      - name: Publish package.json's version to npm, once (with provenance, from trusted publishing)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "umlimator@$v" version > /dev/null 2>&1; then echo "umlimator@$v is on npm already"; exit 0; fi
          npm publish --access public

