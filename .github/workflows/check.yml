name: check

on:
  push:
    branches: [main]  # a branch runs once, as its pull request; main for the site and the release
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: a logo source that changed shows up here, not in someone's picture

# a new push to a pull request cancels that pull request's run still going; a push to main and the weekly run each get a
# group of their own (the run's id), so they are never cancelled and never wait
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SB: https://raw.githubusercontent.com/EricTechPro/super-board/d0b7d5a/skills/visual  # pinned upstreams (THIRD_PARTY_NOTICES.md)
  SD: https://raw.githubusercontent.com/caru-ini/stack-diagram/30cbbb7/skills/stack-diagram/scripts
  MODDLE: bpmn-moddle@10.3.1 moddle@8.2.1 moddle-xml@12.3.2 min-dash@5.1.0 saxen@11.2.0  # the BPMN XML adapter's library, each of its five packages pinned (notes/milestone-4b.md decision 24)

jobs:
  # The checks, split into jobs that run side by side (the long scripts and suites in shards, each part in exactly one);
  # the job `check` below passes only when every one of them did, so branch protection's required check and the jobs
  # that need it (site, release) are as they were. Each job's comment gives its time on a runner, about.

  # lib/ is what src/ builds, and each source imports what it uses (under 1 min)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4  # npx's download of the pinned compiler: the same version's package, which npm checks against its integrity hash
        with:
          path: ~/.npm
          key: npm-tsc-typescript@5.9.3

      - name: lib/umlimator.js is what src/ builds, and each source imports every name it uses from another (a compiler fetched for CI only, never in the module)
        run: |
          node tools/build.mjs
          git diff --exit-code lib || { echo "::error::lib/ is not what src/ builds: run npm run build and commit it"; exit 1; }
          s=0; npx --yes -p typescript@5.9.3 tsc --allowJs --checkJs --noEmit --skipLibCheck --noUnusedLocals --target es2022 --module es2022 \
            --moduleResolution bundler --lib es2023,dom,dom.iterable $(find src -name '*.js') > /tmp/tsc.txt || s=$?
          [ "$s" = 0 ] || [ "$s" = 2 ] || { cat /tmp/tsc.txt; echo "::error::tsc did not run (exit $s)"; exit 1; }   # 2: it ran and found type errors, which are not checked
          python3 -I - <<'PY'
          import re, sys
          bad = []  # a name no source declares or imports, an import from a file that does not export it, an assignment to an import, an import nothing uses
          for l in open("/tmp/tsc.txt"):
              m = re.match(r"(.+?)\((\d+),\d+\): error (TS\d+): ", l)
              if m and (m[3] in ("TS2304", "TS2552", "TS2632", "TS2305", "TS2307", "TS2459") or m[3] in ("TS6133", "TS6192") and open(m[1]).read().split("\n")[int(m[2]) - 1].startswith("import ")):
                  bad.append(l.strip())
          print("\n".join(bad) or "every source imports what it uses")
          sys.exit(1 if bad else 0)
          PY

  # layout() in Node: the whole node --test suite but the timed tests, its files split in two by Node's own --test-shard
  # (about 2 min each)
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # --test-skip-pattern (22.1+) in the node --test steps; the runner's own Node is whatever its image ships

      - uses: actions/cache@v4  # npm's downloads of the pinned packages below, each checked against its integrity hash on install
        with:
          path: ~/.npm
          key: npm-moddle-${{ env.MODDLE }}

      - name: bpmn-moddle for the BPMN XML adapter's tests, in a scratch folder (an optional adapter's library, never a dependency of the module; each of its five packages pinned, notes/milestone-4b.md decision 24)
        run: npm install --no-save --prefix "$RUNNER_TEMP/moddle" $MODDLE

      - name: A reporter that lists the test files a run loaded (the job shards compares the lists)
        run: |
          cat > "$RUNNER_TEMP/files.mjs" <<'JS'
          import { relative } from "node:path";
          export default async function* files(source) {
            const seen = new Set();
            for await (const e of source) if (e.data?.file) seen.add(relative(process.cwd(), e.data.file));
            yield [...seen].sort().join("\n") + "\n";
          }
          JS

      - name: layout() draws the benchmark views as recorded, with no DOM (Node; shard ${{ matrix.shard }} of 2 of the test files)
        env:
          UMLIMATOR_BPMN_MODDLE: ${{ runner.temp }}/moddle  # the tests that need it fail without it in CI (CI=true)
        run: |
          node --test --test-shard=${{ matrix.shard }}/2 --test-skip-pattern='\(timed\)' \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter="$RUNNER_TEMP/files.mjs" --test-reporter-destination="$RUNNER_TEMP/files.txt"
          mkdir -p "$RUNNER_TEMP/list" && cp "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/list/node-${{ matrix.shard }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: files-node-${{ matrix.shard }}
          path: ${{ runner.temp }}/list
          retention-days: 1
          overwrite: true   # a re-run of the job replaces its list

  # the tests whose titles end "(timed)" assert a CPU or wall time (P1, linear time): one file at a time, so the rest of
  # the suite running beside them cannot push a 1 s ceiling over (the maintainer's decision of 13 Nov 2026). Every test
  # file goes to one of three jobs by Node's --test-shard, so a new timed test is in one without a list to edit; each job
  # runs its files one at a time, alone on its runner (about 2 min each)
  timed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4  # npm's downloads of the pinned packages below, each checked against its integrity hash on install
        with:
          path: ~/.npm
          key: npm-moddle-${{ env.MODDLE }}

      - name: bpmn-moddle for the BPMN XML adapter's tests, in a scratch folder (an optional adapter's library, never a dependency of the module; each of its five packages pinned, notes/milestone-4b.md decision 24)
        run: npm install --no-save --prefix "$RUNNER_TEMP/moddle" $MODDLE

      - name: A reporter that lists the test files a run loaded (the job shards compares the lists)
        run: |
          cat > "$RUNNER_TEMP/files.mjs" <<'JS'
          import { relative } from "node:path";
          export default async function* files(source) {
            const seen = new Set();
            for await (const e of source) if (e.data?.file) seen.add(relative(process.cwd(), e.data.file));
            yield [...seen].sort().join("\n") + "\n";
          }
          JS

      - name: The timed tests hold their budgets, run one file at a time (shard ${{ matrix.shard }} of 3 of the test files)
        env:
          UMLIMATOR_BPMN_MODDLE: ${{ runner.temp }}/moddle  # the tests that need it fail without it in CI (CI=true)
        run: |
          node --test --test-shard=${{ matrix.shard }}/3 --test-concurrency=1 --test-name-pattern='\(timed\)' \
            --test-reporter=spec --test-reporter-destination=stdout --test-reporter="$RUNNER_TEMP/files.mjs" --test-reporter-destination="$RUNNER_TEMP/files.txt"
          mkdir -p "$RUNNER_TEMP/list" && cp "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/list/timed-${{ matrix.shard }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: files-timed-${{ matrix.shard }}
          path: ${{ runner.temp }}/list
          retention-days: 1
          overwrite: true   # a re-run of the job replaces its list

  # the shards above ran every test file, each once: the node shards' files are each in one of them, the timed shards'
  # likewise, and the two splits hold the same files, every one that node --test finds (under 1 min)
  shards:
    needs: [node, timed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: files-*
          merge-multiple: true
          path: lists

      - name: Each test file ran in exactly one node shard and in exactly one timed shard, and both splits hold every file
        run: |
          python3 -I - <<'PY'
          import collections, pathlib, sys
          split = collections.defaultdict(list)
          for f in sorted(pathlib.Path("lists").glob("*.txt")):
              split[f.stem.rsplit("-", 1)[0]].append(set(f.read_text().split()))
          bad = []
          for name, n in (("node", 2), ("timed", 3)):
              got = split.get(name, [])
              twice = collections.Counter(x for s in got for x in s)
              if len(got) != n:
                  bad.append(f"{name}: {len(got)} of its {n} shards reported their files")
              bad += [f"{name}: {x} ran in {k} shards" for x, k in twice.items() if k > 1]
          a, b = set().union(*split.get("node", [set()])), set().union(*split.get("timed", [set()]))
          bad += [f"only the node shards ran {x}" for x in sorted(a - b)] + [f"only the timed shards ran {x}" for x in sorted(b - a)]
          if not a:
              bad.append("no test file reported")
          print("\n".join(bad) or f"{len(a)} test files, each in one node shard and one timed shard")
          sys.exit(1 if bad else 0)
          PY

  # The example renders as committed; the others render and their layout checks are clean; examples/layout.mjs in Node
  # (about 2.5 min)
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4  # the logos this job's renders download, kept per job and per pin: a changed pin misses it, and icon_bytes checks a cached logo's sha256 on every read
        with:
          path: ~/.cache/umlimator/icons
          key: icons-${{ github.job }}-${{ hashFiles('icons/manifest.json') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The example renders as committed and its layout check is clean
        run: |
          python3 umlimator.py render examples/bike-share.json --out examples/bike-share.html --no-check
          t='s/"generated": "[^"]*"//'  # the render time is the only difference allowed
          diff -q <(git show HEAD:examples/bike-share.html | sed "$t") <(sed "$t" examples/bike-share.html) \
            || { echo "::error::examples/bike-share.html is stale: render it again and commit it"; exit 1; }
          python3 umlimator.py check examples/bike-share.html --expand | tee /tmp/check.json   # every view, and with each stacked card unfolded in place, as the loop below checks the others
          # its map views clean; its typed views (step 3 of the one-model plan) at most the crossings their Bookshop and e-bike files
          # kept: at most 21 (Chrome finds 18, Node 17, since step 4's review took the C4 worker's line to the database out; a ceiling, as text widths differ between machines; tests/bike-share.test.mjs
          # pins Node's count per view). A problem reads "view <id>: ..." or "view <id> with <card> unfolded: ...": the id stops at the colon or space
          python3 -I -c "import json, re; s = open('/tmp/check.json').read(); d = json.loads(s[s.find('{'):]); p = d['problems']; maps = ('context', 'system', 'trips', 'fleet', 'ride-end', 'overview', 'api', 'checkout', 'dock-feed', 'demand', 'help'); assert not d['errors'] and all(q.endswith(' cross') and re.match(r'view ([^:\s]+)', q).group(1) not in maps for q in p) and len(p) <= 21, (p, d['errors'])"

      - name: The other examples render and their layout checks are clean, in the browser and in Node (the site shows them)
        run: |
          for m in examples/*.json; do
            n=$(basename "$m" .json); [ "$n" = bike-share ] && continue   # checked above, with its committed page
            python3 umlimator.py render "$m" --out "/tmp/$n.html" --no-check
            x=0; case "$n" in fulfil-activity) x=4;; order-states) x=2;; bookshop-c4) x=8;; bookshop-data-flow) x=2;; bookshop-gcp) x=1;; bookshop-azure) x=2;; bookshop-order-to-shipment) x=5;; bookshop-aws) x=2;; esac   # at most the crossings port repair off leave (text widths differ between machines, so the count is a ceiling)s (notes/stage-4.md §17; notes/milestone-2.md §11; notes/milestone-4a.md §11), counted over both passes; pinned in tests/cli.py and the types' tests
            python3 umlimator.py check "/tmp/$n.html" --expand > "/tmp/$n.json"   # every view, and again with each stacked card unfolded in place (#71)
            python3 -I -c "import json, sys; s = open(sys.argv[1]).read(); d = json.loads(s[s.find('{'):]); p = d['problems']; assert d['checked'] and not d['errors'] and all(q.endswith(' cross') for q in p) and len(p) <= int(sys.argv[2]), (sys.argv[1], p, d['errors'])" "/tmp/$n.json" "$x"
          done
          node examples/layout.mjs

  # The CLI's diff, drift, timelapse, mcp and pdf (tests/cli.py), its parts split over five jobs by UMLIMATOR_TEST_SHARD
  # (tests/shards.py: each part in exactly one; unset, as on a developer's machine, every part runs) (about 2.5 min each)
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The CLI's diff, drift and timelapse write their pages, diff --base a pull request's summary, mcp answers an MCP client, and pdf an example's PDF (shard ${{ matrix.shard }} of 5 of its parts)
        env:
          UMLIMATOR_TEST_SHARD: ${{ matrix.shard }}/5
        run: python3 tests/cli.py

  # render() and the standalone page in headless Chrome (tests/embed.py), its pages split over three jobs as tests/cli.py's
  # parts are (about 2 min each)
  embed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: render() embedded in a plain page reports its events and follows update() and destroy() (shard ${{ matrix.shard }} of 3 of its pages)
        env:
          UMLIMATOR_TEST_SHARD: ${{ matrix.shard }}/3
        run: python3 tests/embed.py

  # The MCP server's page in headless Chrome; Python 3.9; the schema and the plugin; the imported example, the icon packs,
  # the release steps and the diff Action's dry run (about 2 min)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The CLI parses on Python 3.9, the oldest the README and the map-repo skill name (3.12's f-strings do not; setup-python has no 3.9 for this runner, so its image)
        run: docker run --rm -v "$PWD:/w" -w /w python:3.9-slim sh -c 'python -m py_compile umlimator*.py plugins/umlimator/skills/map-repo/scripts/*.py'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4  # only npm's content-addressed tarball store, each read checked against its integrity hash; npx's install tree (~/.npm/_npx) stays out, so ajv-cli 5 and its unpinned dependencies (ajv ^8 among them) resolve fresh on every run, as before
        with:
          path: ~/.npm/_cacache
          key: npm-cacache-ajv-cli@5

      - name: The MCP server's page in headless Chrome says what it shows, and a tool says shown only once it did
        run: python3 tests/mcp.py

      - name: Every example model is valid under the model's JSON Schema (a validator fetched for CI only, never in the module)
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --all-errors -s lib/umlimator.schema.json -d "examples/*.json"

      - name: The Claude Code plugin's manifests parse, its skills name and describe themselves, and map-repo's CLI runs from its pinned release
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re, sys
          market = json.load(open(".claude-plugin/marketplace.json"))
          for p in market["plugins"]:
              json.load(open(pathlib.Path(p["source"]) / ".claude-plugin" / "plugin.json"))
          for s in pathlib.Path("plugins").glob("*/skills/*/SKILL.md"):
              m = re.match(r"---\n(.*?)\n---\n", s.read_text(encoding="utf-8"), re.S)
              meta = dict(line.split(":", 1) for line in (m.group(1).splitlines() if m else []) if ":" in line)
              if not (meta.get("name", "").strip() and meta.get("description", "").strip()):
                  sys.exit(f"{s}: its frontmatter needs a name and a description")
          print(f"{len(market['plugins'])} plugin(s), manifests and skills ok")
          PY
          python3 plugins/umlimator/skills/map-repo/scripts/cli.py --help > /tmp/cli-help   # clones the pinned tag and checks its commit
          python3 -I - <<'PY'
          import re, sys
          has = set(re.search(r"\{([\w,-]+)\}", open("/tmp/cli-help").read()).group(1).split(","))
          said = set(re.findall(r"(?:\bcli|umlimator\.py) ([a-z][\w-]*)", open("plugins/umlimator/skills/map-repo/SKILL.md", encoding="utf-8").read()))
          if said - has:
              sys.exit(f"map-repo's SKILL.md names commands its pinned CLI lacks: {', '.join(sorted(said - has))}")
          print(f"map-repo's commands ({', '.join(sorted(said))}) are all in its pinned CLI")
          # the pinned release runs the engine isolated (-I): a stdlib-named .py file in the repository it maps never loads (audit 5)
          import os, pathlib
          ref = re.search(r'REF, SHA = "([^"]+)"', open("plugins/umlimator/skills/map-repo/scripts/cli.py", encoding="utf-8").read()).group(1)
          cache = pathlib.Path(os.environ.get("XDG_CACHE_HOME") or pathlib.Path.home() / ".cache") / "umlimator" / "cli" / ref
          if '[sys.executable, "-I", "-c", run' not in (cache / "umlimator.py").read_text(encoding="utf-8"):
              sys.exit(f"map-repo's pinned CLI ({ref}) runs the engine without -I: re-pin it to a release that has it (v0.30.0 or later)")
          print(f"map-repo's pinned CLI ({ref}) runs the engine with -I")
          PY

      - name: The imported example is what import writes from its Structurizr source, so the two can't drift apart
        run: |
          python3 umlimator.py import examples/bike-share.dsl --out /tmp/bike-share-c4.json
          diff examples/bike-share-c4.json /tmp/bike-share-c4.json \
            || { echo "::error::examples/bike-share-c4.json is not what import writes from examples/bike-share.dsl: import it again and commit it"; exit 1; }

      - name: umlimator.py pack fetches a synthetic icon pack only after its terms and a yes, by its pinned size and sha256, and a render never downloads one (no vendor contacted)
        run: python3 tests/packs.py

      - name: The diff Action's comment step, the release job's steps and map-repo's CLI, run against stand-ins for GitHub, git and npm
        run: python3 tests/steps.py

      - name: The diff Action pictures what a pull request changes in the example models (a dry run, without a comment)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          models: examples/*.json
          comment: false

  # The CLI's error cases, and import (about 2.5 min)
  outcomes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: When something goes wrong, the CLI says so and leaves the previous output (Chrome failing, --views, render, pdf, stills, diff --base, icons, mcp)
        run: python3 tests/outcomes.py

      - uses: actions/cache@v4  # npm's downloads of the pinned packages below, each checked against its integrity hash on install
        with:
          path: ~/.npm
          key: npm-moddle-${{ env.MODDLE }}

      - name: bpmn-moddle for the BPMN XML adapter's tests, in a scratch folder (an optional adapter's library, never a dependency of the module; each of its five packages pinned, notes/milestone-4b.md decision 24)
        run: npm install --no-save --prefix "$RUNNER_TEMP/moddle" $MODDLE

      - name: The CLI's import reads a sample of each format into a model that validates, renders and checks clean
        env:
          UMLIMATOR_BPMN_MODDLE: ${{ runner.temp }}/moddle  # the tests that need it fail without it in CI (CI=true)
        run: python3 tests/import.py

  # The upstream copies and the logos; the bench, its models split over two jobs by their views (about 2 min each)
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4  # the logos this job's renders download, kept per job and per pin: a changed pin misses it, and icon_bytes checks a cached logo's sha256 on every read
        with:
          path: ~/.cache/umlimator/icons
          key: icons-${{ github.job }}-${{ hashFiles('icons/manifest.json') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The copied files are upstream's, unmodified (the template became lib/umlimator.js, umlimator's own)
        if: matrix.shard == 1   # once
        run: |
          curl -fsSL "$SB/scripts/visual.py" -o engine/scripts/visual.py
          curl -fsSL "$SB/references/schema.md" -o engine/references/schema.md
          curl -fsSL "$SB/references/sections.md" -o engine/references/sections.md
          curl -fsSL "$SD/fetch_icons.py" -o tools/fetch_icons.py
          git diff --exit-code engine/scripts engine/references tools

      - name: Upstream changed a copied file since its pin (a warning, time to sync)
        if: matrix.shard == 1   # once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moved() { gh api "repos/$1/compare/$2...HEAD" --jq '.files[].filename' | grep -xE "$3" || true; }
          for f in $(moved EricTechPro/super-board d0b7d5a 'skills/visual/(assets/template.html|scripts/visual.py|references/.*)'; moved caru-ini/stack-diagram 30cbbb7 'skills/stack-diagram/scripts/fetch_icons.py'); do
            echo "::warning::upstream changed $f since its pin"
          done

      - name: Every brand logo still downloads and matches its pinned sha256
        if: matrix.shard == 1   # once
        run: |
          export UMLIMATOR_ICON_CACHE="$RUNNER_TEMP/icons-fresh"   # an empty cache, not the job's: every logo comes from its source
          python3 -I - <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("u", "umlimator.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          man = json.load(open("icons/manifest.json"))
          bad = [k for k, e in man.items() if e["source"] != "lucide" and not e.get("pack") and e.get("render") != "cache" and u.icon_bytes(e) is None]  # an icon pack's, or one a render never downloads (entra): never fetched by CI
          print(f"{sum(1 for e in man.values() if e['source'] != 'lucide') - len(bad)} logos ok; failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: The benchmark models lay out as recorded, the same on every run, and in time (shard ${{ matrix.shard }} of 2 of the models)
        # m50's time is checked on a developer machine (about 1.6 s since 0.6.0, which lays a view
        # out again when some of its lines find no route); a CI runner takes about 3x as long and gets 5x headroom,
        # which the engine before patches 31-35 never met (m50 did not finish in 30 min: bench/results/2026-11-06-ab8daa1-m50.json).
        # b26 takes about 0.4 s here and took 0.78-1.36 s on a runner (1.36 s on 0.9.0, with its layout unchanged): 3 s keeps
        # a slow runner from failing a PR on time alone
        # Each model goes to one shard, the most views first, from bench.py's own list (every bench/models/*.json and
        # examples/bike-share.json, its map views only), so a new model is benchmarked without a list to edit
        run: |
          models=$(python3 -I - ${{ matrix.shard }} 2 <<'PY'
          import importlib.util, json, pathlib, sys
          k, n = map(int, sys.argv[1:])
          s = importlib.util.spec_from_file_location("bench", "bench/bench.py"); b = importlib.util.module_from_spec(s); s.loader.exec_module(b)
          paths = sorted(pathlib.Path("bench/models").glob("*.json")) + [pathlib.Path("examples/bike-share.json")]
          views = {p.stem: len(b.bench_views(json.loads(p.read_text()))) for p in paths}  # bench.py's own list of the views it times
          load, shard = [0] * n, {}
          for x in sorted(views, key=lambda x: (-views[x], x)):
              i = load.index(min(load)); load[i] += views[x]; shard[x] = i + 1
          assert len(views) == len(paths) and sorted(shard) == sorted(views), "a model in no shard"
          print(",".join(x for x in views if shard[x] == k))
          PY
          )
          [ -n "$models" ] || { echo "::error::shard ${{ matrix.shard }} of the bench has no model"; exit 1; }
          echo "models: $models"
          python3 bench/bench.py --models "$models" --runs 2 --timeout 300 --check-determinism --expect bench/expected.json --max-ms m50=8000,b26=3000

  # the documentation site builds, with no dead links (VitePress, docs/; the site job publishes it from main) (under 1 min)
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: The documentation site builds, with no dead links, and its built changelog names no host application
        run: |
          npm ci --prefix docs
          npm --prefix docs run build
          node --test tests/site.test.mjs   # the node job runs it too, without the built site

  check:
    needs: [build, node, timed, shards, examples, cli, embed, browser, outcomes, bench, docs]
    if: always()   # runs when one of them fails or is cancelled, to fail rather than be skipped (a skipped required check passes)
    runs-on: ubuntu-latest
    steps:
      - name: Every check job succeeded (a matrix job only when each of its shards did)
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do [ "$r" = success ] || { echo "::error::a check job ended: $r"; exit 1; }; done

  # The site: on each push to main that passes the checks, the documentation site and every example model's page and
  # pictures are built and published with the host pages and the module on GitHub Pages (zintaen.github.io/umlimator).
  site:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # VitePress, for the documentation site

      # Since 16 Nov 2026 (notes/milestone-4a.md §16) the Pages site, and only it, shows the vendors' icons: their terms
      # are accepted here by pin, so a re-pin in icons/packs.json must edit this line too (a new acceptance; tests/packs.py
      # checks the two agree). A pack that cannot be fetched leaves the site drawing its glyphs, with a warning.
      - name: Fetch the cloud icon packs, their terms accepted
        env:
          UMLIMATOR_ICON_CACHE: ${{ runner.temp }}/icons
        run: |
          for a in gcp@2026-11-14 azure@V25 aws@2026-07-31; do
            python3 umlimator.py pack fetch "${a%@*}" --accept-terms "$a" || echo "::warning::the ${a%@*} pack was not fetched; the site draws its glyphs"
          done

      - name: Build the site
        env:
          UMLIMATOR_ICON_CACHE: ${{ runner.temp }}/icons   # the packs fetched above: the site's cloud examples show real icons, legal lines and the not-affiliated notice; nothing committed does
        run: |
          mkdir -p _site/examples
          cp -r lib icons _site/
          cp examples/*.json examples/*.html examples/*.js examples/*.mjs examples/README.md _site/examples/
          cp -r examples/traces _site/examples/   # replay.html's trace, which bike-share keeps as a view too (#96)
          for m in examples/*.json; do
            n=$(basename "$m" .json)
            python3 umlimator.py render "$m" --out "_site/examples/$n.html" --no-check
            python3 umlimator.py stills "_site/examples/$n.html" --out "_site/examples/stills/$n"
            python3 umlimator.py pdf "_site/examples/$n.html" --out "_site/examples/$n.pdf"   # every view in one PDF (#93)
            for s in $(python3 -I -c "import json, sys; print(' '.join(s['id'] for s in json.load(open(sys.argv[1])).get('stories', [])))" "$m"); do
              python3 umlimator.py record "_site/examples/$n.html" --story "$s" --out "_site/examples/stills/$n/story-$s.png"   # each story, recorded
            done
          done
          # each diagram type's page (tools/types.mjs): one hand-authored model drawing one comprehensive example of the
          # type, opened on its main view, with its alternatives; the gallery's Diagrams part has a card for each
          mkdir -p _site/examples/types
          cp examples/types/*.json _site/examples/types/
          for m in examples/types/*.json; do
            n=$(basename "$m" .json)
            python3 umlimator.py render "$m" --out "_site/examples/types/$n.html" --no-check
            python3 umlimator.py stills "_site/examples/types/$n.html" --out "_site/examples/types/stills/$n"
            python3 umlimator.py pdf "_site/examples/types/$n.html" --out "_site/examples/types/$n.pdf"
          done

      # the documentation site (VitePress, docs/) at the root, around the examples: the gallery stays at /examples/
      - name: Build the documentation site
        run: |
          npm ci --prefix docs
          npm --prefix docs run build
          cp -r docs/.vitepress/dist/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1   # the artifact holds vendor icons: kept no longer than the deploy needs

      - id: deploy
        uses: actions/deploy-pages@v4

  # Merging a version bump releases it: once the checks pass on main, package.json's version is tagged at that push's
  # commit and published to npm from it, and then its GitHub Release (notes: that version's section of docs/module-api.md)
  # is published; until npm has the version, the Release is a draft. Every other push to main releases nothing: a version
  # tagged at another commit is never published from this one, and one whose release did not finish fails each later push
  # and names the commit whose release job to re-run, which finishes it (tests/steps.py runs these steps).
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # npm's trusted publishing: npm checks that this workflow publishes, so no npm token is stored
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - name: Tag package.json's version at this commit, once, and draft its Release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          at=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | tail -n1 | cut -f1)   # the tag's commit (an annotated tag peeled)
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then   # another commit's version: nothing is published from this one
            if [ "$(gh release view "v$v" --json isDraft --jq .isDraft 2> /dev/null)" = false ]; then echo "v$v is released already, from $at"; exit 0; fi
            echo "::error::v$v is tagged at $at, but its release did not finish (its GitHub Release is a draft or missing): re-run the release job of the push of $at; for a tag made by hand, delete it and re-run this one"
            exit 1
          fi
          python3 -I - "$v" <<'PY'
          import re, sys
          v = sys.argv[1]
          m = re.search(rf"^## {re.escape(v)}: (.+?)\n(.*?)(?=^## |\Z)", open("docs/module-api.md").read(), re.M | re.S)
          if not m:
              sys.exit(f"::error::docs/module-api.md has no '## {v}: ...' section: a release's notes go there")
          open("title.txt", "w").write(f"v{v}: {m.group(1).strip()}")
          open("notes.md", "w").write(f'Install: `npm install umlimator@{v}`, or `"umlimator": "github:zintaen/umlimator#v{v}"`.\n\n{m.group(2).strip()}\n')
          PY
          [ -n "$at" ] || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$v" -f sha="$GITHUB_SHA" > /dev/null
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --verify-tag --draft --title "$(cat title.txt)" --notes-file notes.md
          echo "release=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.release == 'yes'
        with:
          node-version: 24  # npm 11: trusted publishing needs 11.5.1 or later

      - name: Publish the tagged version to npm, once (with provenance, from trusted publishing), then its Release
        id: npm
        if: steps.tag.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "umlimator@$v" version > /dev/null 2>&1; then echo "umlimator@$v is on npm already"; else npm publish --access public; fi
          if [ "$(gh release view "v$v" --json isDraft --jq .isDraft)" = true ]; then gh release edit "v$v" --draft=false --latest; fi
