name: check

on:
  push:
    branches: [main]  # a branch runs once, as its pull request; main for the site and the release
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: a logo source that changed shows up here, not in someone's picture

env:
  SB: https://raw.githubusercontent.com/EricTechPro/super-board/d0b7d5a/skills/visual  # pinned upstreams (THIRD_PARTY_NOTICES.md)
  SD: https://raw.githubusercontent.com/caru-ini/stack-diagram/30cbbb7/skills/stack-diagram/scripts

jobs:
  # The checks, in four jobs that run side by side; the job `check` below passes only when all four did, so branch
  # protection's required check and the jobs that need it (site, release) are as they were.
  # lib/ is what src/ builds; layout() in Node, the timed tests, and the examples render and check clean (about 4 min)
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # --test-skip-pattern (22.1+) in the node --test steps; the runner's own Node is whatever its image ships

      - name: lib/umlimator.js is what src/ builds, and each source imports every name it uses from another (a compiler fetched for CI only, never in the module)
        run: |
          node tools/build.mjs
          git diff --exit-code lib || { echo "::error::lib/ is not what src/ builds: run npm run build and commit it"; exit 1; }
          s=0; npx --yes -p typescript@5.9.3 tsc --allowJs --checkJs --noEmit --skipLibCheck --noUnusedLocals --target es2022 --module es2022 \
            --moduleResolution bundler --lib es2023,dom,dom.iterable $(find src -name '*.js') > /tmp/tsc.txt || s=$?
          [ "$s" = 0 ] || [ "$s" = 2 ] || { cat /tmp/tsc.txt; echo "::error::tsc did not run (exit $s)"; exit 1; }   # 2: it ran and found type errors, which are not checked
          python3 -I - <<'PY'
          import re, sys
          bad = []  # a name no source declares or imports, an import from a file that does not export it, an assignment to an import, an import nothing uses
          for l in open("/tmp/tsc.txt"):
              m = re.match(r"(.+?)\((\d+),\d+\): error (TS\d+): ", l)
              if m and (m[3] in ("TS2304", "TS2552", "TS2632", "TS2305", "TS2307", "TS2459") or m[3] in ("TS6133", "TS6192") and open(m[1]).read().split("\n")[int(m[2]) - 1].startswith("import ")):
                  bad.append(l.strip())
          print("\n".join(bad) or "every source imports what it uses")
          sys.exit(1 if bad else 0)
          PY

      - name: layout() draws the benchmark views as recorded, with no DOM (Node)
        run: node --test --test-skip-pattern='\(timed\)'

      # the tests whose titles end "(timed)" assert a CPU or wall time (P1, linear time): one file at a time, so the
      # rest of the suite running beside them cannot push a 1 s ceiling over (the maintainer's decision of 13 Nov 2026)
      - name: The timed tests hold their budgets, run one file at a time
        if: ${{ !cancelled() }}   # still runs when the step above fails, so a failing test does not hide the budgets
        run: node --test --test-concurrency=1 --test-name-pattern='\(timed\)'

      - name: The example renders as committed and its layout check is clean
        run: |
          python3 umlimator.py render examples/bookshop.json --out examples/bookshop.html --no-check
          t='s/"generated": "[^"]*"//'  # the render time is the only difference allowed
          diff -q <(git show HEAD:examples/bookshop.html | sed "$t") <(sed "$t" examples/bookshop.html) \
            || { echo "::error::examples/bookshop.html is stale: render it again and commit it"; exit 1; }
          python3 umlimator.py check examples/bookshop.html | tee /tmp/check.json
          python3 -I -c "import json; s = open('/tmp/check.json').read(); d = json.loads(s[s.find('{'):]); assert not d['problems'] and not d['errors'], (d['problems'], d['errors'])"

      - name: The other examples render and their layout checks are clean, in the browser and in Node (the site shows them)
        run: |
          for m in examples/*.json; do
            n=$(basename "$m" .json); [ "$n" = bookshop ] && continue   # checked above, with its committed page
            python3 umlimator.py render "$m" --out "/tmp/$n.html" --no-check
            x=0; case "$n" in fulfil-activity) x=4;; order-states) x=2;; bookshop-atlas) x=6;; esac   # the crossings port repair off leaves (notes/stage-4.md §17), counted over both passes; pinned in tests/cli.py and the types' tests; the atlas keeps both files' (tests/atlas.test.mjs)
            python3 umlimator.py check "/tmp/$n.html" --expand > "/tmp/$n.json"   # every view, and again with each stacked card unfolded in place (#71)
            python3 -I -c "import json, sys; s = open(sys.argv[1]).read(); d = json.loads(s[s.find('{'):]); p = d['problems']; assert d['checked'] and not d['errors'] and all(q.endswith(' cross') for q in p) and len(p) == int(sys.argv[2]), (sys.argv[1], p, d['errors'])" "/tmp/$n.json" "$x"
          done
          node examples/layout.mjs

  # render() and the MCP server's page in headless Chrome; the schema and the plugin (about 4 min)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # --test-skip-pattern (22.1+) in the node --test steps; the runner's own Node is whatever its image ships

      - name: render() embedded in a plain page reports its events and follows update() and destroy()
        run: python3 tests/embed.py

      - name: The MCP server's page in headless Chrome says what it shows, and a tool says shown only once it did
        run: python3 tests/mcp.py

      - name: Every example model is valid under the model's JSON Schema (a validator fetched for CI only, never in the module)
        run: npx --yes ajv-cli@5 validate --spec=draft2020 --all-errors -s lib/umlimator.schema.json -d "examples/*.json"

      - name: The Claude Code plugin's manifests parse, its skills name and describe themselves, and map-repo's CLI runs from its pinned release
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re, sys
          market = json.load(open(".claude-plugin/marketplace.json"))
          for p in market["plugins"]:
              json.load(open(pathlib.Path(p["source"]) / ".claude-plugin" / "plugin.json"))
          for s in pathlib.Path("plugins").glob("*/skills/*/SKILL.md"):
              m = re.match(r"---\n(.*?)\n---\n", s.read_text(encoding="utf-8"), re.S)
              meta = dict(line.split(":", 1) for line in (m.group(1).splitlines() if m else []) if ":" in line)
              if not (meta.get("name", "").strip() and meta.get("description", "").strip()):
                  sys.exit(f"{s}: its frontmatter needs a name and a description")
          print(f"{len(market['plugins'])} plugin(s), manifests and skills ok")
          PY
          python3 plugins/umlimator/skills/map-repo/scripts/cli.py --help > /dev/null   # clones the pinned tag and checks its commit

  # The CLI's diff, drift, timelapse, mcp and pdf, and the diff Action's dry run (about 4.5 min)
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # --test-skip-pattern (22.1+) in the node --test steps; the runner's own Node is whatever its image ships

      - name: The CLI's diff, drift and timelapse write their pages, diff --base a pull request's summary, mcp answers an MCP client, and pdf an example's PDF
        run: python3 tests/cli.py

      - name: The imported example is what import writes from its Structurizr source, so the two can't drift apart
        run: |
          python3 umlimator.py import examples/clinic.dsl --out /tmp/clinic.json
          diff examples/clinic.json /tmp/clinic.json \
            || { echo "::error::examples/clinic.json is not what import writes from examples/clinic.dsl: import it again and commit it"; exit 1; }

      - name: The diff Action pictures what a pull request changes in the example models (a dry run, without a comment)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          models: examples/*.json
          comment: false

  # The upstream copies, the CLI's error cases, import, the release steps, the logos and the bench (about 4.5 min)
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # --test-skip-pattern (22.1+) in the node --test steps; the runner's own Node is whatever its image ships

      - name: The copied files are upstream's, unmodified (the template became lib/umlimator.js, umlimator's own)
        run: |
          curl -fsSL "$SB/scripts/visual.py" -o engine/scripts/visual.py
          curl -fsSL "$SB/references/schema.md" -o engine/references/schema.md
          curl -fsSL "$SB/references/sections.md" -o engine/references/sections.md
          curl -fsSL "$SD/fetch_icons.py" -o tools/fetch_icons.py
          git diff --exit-code engine/scripts engine/references tools

      - name: When something goes wrong, the CLI says so and leaves the previous output (Chrome failing, --views, render, pdf, stills, diff --base, icons, mcp)
        run: python3 tests/outcomes.py

      - name: The CLI's import reads a sample of each format into a model that validates, renders and checks clean
        run: python3 tests/import.py

      - name: The diff Action's comment step, the release job's steps and map-repo's CLI, run against stand-ins for GitHub, git and npm
        run: python3 tests/steps.py

      - name: Upstream changed a copied file since its pin (a warning, time to sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moved() { gh api "repos/$1/compare/$2...HEAD" --jq '.files[].filename' | grep -xE "$3" || true; }
          for f in $(moved EricTechPro/super-board d0b7d5a 'skills/visual/(assets/template.html|scripts/visual.py|references/.*)'; moved caru-ini/stack-diagram 30cbbb7 'skills/stack-diagram/scripts/fetch_icons.py'); do
            echo "::warning::upstream changed $f since its pin"
          done

      - name: Every brand logo still downloads and matches its pinned sha256
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("u", "umlimator.py"); u = importlib.util.module_from_spec(spec); spec.loader.exec_module(u)
          man = json.load(open("icons/manifest.json"))
          bad = [k for k, e in man.items() if e["source"] != "lucide" and u.icon_bytes(e) is None]
          print(f"{sum(1 for e in man.values() if e['source'] != 'lucide') - len(bad)} logos ok; failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: The benchmark models lay out as recorded, the same on every run, and in time
        # m50's time is checked on a developer machine (about 1.6 s since 0.6.0, which lays a view
        # out again when some of its lines find no route); a CI runner takes about 3x as long and gets 5x headroom,
        # which the engine before patches 31-35 never met (m50 did not finish in 30 min: bench/results/2026-11-06-ab8daa1-m50.json).
        # b26 takes about 0.4 s here and took 0.78-1.36 s on a runner (1.36 s on 0.9.0, with its layout unchanged): 3 s keeps
        # a slow runner from failing a PR on time alone
        run: python3 bench/bench.py --runs 2 --timeout 300 --check-determinism --expect bench/expected.json --max-ms m50=8000,b26=3000

  check:
    needs: [node, browser, cli, bench]
    if: always()   # runs when one of them fails or is cancelled, to fail rather than be skipped (a skipped required check passes)
    runs-on: ubuntu-latest
    steps:
      - name: Every check job succeeded
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do [ "$r" = success ] || { echo "::error::a check job ended: $r"; exit 1; }; done

  # The examples, live: on each push to main that passes the checks, every model's page and pictures are built and
  # published with the host pages and the module on GitHub Pages (zintaen.github.io/umlimator).
  site:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          mkdir -p _site/examples
          cp -r lib icons _site/
          cp examples/*.json examples/*.html examples/*.js examples/*.mjs examples/README.md _site/examples/
          cp -r examples/traces _site/examples/   # replay.html's trace, which bike-share keeps as a view too (#96)
          for m in examples/*.json; do
            n=$(basename "$m" .json)
            python3 umlimator.py render "$m" --out "_site/examples/$n.html" --no-check
            python3 umlimator.py stills "_site/examples/$n.html" --out "_site/examples/stills/$n"
            python3 umlimator.py pdf "_site/examples/$n.html" --out "_site/examples/$n.pdf"   # every view in one PDF (#93)
            for s in $(python3 -I -c "import json, sys; print(' '.join(s['id'] for s in json.load(open(sys.argv[1])).get('stories', [])))" "$m"); do
              python3 umlimator.py record "_site/examples/$n.html" --story "$s" --out "_site/examples/stills/$n/story-$s.png"   # each story, recorded
            done
          done
          sed 's|<meta charset="utf-8">|<meta charset="utf-8"><base href="examples/">|' examples/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Merging a version bump releases it: once the checks pass on main, package.json's version is tagged at that push's
  # commit and published to npm from it, and then its GitHub Release (notes: that version's section of docs/module-api.md)
  # is published; until npm has the version, the Release is a draft. Every other push to main releases nothing: a version
  # tagged at another commit is never published from this one, and one whose release did not finish fails each later push
  # and names the commit whose release job to re-run, which finishes it (tests/steps.py runs these steps).
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # npm's trusted publishing: npm checks that this workflow publishes, so no npm token is stored
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - name: Tag package.json's version at this commit, once, and draft its Release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          at=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | tail -n1 | cut -f1)   # the tag's commit (an annotated tag peeled)
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then   # another commit's version: nothing is published from this one
            if [ "$(gh release view "v$v" --json isDraft --jq .isDraft 2> /dev/null)" = false ]; then echo "v$v is released already, from $at"; exit 0; fi
            echo "::error::v$v is tagged at $at, but its release did not finish (its GitHub Release is a draft or missing): re-run the release job of the push of $at; for a tag made by hand, delete it and re-run this one"
            exit 1
          fi
          python3 -I - "$v" <<'PY'
          import re, sys
          v = sys.argv[1]
          m = re.search(rf"^## {re.escape(v)}: (.+?)\n(.*?)(?=^## |\Z)", open("docs/module-api.md").read(), re.M | re.S)
          if not m:
              sys.exit(f"::error::docs/module-api.md has no '## {v}: ...' section: a release's notes go there")
          open("title.txt", "w").write(f"v{v}: {m.group(1).strip()}")
          open("notes.md", "w").write(f'Install: `npm install umlimator@{v}`, or `"umlimator": "github:zintaen/umlimator#v{v}"`.\n\n{m.group(2).strip()}\n')
          PY
          [ -n "$at" ] || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$v" -f sha="$GITHUB_SHA" > /dev/null
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --verify-tag --draft --title "$(cat title.txt)" --notes-file notes.md
          echo "release=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.release == 'yes'
        with:
          node-version: 24  # npm 11: trusted publishing needs 11.5.1 or later

      - name: Publish the tagged version to npm, once (with provenance, from trusted publishing), then its Release
        id: npm
        if: steps.tag.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "umlimator@$v" version > /dev/null 2>&1; then echo "umlimator@$v is on npm already"; else npm publish --access public; fi
          if [ "$(gh release view "v$v" --json isDraft --jq .isDraft)" = true ]; then gh release edit "v$v" --draft=false --latest; fi
